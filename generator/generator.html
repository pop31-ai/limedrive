<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LimeDrive Game Generator</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#8BC34A;--dark:#33691E;--accent:#CDDC39;
  --bg:#1a1a2e;--bg2:#16213e;--bg3:#0f3460;
  --text:#e0e0e0;--text-dim:#9e9e9e;--text-bright:#ffffff;
  --danger:#e74c3c;--warning:#f39c12;--info:#2196f3;
  --surface:#1e2a3a;--surface2:#253446;--surface3:#2c3e50;
  --border:#2a3a4a;--border-light:#3a4a5a;
  --radius:6px;--radius-lg:10px;
  --shadow:0 2px 8px rgba(0,0,0,.3);
  --transition:all .2s ease;
}
html,body{
  height:100%;
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{display:grid;grid-template-rows:48px 1fr;height:100vh;width:100vw}
header{
  background:linear-gradient(135deg,var(--bg2),var(--bg3));
  display:flex;align-items:center;padding:0 16px;gap:16px;
  border-bottom:2px solid var(--dark);z-index:100;
}
header h1{font-size:18px;font-weight:700;color:var(--primary);white-space:nowrap;letter-spacing:-.5px}
header h1 span{color:var(--accent)}
.header-tabs{display:flex;gap:2px;flex:1}
.header-tab{
  padding:8px 20px;border:none;background:transparent;
  color:var(--text-dim);cursor:pointer;font-size:13px;
  font-weight:600;border-bottom:2px solid transparent;
  transition:var(--transition);border-radius:var(--radius) var(--radius) 0 0;
}
.header-tab:hover{color:var(--text);background:rgba(139,195,74,.08)}
.header-tab.active{color:var(--primary);border-bottom-color:var(--primary);background:rgba(139,195,74,.1)}
.header-actions{display:flex;gap:6px;flex-shrink:0}
.btn{
  padding:6px 14px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);
  border-radius:var(--radius);cursor:pointer;font-size:12px;
  font-weight:600;transition:var(--transition);white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;
}
.btn:hover{background:var(--surface2);border-color:var(--primary)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--dark);border-color:var(--primary);color:var(--primary)}
.btn-primary:hover{background:var(--primary);color:#fff}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-accent{background:rgba(205,220,57,.15);border-color:var(--accent);color:var(--accent)}
.btn-accent:hover{background:var(--accent);color:#1a1a2e}
.btn-sm{padding:4px 10px;font-size:11px}
#main{display:grid;overflow:hidden}
.panel-left{
  background:var(--bg2);border-right:1px solid var(--border);
  overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--dark) var(--bg2);
}
.panel-center{display:flex;flex-direction:column;overflow:hidden}
.panel-right{
  background:var(--bg2);border-left:1px solid var(--border);
  overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--dark) var(--bg2);
}
.panel-section{padding:12px;border-bottom:1px solid var(--border)}
.panel-section h3{
  font-size:11px;text-transform:uppercase;letter-spacing:1.2px;
  color:var(--primary);margin-bottom:10px;font-weight:700;
  display:flex;align-items:center;gap:6px;
}
.slider-group{margin-bottom:10px}
.slider-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:4px}
.slider-label .val{color:var(--accent);font-weight:700;font-family:'Consolas','Courier New',monospace;font-size:11px}
input[type=range]{
  -webkit-appearance:none;width:100%;height:6px;border-radius:3px;
  background:var(--bg);outline:none;cursor:pointer;
  transition:var(--transition);
}
input[type=range]:hover{background:#222}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--primary);border:2px solid var(--dark);
  cursor:pointer;transition:transform .15s;
  box-shadow:0 0 6px rgba(139,195,74,.3);
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.3);box-shadow:0 0 10px rgba(139,195,74,.5)}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:var(--primary);
  border:2px solid var(--dark);cursor:pointer;
}
.entity-list{max-height:calc(100vh - 260px);overflow-y:auto;scrollbar-width:thin}
.entity-item{
  display:flex;align-items:center;gap:8px;padding:6px 8px;
  border-radius:var(--radius);margin-bottom:4px;
  background:var(--surface);cursor:pointer;
  border:1px solid transparent;transition:var(--transition);
}
.entity-item:hover{border-color:var(--border);background:var(--surface2)}
.entity-item.selected{border-color:var(--primary);background:rgba(139,195,74,.1)}
.entity-color{width:16px;height:16px;border-radius:3px;border:1px solid rgba(255,255,255,.2);flex-shrink:0}
.entity-name{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entity-type-badge{
  font-size:9px;padding:2px 6px;border-radius:8px;
  background:var(--bg);color:var(--text-dim);
  text-transform:uppercase;font-weight:700;letter-spacing:.5px;
}
.entity-del{
  width:20px;height:20px;border:none;background:transparent;
  color:var(--danger);cursor:pointer;border-radius:3px;
  font-size:14px;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;
}
.entity-item:hover .entity-del{opacity:1}
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.7);display:none;
  align-items:center;justify-content:center;z-index:1000;
  backdrop-filter:blur(4px);
}
.modal-overlay.visible{display:flex}
.modal{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:20px;
  max-width:700px;width:90%;max-height:80vh;
  display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.modal h2{color:var(--primary);margin-bottom:12px;font-size:16px}
.modal pre{
  background:var(--bg);padding:12px;border-radius:var(--radius);
  overflow:auto;flex:1;font-size:11px;color:var(--accent);
  border:1px solid var(--border);tab-size:2;
  font-family:'Consolas','Courier New',monospace;max-height:50vh;
}
.modal-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.color-preview{width:100%;height:32px;border-radius:var(--radius);border:1px solid var(--border);margin-top:4px}
.entity-editor{padding:12px;overflow-y:auto;flex:1;scrollbar-width:thin}
.entity-editor-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.entity-editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.section-divider{height:1px;background:var(--border);margin:12px 0}
.empty-state{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px;color:var(--text-dim);
  text-align:center;gap:8px;
}
.badge{
  display:inline-block;padding:2px 8px;border-radius:10px;
  font-size:10px;font-weight:700;background:var(--dark);
  color:var(--primary);
}
.level-editor-inner{display:grid;grid-template-columns:240px 1fr;gap:0;height:100%}
.level-list-panel{overflow-y:auto;border-right:1px solid var(--border);padding:12px;scrollbar-width:thin}
.level-detail-panel{overflow-y:auto;padding:12px;scrollbar-width:thin}
.level-item{
  padding:8px 10px;border-radius:var(--radius);margin-bottom:4px;
  background:var(--surface);cursor:pointer;border:1px solid transparent;
  transition:var(--transition);
}
.level-item:hover{border-color:var(--border)}
.level-item.selected{border-color:var(--primary);background:rgba(139,195,74,.1)}
.level-item-header{display:flex;justify-content:space-between;align-items:center}
.level-item-name{font-size:12px;font-weight:600}
.level-item-info{font-size:10px;color:var(--text-dim);margin-top:4px;display:flex;gap:12px}
#entityCanvas{
  display:block;width:100%;background:#111;
  border-radius:var(--radius);cursor:crosshair;
}
#levelCanvas{display:block;background:#111;border-radius:var(--radius)}
#previewCanvas{display:block;background:#0a0a1a;border-radius:var(--radius)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.toggle-track{
  width:36px;height:20px;border-radius:10px;background:var(--bg);
  border:1px solid var(--border);cursor:pointer;position:relative;
  transition:var(--transition);
}
.toggle-track.on{background:var(--dark);border-color:var(--primary)}
.toggle-thumb{
  width:16px;height:16px;border-radius:50%;background:var(--text-dim);
  position:absolute;top:1px;left:1px;transition:var(--transition);
}
.toggle-track.on .toggle-thumb{left:17px;background:var(--primary)}
.toast{
  position:fixed;bottom:20px;right:20px;
  background:var(--dark);color:var(--primary);
  padding:10px 20px;border-radius:var(--radius);
  font-size:13px;border:1px solid var(--primary);
  z-index:2000;animation:fadeInOut 2.2s forwards;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}
@keyframes fadeInOut{
  0%{opacity:0;transform:translateY(20px)}
  10%{opacity:1;transform:translateY(0)}
  80%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-10px)}
}
#undo-indicator{
  position:fixed;bottom:4px;left:50%;transform:translateX(-50%);
  font-size:10px;color:var(--text-dim);z-index:50;
  font-family:monospace;opacity:.6;
}
.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.template-card{
  padding:8px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);cursor:pointer;transition:var(--transition);
  text-align:center;font-size:11px;color:var(--text-dim);
}
.template-card:hover{border-color:var(--primary);background:var(--surface2);color:var(--text)}
.template-card .emoji{font-size:18px;display:block;margin-bottom:4px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat-box{
  padding:8px;background:var(--surface);border-radius:var(--radius);
  text-align:center;border:1px solid var(--border);
}
.stat-box .stat-val{font-size:18px;font-weight:700;color:var(--accent);font-family:monospace}
.stat-box .stat-label{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.color-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.color-swatch{
  height:28px;border-radius:4px;border:1px solid rgba(255,255,255,.1);
  transition:var(--transition);cursor:pointer;
}
.color-swatch:hover{transform:scale(1.1);border-color:rgba(255,255,255,.3)}
.filter-bar{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.filter-chip{
  padding:2px 8px;border-radius:10px;font-size:10px;
  background:var(--surface);border:1px solid var(--border);
  cursor:pointer;transition:var(--transition);color:var(--text-dim);
}
.filter-chip:hover,.filter-chip.active{border-color:var(--primary);color:var(--primary);background:rgba(139,195,74,.1)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Lime<span>Drive</span> Generator</h1>
    <div class="header-tabs">
      <button class="header-tab active" data-tab="project" onclick="switchTab('project')">&#9881; Project</button>
      <button class="header-tab" data-tab="entities" onclick="switchTab('entities')">&#9641; Entities</button>
      <button class="header-tab" data-tab="levels" onclick="switchTab('levels')">&#9635; Levels</button>
      <button class="header-tab" data-tab="physics" onclick="switchTab('physics')">&#9883; Physics</button>
      <button class="header-tab" data-tab="preview" onclick="switchTab('preview')">&#9654; Preview</button>
    </div>
    <div class="header-actions">
      <button class="btn btn-sm" onclick="undo()" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn btn-sm" onclick="redo()" title="Redo (Ctrl+Y)">Redo</button>
      <button class="btn btn-sm btn-primary" onclick="generateJSON()">JSON</button>
      <button class="btn btn-sm btn-accent" onclick="exportHTML()">Export</button>
      <button class="btn btn-sm" onclick="saveProject()">Save</button>
      <button class="btn btn-sm" onclick="document.getElementById('loadInput').click()">Load</button>
      <input type="file" id="loadInput" accept=".ldproject" style="display:none" onchange="loadProject(event)">
    </div>
  </header>
  <div id="main">
    <div class="panel-left" id="leftPanel">
      <div id="tab-project" class="tab-content active"></div>
      <div id="tab-entities" class="tab-content" style="display:none"></div>
      <div id="tab-levels" class="tab-content" style="display:none"></div>
      <div id="tab-physics" class="tab-content" style="display:none"></div>
      <div id="tab-preview" class="tab-content" style="display:none"></div>
    </div>
    <div class="panel-center" id="centerPanel"></div>
    <div class="panel-right" id="rightPanel"></div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>
<div id="undo-indicator"></div>

<script>
const GAME_NAMES=[
  'Pixel Quest','Lime Runner','Neon Blast','Crystal Caverns','Shadow Chase',
  'Star Drift','Pixel Panic','Lime Kingdom','Turbo Dash','Mind Maze',
  'Arcade Fury','Retro Blast','Quantum Leap','Dragon Trail','Sky Bound',
  'Circuit Break','Frost Bite','Ember Rise','Tidal Wave','Void Walker',
  'Bolt Strike','Moss Garden','Coral Reef','Solar Flare','Lunar Tides',
  'Jungle Rush','Canyon Run','Storm Chaser','Deep Dive','Peak Climb',
  'Rust Valley','Prism Shift','Spike Trail','Bubble Pop','Gem Hunt',
  'Arrow Path','Boulder Hop','Flame Dash','Ice Slide','Wind Sail',
  'Sand Storm','Vine Climb','Rock Fall','Pipe Dream','Cave Explorer'
];
const THEMES=[
  'Forest','Desert','Ice','Space','Lava',
  'Underwater','City','Haunted','Jungle','Volcano',
  'Candy','Tech','Ancient','Cloud','Crystal'
];
const ENTITY_TYPES=['hero','enemy','platform','pickup','decoration','trigger','spawn_point'];
const AI_PERSONALITIES=['aggressive','defensive','balanced','trickster'];
const COMPONENT_MAP={
  hero:['Transform','Sprite','PhysicsBody','Collider','PlayerControl','Platformer','Health'],
  enemy:['Transform','Sprite','PhysicsBody','Collider','EnemyAI','Health','Patrol'],
  platform:['Transform','Sprite','Collider','Platform'],
  pickup:['Transform','Sprite','Collider','Pickup','Animation'],
  decoration:['Transform','Sprite','Animation'],
  trigger:['Transform','Collider','Trigger'],
  spawn_point:['Transform','SpawnMarker']
};
const WORLD_SIZES=[
  {label:'Small',w:1920,h:1080},
  {label:'Medium',w:3840,h:1080},
  {label:'Large',w:5760,h:1080}
];
const ENTITY_TEMPLATES=[
  {name:'Player Start',typeIdx:0,x:100,y:500,z:0,width:64,height:64,health:100,speed:5,damage:0,hue:120,sat:55,lit:44,aiPersonality:2,aiDifficulty:3},
  {name:'Slime Enemy',typeIdx:1,x:400,y:520,z:0,width:48,height:32,health:30,speed:2,damage:10,hue:100,sat:60,lit:50,aiPersonality:1,aiDifficulty:2},
  {name:'Bat Enemy',typeIdx:1,x:600,y:300,z:0,width:32,height:32,health:20,speed:4,damage:15,hue:280,sat:40,lit:30,aiPersonality:0,aiDifficulty:3},
  {name:'Stone Platform',typeIdx:2,x:300,y:400,z:0,width:192,height:32,health:999,speed:0,damage:0,hue:30,sat:10,lit:35,aiPersonality:2,aiDifficulty:1},
  {name:'Coin Pickup',typeIdx:3,x:200,y:450,z:0,width:24,height:24,health:1,speed:0,damage:0,hue:50,sat:100,lit:55,aiPersonality:2,aiDifficulty:1},
  {name:'Health Potion',typeIdx:3,x:500,y:500,z:0,width:20,height:30,health:1,speed:0,damage:0,hue:0,sat:80,lit:50,aiPersonality:2,aiDifficulty:1},
  {name:'Checkpoint Flag',typeIdx:5,x:800,y:500,z:0,width:16,height:64,health:1,speed:0,damage:0,hue:200,sat:60,lit:60,aiPersonality:2,aiDifficulty:1},
  {name:'Spike Trap',typeIdx:5,x:350,y:540,z:0,width:64,height:16,health:1,speed:0,damage:25,hue:0,sat:0,lit:30,aiPersonality:2,aiDifficulty:1},
  {name:'Tree Decoration',typeIdx:6,x:150,y:450,z:10,width:48,height:80,health:1,speed:0,damage:0,hue:120,sat:50,lit:30,aiPersonality:2,aiDifficulty:1},
  {name:'Mega Boss',typeIdx:1,x:1600,y:400,z:0,width:128,height:128,health:500,speed:3,damage:30,hue:330,sat:70,lit:40,aiPersonality:0,aiDifficulty:5}
];

let project=getDefaultProject();
let selectedEntityIdx=-1;
let selectedLevelIdx=0;
let undoStack=[];
let redoStack=[];
let isDragging=false;
let dragEntityIdx=-1;
let dragOffX=0;
let dragOffY=0;
let entityFilter='all';
let undoTimer=null;

function getDefaultProject(){
  return {
    name:'Pixel Quest',nameIdx:0,gameType:0,worldSize:1,difficulty:5,theme:0,
    entities:[],
    levels:[{
      name:'Level 1',timeLimit:120,enemyCount:5,platformDensity:40,
      par:3,hasBoss:false,entities:[]
    }],
    physics:{gravity:9.8,friction:.8,airResistance:.02,jumpForce:15,maxSpeed:8}
  };
}

function deepClone(obj){return JSON.parse(JSON.stringify(obj))}

function pushUndo(){
  undoStack.push(deepClone(project));
  if(undoStack.length>20) undoStack.shift();
  redoStack=[];
  updateUndoIndicator();
}

function undo(){
  if(!undoStack.length) return;
  redoStack.push(deepClone(project));
  project=undoStack.pop();
  selectedEntityIdx=Math.min(selectedEntityIdx,project.entities.length-1);
  selectedLevelIdx=Math.min(selectedLevelIdx,project.levels.length-1);
  renderAll();
  updateUndoIndicator();
}

function redo(){
  if(!redoStack.length) return;
  undoStack.push(deepClone(project));
  project=redoStack.pop();
  selectedEntityIdx=Math.min(selectedEntityIdx,project.entities.length-1);
  selectedLevelIdx=Math.min(selectedLevelIdx,project.levels.length-1);
  renderAll();
  updateUndoIndicator();
}

function updateUndoIndicator(){
  const el=document.getElementById('undo-indicator');
  if(el) el.textContent=`Undo: ${undoStack.length} | Redo: ${redoStack.length}`;
}

function pushUndoDebounced(){
  if(undoTimer) return;
  undoTimer=setTimeout(()=>{pushUndo();undoTimer=null;},500);
}

function switchTab(tab){
  document.querySelectorAll('.header-tab').forEach(t=>{
    t.classList.toggle('active',t.dataset.tab===tab);
  });
  ['project','entities','levels','physics','preview'].forEach(t=>{
    const el=document.getElementById('tab-'+t);
    el.classList.toggle('active',t===tab);
    el.style.display=t===tab?'':'none';
  });
  updateLayout(tab);
  renderTab(tab);
}

function updateLayout(tab){
  const left=document.getElementById('leftPanel');
  const center=document.getElementById('centerPanel');
  const right=document.getElementById('rightPanel');
  if(tab==='entities'){
    left.style.width='260px';left.style.display='';
    center.style.display='';
    center.innerHTML=`
      <div id="entityCanvasWrap" style="flex:1;overflow:hidden;padding:12px;display:flex;flex-direction:column">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h3 style="color:var(--primary);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700">Entity Viewport</h3>
          <span class="badge" id="viewportInfo">0 entities</span>
        </div>
        <canvas id="entityCanvas" style="flex:1"></canvas>
        <div style="display:flex;gap:6px;margin-top:6px;font-size:10px;color:var(--text-dim)">
          <span>Click to select</span>
          <span>|</span>
          <span>Drag to move</span>
          <span>|</span>
          <span id="mousePos">0, 0</span>
        </div>
      </div>`;
    right.style.width='320px';right.style.display='';
    setTimeout(()=>{initEntityCanvas();renderEntityCanvas();renderRightEntity();},10);
  } else if(tab==='levels'){
    left.style.width='260px';left.style.display='';
    center.style.display='';
    center.innerHTML=`
      <div style="flex:1;padding:12px;overflow:auto;display:flex;flex-direction:column">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h3 style="color:var(--primary);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700">Level Preview</h3>
          <span class="badge" id="levelPreviewBadge">Level 1</span>
        </div>
        <canvas id="levelCanvas" width="800" height="400" style="width:100%;background:#111;border-radius:var(--radius);flex:1"></canvas>
      </div>`;
    right.style.width='320px';right.style.display='';
    setTimeout(()=>{renderLevelCanvas();renderLevelDetail();},10);
  } else if(tab==='preview'){
    left.style.width='260px';left.style.display='';
    center.style.display='';
    center.innerHTML=`
      <div style="flex:1;padding:12px;display:flex;flex-direction:column">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h3 style="color:var(--primary);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700">Live Preview</h3>
          <span class="badge" id="previewStatusBadge">Stopped</span>
        </div>
        <canvas id="previewCanvas" style="flex:1;background:#0a0a1a;border-radius:var(--radius)"></canvas>
        <div style="display:flex;gap:6px;margin-top:8px;align-items:center">
          <button class="btn btn-primary btn-sm" onclick="togglePlay()" id="playBtn">Play</button>
          <button class="btn btn-sm" onclick="resetPreview()">Reset</button>

  }
}

let entityCanvas,entityCtx;
function initEntityCanvas(){
  entityCanvas=document.getElementById('entityCanvas');
  if(!entityCanvas) return;
  entityCtx=entityCanvas.getContext('2d');
  resizeEntityCanvas();
  entityCanvas.addEventListener('mousedown',onEntityMouseDown);
  entityCanvas.addEventListener('mousemove',onEntityMouseMove);
  entityCanvas.addEventListener('mouseup',onEntityMouseUp);
  entityCanvas.addEventListener('mouseleave',onEntityMouseUp);
  window.addEventListener('resize',()=>{resizeEntityCanvas();renderEntityCanvas();});
}

function resizeEntityCanvas(){
  if(!entityCanvas) return;
  const wrap=entityCanvas.parentElement;
  entityCanvas.width=wrap.clientWidth;
  entityCanvas.height=wrap.clientHeight-40;
}

function getEntityCanvasScale(){
  if(!entityCanvas) return{sx:1,sy:1,ox:0,oy:0};
  const ww=WORLD_SIZES[project.worldSize].w;
  const wh=WORLD_SIZES[project.worldSize].h;
  const sx=entityCanvas.width/ww;
  const sy=entityCanvas.height/wh;
  const s=Math.min(sx,sy);
  return{sx:s,sy:s,ox:(entityCanvas.width-ww*s)/2,oy:(entityCanvas.height-wh*s)/2};
}

function renderEntityCanvas(){
  if(!entityCtx) return;
  const c=entityCanvas;
  const ctx=entityCtx;
  const ww=WORLD_SIZES[project.worldSize].w;
  const wh=WORLD_SIZES[project.worldSize].h;
  const{sx,sy,ox,oy}=getEntityCanvasScale();
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle='#111';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='#1a2a1a';
  ctx.lineWidth=1;
  for(let x=0;x<=ww;x+=64){
    ctx.beginPath();
    ctx.moveTo(ox+x*sx,oy);
    ctx.lineTo(ox+x*sx,oy+wh*sy);
    ctx.stroke();
  }
  for(let y=0;y<=wh;y+=64){
    ctx.beginPath();
    ctx.moveTo(ox,oy+y*sy);
    ctx.lineTo(ox+ww*sx,oy+y*sy);
    ctx.stroke();
  }
  ctx.strokeStyle='#2a4a2a';
  ctx.lineWidth=1;
  ctx.strokeRect(ox,oy,ww*sx,wh*sy);
  const groundY=oy+wh*sy-2;
  ctx.strokeStyle='#33691E';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(ox,groundY);
  ctx.lineTo(ox+ww*sx,groundY);
  ctx.stroke();
  project.entities.forEach((e,i)=>{
    const ex=ox+e.x*sx;
    const ey=oy+e.y*sy;
    const ew=Math.max(2,e.width*sx);
    const eh=Math.max(2,e.height*sy);
    ctx.fillStyle=`hsla(${e.hue},${e.sat}%,${e.lit}%,0.8)`;
    ctx.strokeStyle=i===selectedEntityIdx?'#CDDC39':'rgba(255,255,255,0.3)';
    ctx.lineWidth=i===selectedEntityIdx?2:1;
    ctx.fillRect(ex,ey,ew,eh);
    ctx.strokeRect(ex,ey,ew,eh);
    if(i===selectedEntityIdx){
      ctx.strokeStyle='#CDDC39';
      ctx.lineWidth=1;
      ctx.setLineDash([4,4]);
      ctx.strokeRect(ex-4,ey-4,ew+8,eh+8);
      ctx.setLineDash([]);
      ctx.fillStyle='#CDDC39';
      ctx.font='bold 10px monospace';
      ctx.textAlign='left';
      ctx.fillText(`#${i+1}`,ex+ew+6,ey+10);
    }
    if(ew>24&&eh>14){
      ctx.fillStyle='rgba(0,0,0,0.7)';
      ctx.fillRect(ex+2,ey+eh/2-6,ew-4,12);
      ctx.fillStyle='#fff';
      ctx.font='9px monospace';
      ctx.textAlign='center';
      ctx.fillText(ENTITY_TYPES[e.typeIdx],ex+ew/2,ey+eh/2+3);
    }
  });
  updateViewportInfo();
}

function canvasToWorld(cx,cy){
  const{sx,sy,ox,oy}=getEntityCanvasScale();
  return{x:Math.round((cx-ox)/sx),y:Math.round((cy-oy)/sy)};
}

function onEntityMouseDown(e){
  if(!entityCanvas) return;
  const rect=entityCanvas.getBoundingClientRect();
  const cx=e.clientX-rect.left;
  const cy=e.clientY-rect.top;
  for(let i=project.entities.length-1;i>=0;i--){
    const ent=project.entities[i];
    const{sx,sy,ox,oy}=getEntityCanvasScale();
    const ex=ox+ent.x*sx;
    const ey=oy+ent.y*sy;
    const ew=ent.width*sx;
    const eh=ent.height*sy;
    if(cx>=ex&&cx<=ex+ew&&cy>=ey&&cy<=ey+eh){
      pushUndo();
      selectedEntityIdx=i;
      isDragging=true;
      dragEntityIdx=i;
      dragOffX=cx-ex;
      dragOffY=cy-ey;
      renderEntityList();
      renderRightEntity();
      renderEntityCanvas();
      return;
    }
  }
}

function onEntityMouseMove(e){
  if(!entityCanvas) return;
  const rect=entityCanvas.getBoundingClientRect();
  const cx=e.clientX-rect.left;
  const cy=e.clientY-rect.top;
  const mp=document.getElementById('mousePos');
  if(mp){
    const w=canvasToWorld(cx,cy);
    mp.textContent=`${w.x}, ${w.y}`;
  }
  if(!isDragging) return;
  const{sx,sy,ox,oy}=getEntityCanvasScale();
  const ent=project.entities[dragEntityIdx];
  const newX=Math.max(0,Math.min(WORLD_SIZES[project.worldSize].w-ent.width,Math.round((cx-dragOffX-ox)/sx)));
  const newY=Math.max(0,Math.min(WORLD_SIZES[project.worldSize].h-ent.height,Math.round((cy-dragOffY-oy)/sy)));
  ent.x=newX;
  ent.y=newY;
  renderEntityCanvas();
  if(selectedEntityIdx===dragEntityIdx) renderRightEntity();
}

function onEntityMouseUp(){
  isDragging=false;
  dragEntityIdx=-1;
}

function renderLevelCanvas(){
  const canvas=document.getElementById('levelCanvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  const l=project.levels[selectedLevelIdx];
  if(!l) return;
  const badge=document.getElementById('levelPreviewBadge');
  if(badge) badge.textContent=`Level ${selectedLevelIdx+1}`;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#111';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#1a2a1a';
  ctx.lineWidth=1;
  for(let x=0;x<canvas.width;x+=20){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();
  }
  for(let y=0;y<canvas.height;y+=20){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
  }
  const groundY=canvas.height-40;
  ctx.fillStyle='#33691E';
  ctx.fillRect(0,groundY,canvas.width,40);
  ctx.fillStyle='#4a7c23';
  ctx.fillRect(0,groundY,canvas.width,3);
  const cols=Math.floor(canvas.width/60);
  const platCount=Math.floor(cols*(l.platformDensity/100));
  const rng=mulberry32(selectedLevelIdx*7+13);
  ctx.fillStyle='#8BC34A';
  for(let i=0;i<platCount;i++){
    const px=rng()*canvas.width;
    const py=60+rng()*(groundY-120);
    const pw=30+rng()*60;
    ctx.fillRect(px,py,pw,8);
  }
  ctx.fillStyle='#e74c3c';
  for(let i=0;i<l.enemyCount;i++){
    const ex=40+rng()*(canvas.width-80);
    const ey=groundY-16;
    ctx.fillRect(ex,ey,10,16);
    ctx.fillStyle='rgba(231,76,60,0.3)';
    ctx.fillRect(ex-1,groundY-20,12,4);
    ctx.fillStyle='#e74c3c';
  }
  ctx.fillStyle='#CDDC39';
  ctx.fillRect(40,groundY-20,12,20);
  if(l.hasBoss){
    ctx.fillStyle='#9c27b0';
    ctx.fillRect(canvas.width-80,groundY-40,30,40);
    ctx.fillStyle='rgba(156,39,176,0.3)';
    ctx.fillRect(canvas.width-84,groundY-44,38,4);
    ctx.fillStyle='#fff';
    ctx.font='bold 8px monospace';
    ctx.textAlign='center';
    ctx.fillText('BOSS',canvas.width-65,groundY-18);
  }
  ctx.fillStyle='rgba(139,195,74,0.4)';
  ctx.font='11px monospace';
  ctx.textAlign='left';
  ctx.fillText(`Level ${selectedLevelIdx+1} | ${l.timeLimit?l.timeLimit+'s':'\u221E'} | Par ${l.par}`,10,20);
}

function mulberry32(a){
  return function(){
    a|=0;a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}

let previewCanvas,previewCtx,playing=false,previewAnimFrame=null;
let previewPlayer={x:100,y:500,vx:0,vy:0,w:32,h:48,onGround:false};
let previewKeys={};
let previewPlatforms=[];
let previewEnemies=[];
let lastFrameTime=0;
let frameCount=0;
let fpsTimer=0;
let currentFps=0;

function initPreview(){
  previewCanvas=document.getElementById('previewCanvas');
  if(!previewCanvas) return;
  previewCtx=previewCanvas.getContext('2d');
  resizePreviewCanvas();
  setupPreviewLevel();
  renderPreviewFrame();
  window.addEventListener('resize',resizePreviewCanvas);
}

function resizePreviewCanvas(){
  if(!previewCanvas) return;
  const wrap=previewCanvas.parentElement;
  previewCanvas.width=wrap.clientWidth-24;
  previewCanvas.height=wrap.clientHeight-80;
  if(!playing) renderPreviewFrame();
}

function setupPreviewLevel(){
  previewPlatforms=[];
  previewEnemies=[];
  const rng=mulberry32(selectedLevelIdx*31+7);
  const l=project.levels[selectedLevelIdx];
  if(!l) return;
  const groundY=(previewCanvas?previewCanvas.height:400)-80;
  const platCount=Math.floor((previewCanvas?previewCanvas.width:800)/80*(l.platformDensity/100));
  for(let i=0;i<platCount;i++){
    previewPlatforms.push({
      x:rng()*(previewCanvas?previewCanvas.width:800),
      y:80+rng()*(groundY-160),
      w:30+rng()*80,
      h:8
    });
  }
  for(let i=0;i<l.enemyCount;i++){
    previewEnemies.push({
      x:30+rng()*((previewCanvas?previewCanvas.width:800)-60),
      y:groundY-16,
      w:10,h:16,
      vx:(rng()>.5?1:-1)*(1+rng()*2),
      alive:true
    });
  }
}

function togglePlay(){
  playing=!playing;
  const btn=document.getElementById('playBtn');
  const badge=document.getElementById('previewStatusBadge');
  if(btn) btn.textContent=playing?'Pause':'Play';
  if(badge) badge.textContent=playing?'Running':'Stopped';
  if(playing){
    previewPlayerReset();
    setupPreviewLevel();
    lastFrameTime=performance.now();
    fpsTimer=0;frameCount=0;
    gameLoop();
  } else {
    if(previewAnimFrame) cancelAnimationFrame(previewAnimFrame);
  }
}

function resetPreview(){
  playing=false;
  const btn=document.getElementById('playBtn');
  const badge=document.getElementById('previewStatusBadge');
  if(btn) btn.textContent='Play';
  if(badge) badge.textContent='Stopped';
  if(previewAnimFrame) cancelAnimationFrame(previewAnimFrame);
  previewPlayerReset();
  setupPreviewLevel();
  renderPreviewFrame();
}

function previewPlayerReset(){
  previewPlayer={x:100,y:500,vx:0,vy:0,w:32,h:48,onGround:false};
}

function gameLoop(){
  if(!playing) return;
  const now=performance.now();
  const dt=(now-lastFrameTime)/16.67;
  lastFrameTime=now;
  frameCount++;
  fpsTimer+=dt;
  if(fpsTimer>=60){
    currentFps=Math.round(frameCount/(fpsTimer/60));
    frameCount=0;fpsTimer=0;
    const fpsEl=document.getElementById('fpsDisplay');
    if(fpsEl) fpsEl.textContent=currentFps+' FPS';
  }
  updatePreviewPhysics(dt);
  renderPreviewFrame();
  previewAnimFrame=requestAnimationFrame(gameLoop);
}

function updatePreviewPhysics(dt){
  const p=previewPlayer;
  const phys=project.physics;
  const accel=0.5;
  if(previewKeys['ArrowLeft']||previewKeys['KeyA']) p.vx-=accel;
  if(previewKeys['ArrowRight']||previewKeys['KeyD']) p.vx+=accel;
  if((previewKeys['ArrowUp']||previewKeys['KeyW']||previewKeys['Space'])&&p.onGround){
    p.vy=-phys.jumpForce;
    p.onGround=false;
  }
  p.vy+=phys.gravity*0.5*dt;
  p.vx*=Math.pow(phys.friction,dt);
  p.vy*=Math.pow(1-phys.airResistance,dt);
  const maxV=phys.maxSpeed;
  p.vx=Math.max(-maxV,Math.min(maxV,p.vx));
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  const cw=previewCanvas?previewCanvas.width:800;
  const ch=previewCanvas?previewCanvas.height:400;
  const groundY=ch-80;
  p.onGround=false;
  if(p.y+p.h>groundY){p.y=groundY-p.h;p.vy=0;p.onGround=true;}
  previewPlatforms.forEach(pl=>{
    if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>=pl.y&&p.y+p.h<=pl.y+pl.h+Math.abs(p.vy)+8&&p.vy>=0){
      p.y=pl.y-p.h;p.vy=0;p.onGround=true;
    }
  });
  if(p.x<0){p.x=0;p.vx=0;}
  if(p.x+p.w>cw){p.x=cw-p.w;p.vx=0;}
  if(p.y<0){p.y=0;p.vy=0;}
  previewEnemies.forEach(e=>{
    if(!e.alive) return;
    e.x+=e.vx*dt;
    if(e.x<0||e.x+e.w>cw) e.vx*=-1;
    if(p.x+p.w>e.x&&p.x<e.x+e.w&&p.y+p.h>e.y&&p.y<e.y+e.h){
      if(p.vy>0&&p.y+p.h-e.y<20){
        e.alive=false;
        p.vy=-phys.jumpForce*0.6;
      }
    }
  });
}

function renderPreviewFrame(){
  if(!previewCtx||!previewCanvas) return;
  const ctx=previewCtx;
  const c=previewCanvas;
  const cols=getThemeColors();
  ctx.fillStyle='#0a0a1a';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle='rgba(255,255,255,0.03)';
  ctx.lineWidth=1;
  for(let x=0;x<c.width;x+=32){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke();
  }
  for(let y=0;y<c.height;y+=32){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke();
  }
  const groundY=c.height-80;
  ctx.fillStyle=cols[0]||'#33691E';
  ctx.fillRect(0,groundY,c.width,80);
  ctx.fillStyle=cols[1]||'#4a7c23';
  ctx.fillRect(0,groundY,c.width,3);
  ctx.fillStyle=cols[2]||'#8BC34A';
  previewPlatforms.forEach(pl=>ctx.fillRect(pl.x,pl.y,pl.w,pl.h));
  previewEnemies.forEach(e=>{
    if(!e.alive) return;
    ctx.fillStyle='#e74c3c';
    ctx.fillRect(e.x,e.y,e.w,e.h);
    ctx.fillStyle='rgba(231,76,60,0.4)';
    ctx.fillRect(e.x-2,e.y-4,e.w+4,4);
  });
  const p=previewPlayer;
  ctx.fillStyle='#8BC34A';
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.fillRect(p.x+4,p.y+4,p.w-8,p.h/2-4);
  ctx.fillStyle='#fff';
  ctx.fillRect(p.x+8,p.y+10,4,4);
  ctx.fillRect(p.x+p.w-12,p.y+10,4,4);
  if(!playing){
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='rgba(139,195,74,0.8)';
    ctx.font='bold 16px monospace';
    ctx.textAlign='center';
    ctx.fillText('Click "Play" to start',c.width/2,c.height/2-10);
    ctx.font='11px monospace';
    ctx.fillStyle='rgba(205,220,57,0.5)';
    ctx.fillText('Use Arrow Keys / WASD to move, Space to jump',c.width/2,c.height/2+14);
  }
}

document.addEventListener('keydown',e=>{
  previewKeys[e.code]=true;
  if(e.ctrlKey&&e.key==='z'){e.preventDefault();undo();}
  if(e.ctrlKey&&e.key==='y'){e.preventDefault();redo();}
  if(e.code==='Space'&&playing) e.preventDefault();
});
document.addEventListener('keyup',e=>{previewKeys[e.code]=false;});

  document.getElementById('modalOverlay').classList.remove('visible');
}

function showToast(msg){
  const existing=document.querySelectorAll('.toast');
  existing.forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2400);
}

function buildJSON(){
  const gameTypes=['platformer','puzzle','shooter','rpg','racing'];
  const ws=WORLD_SIZES[project.worldSize];
  const entities=project.entities.map(e=>{
    const type=ENTITY_TYPES[e.typeIdx];
    const base={
      type,
      x:e.x,y:e.y,z:e.z,
      width:e.width,height:e.height,
      color:`hsl(${e.hue},${e.sat}%,${e.lit}%)`,
      health:e.health,
      speed:e.speed,
      damage:e.damage,
      components:COMPONENT_MAP[type]
    };
    if(type==='enemy'){
      base.ai={
        personality:AI_PERSONALITIES[e.aiPersonality],
        difficulty:e.aiDifficulty
      };
    }
    return base;
  });
  return {
    name:GAME_NAMES[project.nameIdx],
    version:'1.0.0',
    type:gameTypes[project.gameType],
    settings:{
      gravity:project.physics.gravity,
      friction:project.physics.friction,
      airResistance:project.physics.airResistance,
      jumpForce:project.physics.jumpForce,
      maxSpeed:project.physics.maxSpeed,
      worldWidth:ws.w,
      worldHeight:ws.h,
      theme:THEMES[project.theme].toLowerCase(),
      difficulty:project.difficulty
    },
    levels:project.levels.map((l,i)=>({
      name:'Level '+(i+1),
      timeLimit:l.timeLimit,
      par:l.par,
      enemyCount:l.enemyCount,
      platformDensity:l.platformDensity,
      hasBoss:l.hasBoss,
      entities:i===selectedLevelIdx?entities:[]
    }))
  };
}

function generateJSON(){
  const json=buildJSON();
  const formatted=JSON.stringify(json,null,2);
  navigator.clipboard.writeText(formatted).catch(()=>{});
  const modal=document.getElementById('modalContent');
  const fname=GAME_NAMES[project.nameIdx].toLowerCase().replace(/\s+/g,'_');
  modal.innerHTML=`
    <h2>Generated JSON <span style="font-size:12px;color:var(--text-dim);font-weight:400">(copied to clipboard)</span></h2>
    <pre>${escapeHtml(formatted)}</pre>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="navigator.clipboard.writeText(document.querySelector('#modalContent pre').textContent);showToast('Copied!')">Copy Again</button>
      <button class="btn btn-sm" onclick="downloadFile('${fname}.json',document.querySelector('#modalContent pre').textContent,'application/json')">Download</button>
      <button class="btn btn-sm btn-primary" onclick="closeModal()">Close</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('visible');
  showToast('JSON generated and copied!');
}

function exportHTML(){
  const json=buildJSON();
  const html=generateStandaloneHTML(json);
  const fname=GAME_NAMES[project.nameIdx].toLowerCase().replace(/\s+/g,'_');
  downloadFile(fname+'.html',html,'text/html');
  showToast('Standalone HTML exported!');
}

function generateStandaloneHTML(json){
  const tc=getThemeColors();
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${escapeHtml(json.name)}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e0e0e0;font-family:monospace;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{border:2px solid ${tc[2]||'#8BC34A'};border-radius:4px}
#hud{position:fixed;top:10px;left:10px;font-size:14px;color:${tc[2]||'#8BC34A'};z-index:10;text-shadow:0 0 8px rgba(0,0,0,.8)}
#controls{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#555;text-align:center}
</style>
</head>
<body>
<div id="hud"></div>
<canvas id="c"></canvas>
<div id="controls">Arrow Keys / WASD to move | Space to jump</div>
<script>
const G=${JSON.stringify(json)};
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const W=canvas.width=Math.min(window.innerWidth-40,G.settings.worldWidth);
const H=canvas.height=Math.min(window.innerHeight-80,G.settings.worldHeight);
const hud=document.getElementById('hud');
const lvl=G.levels.find(l=>l.entities&&l.entities.length)||G.levels[0]||{entities:[],timeLimit:0,par:1};
let player={x:100,y:H-100,vx:0,vy:0,w:32,h:48,onGround:false};
let keys={};
let platforms=[];
let enemies=[];
let particles=[];
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function init(){
  let r=rng(lvl.par*100+42);
  const ground=H-60;
  for(let i=0;i<Math.floor(20*(lvl.platformDensity||40)/100);i++){
    platforms.push({x:r()*W,y:80+r()*(ground-160),w:40+r()*80,h:8});
  }
  for(let i=0;i<(lvl.enemyCount||0);i++){
    enemies.push({x:60+r()*(W-120),y:ground-16,w:12,h:16,vx:(r()>.5?1:-1)*(1+r()*2),alive:true});
  }
  (lvl.entities||[]).forEach(e=>{
    if(e.type==='platform') platforms.push({x:e.x,y:e.y,w:e.width,h:e.height});
    if(e.type==='enemy') enemies.push({x:e.x,y:e.y,w:e.width,h:e.height,vx:(r()>.5?1:-1)*(1+r()*2),alive:true});
  });
}
function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:30,color:col,size:2+Math.random()*3});
}
function update(){
  const p=player;const s=G.settings;
  if(keys.ArrowLeft||keys.KeyA) p.vx-=0.5;
  if(keys.ArrowRight||keys.KeyD) p.vx+=0.5;
  if((keys.ArrowUp||keys.KeyW||keys.Space)&&p.onGround){p.vy=-s.jumpForce;p.onGround=false;}
  p.vy+=s.gravity*0.5;
  p.vx*=s.friction;
  p.vy*=1-s.airResistance;
  p.vx=Math.max(-s.maxSpeed,Math.min(s.maxSpeed,p.vx));
  p.x+=p.vx;p.y+=p.vy;
  p.onGround=false;
  const ground=H-60;
  if(p.y+p.h>ground){p.y=ground-p.h;p.vy=0;p.onGround=true;}
  platforms.forEach(pl=>{
    if(p.x+p.w>pl.x&&p.x<pl.x+pl.w&&p.y+p.h>=pl.y&&p.y+p.h<=pl.y+pl.h+10&&p.vy>=0){
      p.y=pl.y-p.h;p.vy=0;p.onGround=true;
    }
  });
  if(p.x<0){p.x=0;p.vx=0;}
  if(p.x+p.w>W){p.x=W-p.w;p.vx=0;}
  if(p.y<0){p.y=0;p.vy=0;}
  enemies.forEach(e=>{
    if(!e.alive) return;
    e.x+=e.vx;
    if(e.x<0||e.x+e.w>W) e.vx*=-1;
    if(p.x+p.w>e.x&&p.x<e.x+e.w&&p.y+p.h>e.y&&p.y<e.y+e.h){
      if(p.vy>0&&p.y+p.h-e.y<20){
        e.alive=false;
        spawnParticles(e.x+e.w/2,e.y,'#e74c3c',8);
        p.vy=-s.jumpForce*0.6;
      }
    }
  });
  particles.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.life--;pt.vy+=0.1;});
  particles=particles.filter(pt=>pt.life>0);
}
function draw(){
  const cols=${JSON.stringify(tc)};
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.03)';
  for(let x=0;x<W;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle=cols[0];ctx.fillRect(0,H-60,W,60);
  ctx.fillStyle=cols[1];ctx.fillRect(0,H-60,W,3);
  ctx.fillStyle=cols[2];
  platforms.forEach(p=>ctx.fillRect(p.x,p.y,p.w,p.h));
  enemies.forEach(e=>{if(e.alive){ctx.fillStyle='#e74c3c';ctx.fillRect(e.x,e.y,e.w,e.h);}});
  particles.forEach(pt=>{ctx.globalAlpha=pt.life/30;ctx.fillStyle=pt.color;ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);});
  ctx.globalAlpha=1;
  ctx.fillStyle=cols[2]||'#8BC34A';
  const p=player;
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(p.x+4,p.y+4,p.w-8,p.h/2-4);
  ctx.fillStyle='#fff';ctx.fillRect(p.x+8,p.y+10,4,4);ctx.fillRect(p.x+p.w-12,p.y+10,4,4);
  hud.textContent=G.name+' | '+G.settings.theme.toUpperCase();
}
function loop(){update();draw();requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
init();loop();
<\/script>
</body>
</html>`;
}

function saveProject(){
  const data=JSON.stringify(project,null,2);
  const fname=GAME_NAMES[project.nameIdx].toLowerCase().replace(/\s+/g,'_');
  downloadFile(fname+'.ldproject',data,'application/json');
  showToast('Project saved!');
}

function loadProject(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const loaded=JSON.parse(ev.target.result);
      if(loaded.entities&&loaded.levels&&loaded.physics){
        project=loaded;
        selectedEntityIdx=-1;
        selectedLevelIdx=0;
        undoStack=[];
        redoStack=[];
        renderAll();
        showToast('Project loaded successfully!');
      } else {
        showToast('Invalid project file format');
      }
    }catch(err){
      showToast('Error parsing project file');
    }
  };
  reader.readAsText(file);
  e.target.value='';
}

function downloadFile(name,content,type){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderAll(){
  const activeTab=document.querySelector('.header-tab.active');
  if(activeTab) renderTab(activeTab.dataset.tab);
}

document.addEventListener('DOMContentLoaded',()=>{
  renderProjectPanel(document.getElementById('tab-project'));
  renderAll();
  updateUndoIndicator();
});
</script>
</body>
</html>
