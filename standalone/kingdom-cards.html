function mkGame(){
  S={floor:1,hp:60,mhp:60,nrg:3,mnrg:3,cr:15,sh:0,
    deck:[],hand:[],draw:[],dsc:[],exh:[],
    mechs:[],perm:{atk:0,draw:0,nrg:0,burn:0,mhp:0},
    map:[],mrow:0,en:null,btl:false,
    kills:0,cp:0,col:new Set()};
  for(let i=0;i<6;i++)S.deck.push({...CARDS[0],u:Math.random()});
  for(let i=0;i<4;i++)S.deck.push({...CARDS[1],u:Math.random()});
  for(let i=0;i<3;i++)S.deck.push({...CARDS[2],u:Math.random()});
  for(let i=0;i<2;i++){let c=pick(CARDS.filter(x=>x.type==="atk"&&x.rarity==="C"));S.deck.push({...c,u:Math.random()})}
  shuf(S.deck);S.col=new Set(S.deck.map(c=>c.id));genMap();
}

// MAP
// ════════════════════════════════════════
function genMap(){
  S.map=[];const R=8;
  for(let r=0;r<R;r++){
    let n=3+(Math.random()*3|0),row=[];
    for(let c=0;c<n;c++){
      let t="bat";
      if(r===0)t="bat";else if(r===R-1)t="bos";
      else{let x=Math.random();t=x<.4?"bat":x<.55?"evt":x<.7?"shp":x<.8?"frg":"rst"}
      row.push({r,c,t,vis:false,conn:[]});
    }
    S.map.push(row);
  }
  for(let r=0;r<R-1;r++){
    let fr=S.map[r],to=S.map[r+1];
    fr.forEach(n=>{
      let ts=[];
      if(to.length<=fr.length){let ci=Math.round(n.c*(to.length-1)/(fr.length-1));ts.push(ci);if(Math.random()<.4&&ci>0)ts.push(ci-1);if(Math.random()<.4&&ci<to.length-1)ts.push(ci+1)}
      else{let ci=Math.round(n.c*(to.length-1)/(fr.length-1));ts.push(ci);if(ci+1<to.length)ts.push(ci+1)}
      [...new Set(ts)].forEach(t=>{if(!n.conn.includes(t))n.conn.push(t)});
    });
    to.forEach((_,ci)=>{if(!fr.some(n=>n.conn.includes(ci))){let best=fr[0],bd=99;fr.forEach(n=>{let d=Math.abs(n.c-ci);if(d<bd){bd=d;best=n}});best.conn.push(ci)}});
  }
  S.mrow=0;
}

const BOSSES=[
  ["Кор.Огня",90,13,"Пламя",3],["Кор.Льда",95,11,"Мороз",0,2],
  ["Кор.Теней",85,15,"Тьма"],["Кор.Земли",105,10,"Несокр.",0,0,0,0,5],
  ["Император",130,16,"Финал",2,1]
];

function mkEn(fl,boss){
  let t=boss?BOSSES[fl-1]:pick(ENM.slice(0,Math.min(ENM.length,4+fl*2)));
  let m=1+fl*.18;
  return{n:t[0],hp:Math.floor(t[1]*m),mhp:Math.floor(t[1]*m),atk:Math.floor(t[2]*m),d:t[3],
    burn:t[4]||0,slow:t[5]||0,atkN:t[6]||1,boss:!!boss,
    intent:"atk",idmg:0,stun:0,sh:0,vuln:0,weak:0};
}

function genIntent(e){
  if(e.stun>0){e.intent="stun";return}
  let r=Math.random();
  if(r<.6){e.intent="atk";e.idmg=e.atk}
  else if(r<.8){e.intent="sh";e.idmg=e.atk*.6|0}
  else{e.intent="buf";e.idmg=0}
}

function startBtl(boss){
  S.btl=true;S.sh=0;S.en=mkEn(S.floor,boss);genIntent(S.en);
  BT={logs:[],pTurn:true,anim:false};
  S.draw=shuf(S.deck.map(c=>({...c})));S.hand=[];S.dsc=[];S.exh=[];S.mechs=[];
  S.nrg=S.mnrg+S.perm.nrg;drawN(5+S.perm.draw);scr="bat";btlLog("Бой: "+S.en.n+"!");
}

function drawN(n){for(let i=0;i<n;i++){if(!S.draw.length){if(!S.dsc.length)break;S.draw=shuf(S.dsc.map(c=>({...c})));S.dsc=[]}if(S.draw.length)S.hand.push(S.draw.pop())}}

function btlLog(t,c){BT.logs.push({t,c:c||"#777"});if(BT.logs.length>8)BT.logs.shift()}

function playCard(i){
  if(!BT.pTurn||BT.anim)return;
  let c=S.hand[i];if(!c||c.cost>S.nrg)return;
  S.nrg-=c.cost;S.hand.splice(i,1);S.cp++;S.dsc.push(c);
  execCard(c);btlLog("> "+c.name,"#cc4");
  if(S.en.hp<=0)return endBtl(true);
  drawN(S.perm.draw);
}

function execCard(c){
  let e=S.en,ab=S.perm.atk,d=c.desc;
  if(c.type==="atk"){
    let dmg=c.atk+ab;
    if(e.vuln>0){dmg=dmg*1.5|0;e.vuln--}
    if(e.weak>0)dmg=Math.max(1,dmg-2);
    if(d.includes("x2"))dmg*=2;
    e.hp-=dmg;btlLog("-"+dmg+" врагу","#e55");
    if(S.perm.burn>0)e.burn+=S.perm.burn;
    if(d.includes("burn"))e.burn+=2;
    if(d.includes("slow"))e.slow++;
    if(d.includes("shock"))e.stun++;
    if(d.includes("heal")){let h=3;S.hp=Math.min(S.hp+h,S.mhp);btlLog("+"+h+" HP","#4a6")}
    if(d.includes("draw"))drawN(1);
    if(d.includes("-5 HP")){S.hp-=5;btlLog("-5 HP自己","#a44")}
    if(d.includes("-3 HP")){S.hp-=3;btlLog("-3 HP自己","#a44")}
  } else if(c.type==="def"){
    if(c.def>0){S.sh+=c.def;btlLog("+"+c.def+" щит","#5ae")}
    if(d.includes("+6 HP")){S.hp=Math.min(S.hp+6,S.mhp);btlLog("+6 HP","#4a6")}
    if(d.includes("+8 HP")){S.hp=Math.min(S.hp+8,S.mhp);btlLog("+8 HP","#4a6")}
    if(d.includes("+15 HP")){S.hp=Math.min(S.hp+15,S.mhp);btlLog("+15 HP!","#4a6")}
    if(d.includes("+7 HP")){S.hp=Math.min(S.hp+7,S.mhp);btlLog("+7 HP","#4a6")}
    if(d.includes("+5 HP")){S.hp=Math.min(S.hp+5,S.mhp);btlLog("+5 HP","#4a6")}
    if(d.includes("+4 HP")){S.hp=Math.min(S.hp+4,S.mhp);btlLog("+4 HP","#4a6")}
    if(d.includes("+3 HP")){S.hp=Math.min(S.hp+3,S.mhp);btlLog("+3 HP","#4a6")}
    if(d.includes("draw"))drawN(d.includes("2")?2:1);
    if(d.includes("+2能量")||d.includes("+2 энер"))S.nrg+=2;
    if(d.includes("отразить")){e.stun++;btlLog("Отражено!","#a4f")}
    if(d.includes("免疫"))S.sh+=999;
    if(d.includes("3 ур врагу")){e.hp-=3;btlLog("-3 врагу","#e55")}
    if(d.includes("2 ур врагу")){e.hp-=2;btlLog("-2 врагу","#e55")}
    if(d.includes("Снять"))btlLog("Очищено","#4a6");
  } else if(c.type==="mch"){
    if(S.mechs.length<4){
      let hp=5+S.perm.mhp+c.atk,atk=Math.max(2,c.atk*.5|0);
      S.mechs.push({n:c.name,hp,mhp:hp,atk});btlLog("Призван: "+c.name+" HP"+hp,"#d73");
    } else btlLog("Мехов макс.","#a66");
  } else if(c.type==="skl"){
    if(d.includes("Draw 1"))drawN(1);
    if(d.includes("Draw 2"))drawN(2);
    if(d.includes("Draw 3"))drawN(3);
    if(d.includes("Draw 4"))drawN(4);
    if(d.includes("+1 energy")||d.includes("+1 energ"))S.nrg++;
    if(d.includes("+2 energy"))S.nrg+=2;
    if(d.includes("+2 ур. навсегда")||d.includes("+2 ур навсегда")){S.perm.atk+=2;btlLog("+2 урон!","#c4")}
    if(d.includes("+3 ур. навсегда")){S.perm.atk+=3;btlLog("+3 урон!","#c4")}
    if(d.includes("+1 урон навсегда")||d.includes("+1 ур. навсегда")){S.perm.atk++;btlLog("+1 урон!","#c4")}
    if(d.includes("пропускает"))e.stun++;
    if(d.includes("x2 урона"))e.vuln++;
    if(d.includes("Сброс, draw 4")){S.dsc.push(...S.hand);S.hand=[];drawN(4);btlLog("Сброс+draw 4","#888")}
    if(d.includes("Перемешать")){S.draw.push(...S.dsc);S.dsc=[];shuf(S.draw);btlLog("Перемешано","#888")}
    if(d.includes("+2 HP")){S.hp=Math.min(S.hp+2,S.mhp);btlLog("+2 HP","#4a6")}
    if(d.includes("+3 HP")){S.hp=Math.min(S.hp+3,S.mhp);btlLog("+3 HP","#4a6")}
    if(d.includes("-2 урона"))e.weak+=3;
    if(d.includes("bypass"))btlLog("Bypass","#aa4");
    if(d.includes("x2 атака"))btlLog("x2 атака!","#c4");
    if(d.includes("Скопировать")&&S.hand.length>0){let rc=S.hand[0];S.hand.push({...rc,u:Math.random()});btlLog("Скопировано!","#c4")}
  } else if(c.type==="itm"){
    S.mechs=[]; // just mark as collected
    if(d.includes("+2 ур.")){S.perm.atk+=2;btlLog("+2 урон навсегда!","#c4")}
    if(d.includes("+4 ур.")){S.perm.atk+=4;btlLog("+4 урон навсегда!","#c4")}
    if(d.includes("+6 ур.")){S.perm.atk+=6;btlLog("+6 урон навсегда!","#c4")}
    if(d.includes("+2 щит"))S.sh+=2;
    if(d.includes("+5 щит"))S.sh+=5;
    if(d.includes("+8 щит"))S.sh+=8;
    if(d.includes("+1 energy/ход")){S.perm.nrg++;S.nrg++}
    if(d.includes("+2 energy/ход")){S.perm.nrg+=2;S.nrg+=2}
    if(d.includes("+1 draw/ход")){S.perm.draw++;drawN(1)}
    if(d.includes("+20 HP")){S.hp=Math.min(S.hp+20,S.mhp);btlLog("+20 HP!","#4a6")}
    if(d.includes("+3 max HP")){S.mhp+=3;S.hp+=3}
    if(d.includes("Мехи +3 HP"))S.perm.mhp+=3;
    if(d.includes("Burn +2"))S.perm.burn+=2;
    if(d.includes("Stealth"))S.sh+=999;
    if(d.includes("x2 урона"))btlLog("x2!","#c4");
    if(d.includes("Уйти")){btlLog("Побег!","#4a6")}
    btlLog("Предмет: "+c.name,"#da3");
    // Restore mechs array (was cleared for item type)
  } else if(c.type==="evt"){
    if(d.includes("враг -5")||d.includes("Враг -5")){S.en.hp-=5;btlLog("-5 врагу","#e55")}
    if(d.includes("Враг -6")){S.en.hp-=6;btlLog("-6 врагу","#e55")}
    if(d.includes("Враг -4")){S.en.hp-=4;btlLog("-4 врагу","#e55")}
    if(d.includes("враг -8")){S.en.hp-=8;btlLog("-8 врагу","#e55")}
    if(d.includes("враг -3")){S.en.hp-=3;btlLog("-3 врагу","#e55")}
    if(d.includes("вы -2")){S.hp-=2;btlLog("-2 HP","#a44")}
    if(d.includes("вы -4")){S.hp-=4;btlLog("-4 HP","#a44")}
    if(d.includes("все -4")){S.en.hp-=4;S.hp-=4;btlLog("-4 всем","#a44")}
    if(d.includes("-5 HP")){S.hp-=5;btlLog("-5 HP","#a44")}
    if(d.includes("-3 HP")){S.hp-=3;btlLog("-3 HP","#a44")}
    if(d.includes("+8 кредитов")||d.includes("+8 кр")){S.cr+=8;btlLog("+8 кр","#da3")}
    if(d.includes("+15 кредитов")||d.includes("+15 кр")){S.cr+=15;btlLog("+15 кр","#da3")}
    if(d.includes("x2 кредиты")){S.cr*=2;btlLog("x2 кредиты!","#da3")}
    if(d.includes("+10 HP")){S.hp=Math.min(S.hp+10,S.mhp);btlLog("+10 HP","#4a6")}
    if(d.includes("+8 HP")){S.hp=Math.min(S.hp+8,S.mhp);btlLog("+8 HP","#4a6")}
    if(d.includes("+6 HP")){S.hp=Math.min(S.hp+6,S.mhp);btlLog("+6 HP","#4a6")}
    if(d.includes("+5 HP + 5")){S.hp=Math.min(S.hp+5,S.mhp);S.cr+=5;btlLog("+5 HP +5 кр","#4a6")}
    if(d.includes("+3 карты")){for(let i=0;i<3;i++)S.hand.push({...pick(CARDS),u:Math.random()});btlLog("+3 карты","#c4")}
    if(d.includes("редкая")){let r=CARDS.filter(x=>x.rarity==="R"||x.rarity==="E");S.hand.push({...pick(r),u:Math.random()});btlLog("Редкая!","#48f")}
    if(d.includes("Draw 4"))drawN(4);
    if(d.includes("Draw 2 атак")){let a=CARDS.filter(x=>x.type==="atk");for(let i=0;i<2;i++)S.hand.push({...pick(a),u:Math.random()})}
    if(d.includes("+2 energy"))S.nrg+=2;
    if(d.includes("Враг stun 2"))e.stun+=2;
    if(d.includes("Враг stun 1"))e.stun++;
    if(d.includes("slow 2"))e.slow+=2;
    if(d.includes("-1 energy 3")){S.mnrg=Math.max(1,S.mnrg-1);btlLog("-1 max energy","#a44")}
    if(d.includes("+2 ур. 5 ходов")){S.perm.atk+=2;btlLog("+2 урон!","#c4")}
    if(d.includes("Мехи +2 ур.")){S.mechs.forEach(m=>m.atk+=2);btlLog("Мехи +2!","#d73")}
    if(d.includes("5 дронов")){for(let i=0;i<5;i++)if(S.mechs.length<4)S.mechs.push({n:"Дрон",hp:2,mhp:2,atk:1});btlLog("+5 дронов","#d73")}
    if(d.includes("3 дрона")){for(let i=0;i<3;i++)if(S.mechs.length<4)S.mechs.push({n:"Дрон",hp:2,mhp:2,atk:1});btlLog("+3 дрона","#d73")}
    if(d.includes("+15 HP")){S.hp=Math.min(S.hp+15,S.mhp);btlLog("+15 HP","#4a6")}
    if(d.includes("+1 energy навсегда")){S.perm.nrg++;btlLog("+1 energy!","#4af")}
  }
}

function dmgEnemy(d){
  if(S.en.vuln>0){d=d*1.5|0;S.en.vuln--}
  if(S.en.weak>0)d=Math.max(1,d-2);
  S.en.hp-=d;
}

function dmgPlayer(d){
  if(S.sh>0){let ab=Math.min(d,S.sh);S.sh-=d;d-=d;if(ab)btlLog("Щит -"+ab,"#5ae")}
  if(d>0){S.hp-=d;btlLog("-"+d+" HP","#e55")}
}

function enemyTurn(){
  let e=S.en;
  if(e.stun>0){e.stun--;btlLog(e.n+" stun","#888")}
  else{
    if(e.intent==="atk"){
      let d=e.idmg;
      if(e.atkN>1){let s=d/e.atkN|0;for(let i=0;i<e.atkN;i++)dmgPlayer(s)}
      else dmgPlayer(d);
    } else if(e.intent==="sh"){e.sh+=e.idmg;btlLog(e.n+" щит+"+e.idmg,"#5ae")}
    else if(e.intent==="buf"){e.atk+=2;btlLog(e.n+" +2 ур","#d73")}
  }
  if(e.burn>0){e.hp-=e.burn;btlLog("Огонь -"+e.burn,"#e42");e.burn=Math.max(0,e.burn-1)}
  if(e.slow>0)e.slow--;
  for(let m of S.mechs){if(m.hp>0){dmgEnemy(m.atk);btlLog(m.n+": -"+m.atk,"#d73")}}
  S.mechs=S.mechs.filter(m=>m.hp>0);
}

function endBtl(won){
  S.btl=false;
  if(won){
    S.kills++;
    if(S.en.boss){
      let rw=CARDS.filter(x=>x.rarity==="E"||x.rarity==="L");
      RWARD=[pick(rw),pick(rw),pick(rw)];S.cr+=20;
      scr="rwd";
    } else {
      let pool=CARDS.filter(x=>x.type!=="bos");
      let rw=[];
      for(let i=0;i<3;i++){let r=Math.random(),ra=r<.05?"L":r<.12?"E":r<.3?"R":r<.55?"U":"C";rw.push({...pick(pool.filter(x=>x.rarity===ra)),u:Math.random()})}
      RWARD=rw;S.cr+=3+S.floor;scr="rwd";
    }
  } else scr="over";
}

function endTurn(){
  BT.pTurn=false;BT.anim=true;BT.logs=[];
  setTimeout(()=>{
    enemyTurn();
    if(S.en.hp<=0){endBtl(true);return}
    if(S.hp<=0){endBtl(false);return}
    S.nrg=S.mnrg+S.perm.nrg;S.sh=0;drawN(5+S.perm.draw);genIntent(S.en);
    BT.pTurn=true;BT.anim=false;
  },350);
}

  {t:"Странная машина",d:"Гудящий механизм.",ch:["Активировать","Уйти"],

      ()=>"Уходите"]}
];

// RENDER
// ════════════════════════════════════════
const RCLR={C:"#888",U:"#4a4",R:"#48f",E:"#a4f",L:"#da3"};
const TCLR={atk:"#e55",def:"#5ae",skl:"#8c4",mch:"#d73",evt:"#c7d",itm:"#da3"};
// Stamp / symbol drawing helpers
function stampDiamond(cx,cy,sz,col){
  G.strokeStyle=col;G.lineWidth=1;
  G.beginPath();G.moveTo(cx,cy-sz);G.lineTo(cx+sz,cy);G.lineTo(cx,cy+sz);G.lineTo(cx-sz,cy);G.closePath();G.stroke();
}
function stampCircle(cx,cy,sz,col){
  G.strokeStyle=col;G.lineWidth=1;
  G.beginPath();G.arc(cx,cy,sz,0,Math.PI*2);G.stroke();
}
function stampCross(cx,cy,sz,col){
  G.strokeStyle=col;G.lineWidth=1;
  G.beginPath();G.moveTo(cx-sz,cy-sz);G.lineTo(cx+sz,cy+sz);G.moveTo(cx+sz,cy-sz);G.lineTo(cx-sz,cy+sz);G.stroke();
}
function stampStar5(cx,cy,sz,col){
  G.strokeStyle=col;G.lineWidth=1;G.beginPath();
  for(let i=0;i<10;i++){
    let a=i*Math.PI/5-Math.PI/2,r=i%2?sz*.45:sz;
    let px2=cx+Math.cos(a)*r,py2=cy+Math.sin(a)*r;
    i===0?G.moveTo(px2,py2):G.lineTo(px2,py2);
  }G.closePath();G.stroke();
}
function stampHex(cx,cy,sz,col){
  G.strokeStyle=col;G.lineWidth=1;G.beginPath();
  for(let i=0;i<6;i++){let a=i*Math.PI/3-Math.PI/6;let px2=cx+Math.cos(a)*sz,py2=cy+Math.sin(a)*sz;i===0?G.moveTo(px2,py2):G.lineTo(px2,py2)}
  G.closePath();G.stroke();
}
function drawCornerDecor(x,y,w,h,col){
  G.strokeStyle=col;G.lineWidth=.5;
  let s=6;
  // top-left
  G.beginPath();G.moveTo(x+2,y+2+s);G.lineTo(x+2,y+2);G.lineTo(x+2+s,y+2);G.stroke();
  // top-right
  G.beginPath();G.moveTo(x+w-2-s,y+2);G.lineTo(x+w-2,y+2);G.lineTo(x+w-2,y+2+s);G.stroke();
  // bottom-left
  G.beginPath();G.moveTo(x+2,y+h-2-s);G.lineTo(x+2,y+h-2);G.lineTo(x+2+s,y+h-2);G.stroke();
  // bottom-right
  G.beginPath();G.moveTo(x+w-2-s,y+h-2);G.lineTo(x+w-2,y+h-2);G.lineTo(x+w-2,y+h-2-s);G.stroke();
}
function drawHorizLine(x,y,w,col){
  G.strokeStyle=col;G.lineWidth=.5;
  G.beginPath();G.moveTo(x,y);G.lineTo(x+w,y);G.stroke();
}

const TYPE_SYM={atk:["⚔","🗡","🗡","⚔","⚡"],def:["🛡","🔰","⛨","🛡","🏛"],
  skl:["✦","◇","⚙","✧","◈"],mch:["⚙","🤖","⚙","🔧","⚙"],
  evt:["⚡","!","☢","⚠","★"],itm:["◆","◇","⬡","♦","✦"],bos:["👑","♛","♚","👑","♛"]};
const EL_SYM={fire:"🔥",water:"💧",earth:"🌍",air:"💨",shadow:"🌑",none:""};
const EL_CLR2={fire:"#e04020",water:"#3080d0",earth:"#80a030",air:"#90c0e0",shadow:"#7040a0",none:"#444"};

function rCard(c,x,y,w,h,hv,can){
  G.save();
  let rc=RCLR[c.rarity]||"#888";
  let isRare=c.rarity==="R"||c.rarity==="E"||c.rarity==="L";

  // Glow for rare+
  if(isRare){
    G.shadowColor=rc;G.shadowBlur=hv?18:10;
  } else {
    G.shadowColor="rgba(0,0,0,.4)";G.shadowBlur=hv?10:5;
  }
  G.shadowOffsetY=hv?3:1;

  // Card body
  let bodyGrad=G.createLinearGradient(x,y,x,y+h);
  bodyGrad.addColorStop(0,"#18182a");bodyGrad.addColorStop(1,"#0e0e1a");
  G.fillStyle=bodyGrad;rr(x,y,w,h,5);G.fill();
  G.shadowColor="transparent";

  // Outer border
  let borderCol=can!==false?rc:"#333";
  if(hv && can!==false) borderCol="#4e8";
  if(hv && can===false) borderCol="#a44";
  G.strokeStyle=borderCol;G.lineWidth=hv?2.5:1.5;rr(x,y,w,h,5);G.stroke();

  // Corner decorations
  if(isRare) drawCornerDecor(x,y,w,h,rc+"80");

  // Type header stripe
  let tc=TCLR[c.type]||"#888";
  G.fillStyle=tc+"18";G.fillRect(x+1,y+1,w-2,15);

  // Cost circle
  G.fillStyle="#080810";G.beginPath();G.arc(x+11,y+9,8,0,Math.PI*2);G.fill();
  let costCol="#556"; // default grey
  if(can!==false){
    costCol=c.cost<=S.nrg?"#4e8":"#da4"; // green=affordable, amber=borderline
  } else {
    costCol="#a44"; // red=can't play
  }
  G.fillStyle=costCol;G.beginPath();G.arc(x+11,y+9,7,0,Math.PI*2);G.fill();
  G.fillStyle="#000";G.font="bold 9px monospace";G.textAlign="center";G.textBaseline="middle";
  G.fillText(c.cost,x+11,y+9.5);

  // Name
  G.fillStyle=rc;G.font="bold 7.5px sans-serif";G.textAlign="left";G.textBaseline="alphabetic";
  let nm=c.name.length>13?c.name.slice(0,12)+"..":c.name;
  G.fillText(nm,x+21,y+10);

  // --- ART ZONE ---
  let artY=y+18,artH=Math.max(30,h*.36|0);
  // art background with subtle grid
  G.fillStyle="#060610";G.fillRect(x+3,artY,w-6,artH);
  G.strokeStyle="#111";G.lineWidth=.3;
  for(let gy=artY;gy<artY+artH;gy+=5){G.beginPath();G.moveTo(x+3,gy);G.lineTo(x+w-3,gy);G.stroke()}
  for(let gx=x+3;gx<x+w-3;gx+=5){G.beginPath();G.moveTo(gx,artY);G.lineTo(gx,artY+artH);G.stroke()}

  let cx2=x+w/2,cy2=artY+artH/2;
  let elc=EL_CLR2[c.el]||"#444";
  let syms=TYPE_SYM[c.type]||["?"];
  let mainSym=syms[c.id%syms.length];

  // Type-specific art
  if(c.type==="atk"){
    // Sword cross
    G.strokeStyle=elc;G.lineWidth=2;
    G.beginPath();G.moveTo(cx2,cy2-artH*.35);G.lineTo(cx2,cy2+artH*.35);G.stroke();
    G.beginPath();G.moveTo(cx2-artH*.25,cy2-artH*.05);G.lineTo(cx2+artH*.25,cy2-artH*.05);G.stroke();
    // hilt
    G.fillStyle=elc;G.fillRect(cx2-6,cy2+artH*.12,12,3);
    // dots at ends
    G.beginPath();G.arc(cx2,cy2-artH*.35,2,0,Math.PI*2);G.fill();
    G.beginPath();G.arc(cx2,cy2+artH*.35,2,0,Math.PI*2);G.fill();
    // stamp
    stampDiamond(cx2+artH*.25,cy2-artH*.2,4,rc+"50");
  } else if(c.type==="def"){
    // Shield shape
    G.strokeStyle=elc;G.lineWidth=2;G.beginPath();
    G.moveTo(cx2,cy2+artH*.35);G.lineTo(cx2-artH*.3,cy2);G.lineTo(cx2-artH*.3,cy2-artH*.25);
    G.lineTo(cx2,cy2-artH*.38);G.lineTo(cx2+artH*.3,cy2-artH*.25);G.lineTo(cx2+artH*.3,cy2);G.closePath();
    G.stroke();G.fillStyle=elc+"15";G.fill();
    // inner diamond
    stampDiamond(cx2,cy2,artH*.12,elc+"60");
  } else if(c.type==="skl"){
    // Star burst
    stampStar5(cx2,cy2,artH*.3,rc+"70");
    stampStar5(cx2,cy2,artH*.15,rc+"40");
    // connecting lines
    G.strokeStyle=rc+"30";G.lineWidth=.5;
    for(let i=0;i<8;i++){let a=i*Math.PI/4;G.beginPath();G.moveTo(cx2,cy2);G.lineTo(cx2+Math.cos(a)*artH*.38,cy2+Math.sin(a)*artH*.38);G.stroke()}
  } else if(c.type==="mch"){
    // Robot head
    G.strokeStyle=elc;G.lineWidth=1.5;
    G.strokeRect(cx2-artH*.2,cy2-artH*.15,artH*.4,artH*.3);
    // eyes
    G.fillStyle=rc;G.fillRect(cx2-artH*.12,cy2-4,4,4);G.fillRect(cx2+artH*.04,cy2-4,4,4);
    // mouth
    G.strokeStyle=elc;G.beginPath();G.moveTo(cx2-artH*.1,cy2+artH*.08);G.lineTo(cx2+artH*.1,cy2+artH*.08);G.stroke();
    // antenna
    G.beginPath();G.moveTo(cx2,cy2-artH*.15);G.lineTo(cx2,cy2-artH*.32);G.stroke();
    G.fillStyle=rc;G.beginPath();G.arc(cx2,cy2-artH*.34,2,0,Math.PI*2);G.fill();
    // gear stamp
    stampHex(cx2-artH*.22,cy2+artH*.2,5,elc+"50");
  } else if(c.type==="evt"){
    // Lightning bolt
    G.strokeStyle=rc;G.lineWidth=2.5;G.beginPath();
    G.moveTo(cx2+2,cy2-artH*.38);G.lineTo(cx2-6,cy2-artH*.05);G.lineTo(cx2+3,cy2-artH*.02);
    G.lineTo(cx2-2,cy2+artH*.38);G.stroke();
    // energy rings
    G.strokeStyle=rc+"30";G.lineWidth=.8;
    G.beginPath();G.arc(cx2,cy2,artH*.28,0,Math.PI*2);G.stroke();
    G.beginPath();G.arc(cx2,cy2,artH*.18,0,Math.PI*2);G.stroke();
  } else if(c.type==="itm"){
    // Diamond frame
    stampDiamond(cx2,cy2,artH*.3,rc+"70");
    stampDiamond(cx2,cy2,artH*.2,rc+"40");
    // cross inside
    stampCross(cx2,cy2,artH*.1,elc+"50");
  } else if(c.type==="bos"){
    // Crown
    G.strokeStyle=rc;G.lineWidth=2;G.beginPath();
    G.moveTo(cx2-artH*.3,cy2+artH*.15);G.lineTo(cx2-artH*.3,cy2-artH*.05);
    G.lineTo(cx2-artH*.15,cy2+artH*.05);G.lineTo(cx2,cy2-artH*.3);
    G.lineTo(cx2+artH*.15,cy2+artH*.05);G.lineTo(cx2+artH*.3,cy2-artH*.05);
    G.lineTo(cx2+artH*.3,cy2+artH*.15);G.closePath();G.stroke();G.fillStyle=rc+"20";G.fill();
    // gems
    G.fillStyle="#e04040";G.beginPath();G.arc(cx2-artH*.15,cy2+artH*.05,2.5,0,Math.PI*2);G.fill();
    G.fillStyle="#4080e0";G.beginPath();G.arc(cx2,cy2-artH*.15,2.5,0,Math.PI*2);G.fill();
    G.fillStyle="#40c040";G.beginPath();G.arc(cx2+artH*.15,cy2+artH*.05,2.5,0,Math.PI*2);G.fill();
  }

  // Element symbol
  let esym=EL_SYM[c.el]||"";
  if(esym){G.font="8px sans-serif";G.textAlign="right";G.fillText(esym,x+w-5,artY+10)}

  // Legendary shimmer effect
  if(c.rarity==="L"){
    let t=Date.now()*.003;
    G.globalAlpha=.12+.08*Math.sin(t);
    let shimmer=G.createLinearGradient(x,y+h*(.3+Math.sin(t)*.3),x,y+h*(.5+Math.sin(t)*.3));
    shimmer.addColorStop(0,"transparent");shimmer.addColorStop(.5,"#fff");shimmer.addColorStop(1,"transparent");
    G.fillStyle=shimmer;G.fillRect(x,y,w,h);
    G.globalAlpha=1;
  }
  // Epic sparkle
  if(c.rarity==="E"){
    let t=Date.now()*.002;
    for(let i=0;i<3;i++){
      let sx2=x+5+(w-10)*((Math.sin(t+i*2.1)+1)/2);
      let sy2=artY+3+artH*((Math.cos(t*1.3+i*1.7)+1)/2);
      G.fillStyle="#fff";G.globalAlpha=.3+.2*Math.sin(t+i);
      G.beginPath();G.arc(sx2,sy2,1.2,0,Math.PI*2);G.fill();
    }
    G.globalAlpha=1;
  }

  // Type line
  let ty=artY+artH+2;
  G.fillStyle="#444";G.font="5.5px sans-serif";G.textAlign="center";
  G.fillText((c.type).toUpperCase()+" \u00B7 "+(c.el||"none").toUpperCase(),x+w/2,ty+6);

  // Divider line
  drawHorizLine(x+4,ty+9,w-8,rc+"30");

  // Description
  G.fillStyle="#999";G.font="6.5px sans-serif";G.textAlign="left";
  let lines=[],ln="",maxW2=w-8;
  for(let w2 of (c.desc||"").split(" ")){let t=ln+w2+" ";if(G.measureText(t).width>maxW2&&ln){lines.push(ln.trim());ln=w2+" "}else ln=t}lines.push(ln.trim());
  let dy=ty+16;
  for(let l of lines.slice(0,3)){G.fillText(l,x+4,dy);dy+=8}

  // Bottom stat bar
  let by2=y+h-12;
  // type stamp
  G.fillStyle=rc+"40";G.font="5px monospace";G.textAlign="left";
  G.fillText(mainSym,x+4,by2+3);

  // Stats
  G.textAlign="left";
  if(c.atk>0){G.fillStyle="#e55";G.font="bold 8px monospace";G.fillText("\u2694:"+c.atk,x+16,by2+3)}
  if(c.def>0){G.fillStyle="#5ae";G.font="bold 8px monospace";G.textAlign="right";G.fillText("\uD83D\uDEE1:"+c.def,x+w-4,by2+3)}

  // Rarity stamp at bottom-center
  G.textAlign="center";
  let rstamps={C:".",U:"..",R:"\u2605",E:"\u2605\u2605",L:"\u2605\u2605\u2605"};
  G.fillStyle=rc+"60";G.font="6px monospace";
  G.fillText(rstamps[c.rarity]||"",x+w/2,by2+3);

  // Hover + availability overlay
  if(hv){
    if(can!==false){
      // GREEN = playable
      G.fillStyle="rgba(40,200,80,.15)";rr(x+1,y+1,w-2,h-2,4);G.fill();
      G.strokeStyle="rgba(40,200,80,.6)";G.lineWidth=2;rr(x+1,y+1,w-2,h-2,4);G.stroke();
    } else {
      // RED = can't play
      G.fillStyle="rgba(200,40,40,.12)";rr(x+1,y+1,w-2,h-2,4);G.fill();
      G.strokeStyle="rgba(200,40,40,.5)";G.lineWidth=2;rr(x+1,y+1,w-2,h-2,4);G.stroke();
      // X mark
      G.strokeStyle="rgba(200,40,40,.3)";G.lineWidth=2;
      G.beginPath();G.moveTo(x+4,y+4);G.lineTo(x+w-4,y+h-4);G.moveTo(x+w-4,y+4);G.lineTo(x+4,y+h-4);G.stroke();
    }
  }

  G.restore();
}

function rScr(){
  G.fillStyle="#0a0a14";G.fillRect(0,0,W,H);
  ({menu:rMenu,map:rMap,bat:rBat,shp:rShp,evt:rEvt,rwd:rRwd,over:rOver,frg:rFrg,col:rCol})[scr]();
  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=.03;
    if(p.life<=0){particles.splice(i,1);continue}
    G.globalAlpha=p.life;G.fillStyle=p.c;G.fillRect(p.x,p.y,3,3);
  }
  G.globalAlpha=1;clk=false;requestAnimationFrame(rScr);
}

function pAdd(x,y,c,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:1,c})}

// MENU
function rMenu(){
  G.textAlign="center";
  let g=G.createLinearGradient(W/2-200,0,W/2+200,0);
  g.addColorStop(0,"#f0d070");g.addColorStop(1,"#a06010");
  G.fillStyle=g;G.font="bold 56px sans-serif";G.fillText("MECH KINGS",W/2,H/2-20);
  G.fillStyle="#d4a84360";G.font="14px sans-serif";G.fillText("300 карт / Рогалик / Карточная игра",W/2,H/2+12);
  let btns=[["НОВАЯ ИГРА",H/2+60,()=>{mkGame();scr="map"}],["КОЛЛЕКЦИЯ",H/2+105,()=>scr="col"]];
  for(let[bt,by,fn]of btns){
    let bx=W/2-100,h=mx>bx&&mx<bx+200&&my>by&&my<by+36;
    G.fillStyle=h?"#d4a843":"#12121f";G.strokeStyle=h?"#d4a843":"#2a2a40";G.lineWidth=1;
    rr(bx,by,200,36,4);G.fill();rr(bx,by,200,36,4);G.stroke();
    G.fillStyle=h?"#000":"#d4a843";G.font="bold 13px sans-serif";G.fillText(bt,W/2,by+22);

// MAP
function rMap(){
  G.fillStyle="#12121f";G.fillRect(0,0,W,40);G.strokeStyle="#2a2a40";G.beginPath();G.moveTo(0,40);G.lineTo(W,40);G.stroke();
  G.font="12px monospace";G.textAlign="left";
  G.fillStyle="#d4a843";G.fillText("Этаж "+S.floor+"/5",10,26);
  G.fillStyle="#e55";G.fillText("HP:"+S.hp+"/"+S.mhp,100,26);
  G.fillStyle="#5ae";G.fillText("SH:"+S.sh,220,26);
  G.fillStyle="#da3";G.fillText("$:"+S.cr,310,26);
  G.fillStyle="#888";G.fillText("К:"+S.deck.length,390,26);
  let mt=56,mh=H-mt-10,rh=mh/S.map.length;
  // connections
  G.lineWidth=1;
  for(let r=0;r<S.map.length-1;r++){
    S.map[r].forEach(n=>{
      let fx=30+n.c*((W-60)/(S.map[r].length-1||1)),fy=mt+r*rh+rh/2;
      n.conn.forEach(ci=>{
        let tx=30+ci*((W-60)/(S.map[r+1].length-1||1)),ty=mt+(r+1)*rh+rh/2;
        G.strokeStyle=(n.vis&&S.mrow>r)?"#d4a84330":"#1a1a2a";G.beginPath();G.moveTo(fx,fy);G.lineTo(tx,ty);G.stroke();
      });
    });
  }
  // nodes
  let icons={bat:"E",evt:"?",shp:"$",frg:"F",rst:"+",bos:"K"};
  for(let r=0;r<S.map.length;r++){
    S.map[r].forEach((n,c)=>{
      let nx=30+c*((W-60)/(S.map[r].length-1||1)),ny=mt+r*rh+rh/2,sz=18;
      let acc=false;
      if(r===S.mrow){if(S.mrow===0&&!n.vis)acc=true;else if(S.mrow>0){let pr=S.map[S.mrow-1];if(pr&&pr.some(p=>p.vis&&p.conn.includes(c)))acc=true}}
      let h=mx>nx-sz&&mx<nx+sz&&my>ny-sz&&my<ny+sz;
      G.fillStyle=n.vis?"#1a1a2f":acc?(n.t==="bos"?"#3a1a1a":"#1a2a2a"):"#12121f";
      G.strokeStyle=n.vis?"#333":acc?(n.t==="bos"?"#e55":"#4b4"):"#2a2a40";
      if(h&&acc){G.strokeStyle="#d4a843";G.shadowColor="#d4a843";G.shadowBlur=10}
      G.lineWidth=2;G.beginPath();G.arc(nx,ny,sz,0,Math.PI*2);G.fill();G.stroke();G.shadowColor="transparent";
      G.font="14px monospace";G.textAlign="center";G.textBaseline="middle";
      G.fillStyle=n.vis?"#444":"#ccc";G.fillText(icons[n.t]||"?",nx,ny);
      G.textBaseline="alphabetic";
      if(h&&acc&&clk){
        n.vis=true;
        if(n.t==="bat")startBtl(false);
        else if(n.t==="bos")startBtl(true);
        else if(n.t==="evt")openEvt();
        else if(n.t==="shp")openShop();
        else if(n.t==="frg")openForge();
        else if(n.t==="rst"){S.hp=Math.min(S.hp+(S.mhp*.3|0),S.mhp);pAdd(W/2,H/2,"#4a6",15);advMap()}
      }
    });
  }
}

function advMap(){
  S.mrow++;
  if(S.mrow>=S.map.length){
    if(S.floor>=5){scr="over";return}
    S.floor++;genMap();S.hp=Math.min(S.hp+15,S.mhp);
  }
  scr="map";
}

// BATTLE
function rBat(){
  let e=S.en;
  G.fillStyle="#12121f";G.fillRect(0,0,W,130);G.strokeStyle="#c4404020";G.beginPath();G.moveTo(0,130);G.lineTo(W,130);G.stroke();
  G.textAlign="center";
  G.fillStyle=e.boss?"#d4a843":"#e55";G.font=(e.boss?"bold 16px":"bold 13px")+" sans-serif";G.fillText(e.n,W/2,22);
  G.fillStyle="#888";G.font="10px sans-serif";G.fillText(e.d,W/2,36);
  // hp bar
  let bw=200,bx=W/2-bw/2,by=42;
  G.fillStyle="#1a1a2a";rr(bx,by,bw,10,5);G.fill();
  G.fillStyle=e.boss?"#d4a843":"#e55";rr(bx,by,bw*Math.max(0,e.hp/e.mhp),10,5);G.fill();

// Fix: item cards broke mechs array, restore it
const _origExec=execCard;
// Fix: when type is item, don't clear mechs
const origExecCard=execCard;
execCard=function(c){
  if(c.type==="itm"){
    // just run item effects without touching mechs
    let e=S.en,d=c.desc,ab=S.perm.atk;
    if(d.includes("+2 ур.")){S.perm.atk+=2;btlLog("+2 урон!","#c4")}
    if(d.includes("+4 ур.")){S.perm.atk+=4;btlLog("+4 урон!","#c4")}
    if(d.includes("+6 ур.")){S.perm.atk+=6;btlLog("+6 урон!","#c4")}
    if(d.includes("+2 щит"))S.sh+=2;
    if(d.includes("+5 щит"))S.sh+=5;
    if(d.includes("+8 щит"))S.sh+=8;
    if(d.includes("+1 energy/ход")){S.perm.nrg++;S.nrg++}
    if(d.includes("+2 energy/ход")){S.perm.nrg+=2;S.nrg+=2}
    if(d.includes("+1 draw/ход")){S.perm.draw++;drawN(1)}
    if(d.includes("+20 HP")){S.hp=Math.min(S.hp+20,S.mhp);btlLog("+20 HP!","#4a6")}
    if(d.includes("+3 max HP")){S.mhp+=3;S.hp+=3}
    if(d.includes("Мехи +3 HP"))S.perm.mhp+=3;
    if(d.includes("Burn +2"))S.perm.burn+=2;
    if(d.includes("Stealth"))S.sh+=999;
    if(d.includes("x2 урона"))btlLog("x2!","#c4");
    btlLog("Item: "+c.name,"#da3");
    return;
  }
  // For non-item, run normally
  let e=S.en,ab=S.perm.atk,dd=c.desc;
  if(c.type==="atk"){
    let dmg=c.atk+ab;
    if(e.vuln>0){dmg=dmg*1.5|0;e.vuln--}
    if(e.weak>0)dmg=Math.max(1,dmg-2);
    if(dd.includes("x2"))dmg*=2;
    e.hp-=dmg;btlLog("-"+dmg+" врагу","#e55");
    if(S.perm.burn>0)e.burn+=S.perm.burn;
    if(dd.includes("burn"))e.burn+=2;
    if(dd.includes("slow"))e.slow++;
    if(dd.includes("shock"))e.stun++;
    if(dd.includes("heal")){S.hp=Math.min(S.hp+3,S.mhp);btlLog("+3 HP","#4a6")}
    if(dd.includes("draw"))drawN(1);
    if(dd.includes("-5 HP")){S.hp-=5;btlLog("-5 HP","#a44")}
    if(dd.includes("-3 HP")){S.hp-=3;btlLog("-3 HP","#a44")}
  } else if(c.type==="def"){
    if(c.def>0){S.sh+=c.def;btlLog("+"+c.def+" щит","#5ae")}
    if(dd.includes("+6 HP")){S.hp=Math.min(S.hp+6,S.mhp);btlLog("+6 HP","#4a6")}
    if(dd.includes("+8 HP")){S.hp=Math.min(S.hp+8,S.mhp);btlLog("+8 HP","#4a6")}
    if(dd.includes("+15 HP")){S.hp=Math.min(S.hp+15,S.mhp);btlLog("+15 HP","#4a6")}
    if(dd.includes("+7 HP")){S.hp=Math.min(S.hp+7,S.mhp);btlLog("+7 HP","#4a6")}
    if(dd.includes("+5 HP")){S.hp=Math.min(S.hp+5,S.mhp);btlLog("+5 HP","#4a6")}
    if(dd.includes("+4 HP")){S.hp=Math.min(S.hp+4,S.mhp);btlLog("+4 HP","#4a6")}
    if(dd.includes("+3 HP")){S.hp=Math.min(S.hp+3,S.mhp);btlLog("+3 HP","#4a6")}
    if(dd.includes("draw"))drawN(dd.includes("2")?2:1);
    if(dd.includes("+2能量")||dd.includes("+2 энер"))S.nrg+=2;
    if(dd.includes("отразить")){e.stun++;btlLog("Отражено!","#a4f")}
    if(dd.includes("免疫"))S.sh+=999;
    if(dd.includes("3 ур врагу")){e.hp-=3;btlLog("-3 врагу","#e55")}
    if(dd.includes("2 ур врагу")){e.hp-=2;btlLog("-2 врагу","#e55")}
    if(dd.includes("Снять"))btlLog("Очищено","#4a6");
  } else if(c.type==="mch"){
    if(S.mechs.length<4){
      let hp=5+S.perm.mhp+c.atk,atk=Math.max(2,c.atk*.5|0);
      S.mechs.push({n:c.name,hp,mhp:hp,atk});btlLog("Summon: "+c.name+" HP"+hp,"#d73");
    } else btlLog("Max mechs","#a66");
  } else if(c.type==="skl"){
    if(dd.includes("Draw 1"))drawN(1);
    if(dd.includes("Draw 2"))drawN(2);
    if(dd.includes("Draw 3"))drawN(3);
    if(dd.includes("Draw 4"))drawN(4);
    if(dd.includes("+1 energy")||dd.includes("+1 energ"))S.nrg++;
    if(dd.includes("+2 energy"))S.nrg+=2;
    if(dd.includes("+2 ур. навсегда")||dd.includes("+2 ур навсегда")){S.perm.atk+=2;btlLog("+2 урон!","#c4")}
    if(dd.includes("+3 ур. навсегда")){S.perm.atk+=3;btlLog("+3 урон!","#c4")}
    if(dd.includes("+1 урон навсегда")||dd.includes("+1 ур. навсегда")){S.perm.atk++;btlLog("+1 урон!","#c4")}
    if(dd.includes("пропускает"))e.stun++;
    if(dd.includes("x2 урона"))e.vuln++;
    if(dd.includes("Сброс, draw 4")){S.dsc.push(...S.hand);S.hand=[];drawN(4);btlLog("Сброс+4","#888")}
    if(dd.includes("Перемешать")){S.draw.push(...S.dsc);S.dsc=[];shuf(S.draw);btlLog("Shuffle","#888")}
    if(dd.includes("+2 HP")){S.hp=Math.min(S.hp+2,S.mhp);btlLog("+2 HP","#4a6")}
    if(dd.includes("+3 HP")){S.hp=Math.min(S.hp+3,S.mhp);btlLog("+3 HP","#4a6")}
    if(dd.includes("-2 урона"))e.weak+=3;
    if(dd.includes("Скопировать")&&S.hand.length>0){let rc=S.hand[0];S.hand.push({...rc,u:Math.random()});btlLog("Copy!","#c4")}
  } else if(c.type==="evt"){
    if(dd.includes("враг -5")||dd.includes("Враг -5")){e.hp-=5;btlLog("-5","#e55")}
    if(dd.includes("Враг -6")){e.hp-=6;btlLog("-6","#e55")}
    if(dd.includes("Враг -4")){e.hp-=4;btlLog("-4","#e55")}
    if(dd.includes("враг -8")){e.hp-=8;btlLog("-8","#e55")}
    if(dd.includes("враг -3")){e.hp-=3;btlLog("-3","#e55")}
    if(dd.includes("вы -2")){S.hp-=2;btlLog("-2 HP","#a44")}
    if(dd.includes("вы -4")){S.hp-=4;btlLog("-4 HP","#a44")}
    if(dd.includes("все -4")){e.hp-=4;S.hp-=4;btlLog("-4 all","#a44")}
    if(dd.includes("-5 HP")&&!dd.includes("враг")){S.hp-=5;btlLog("-5","#a44")}
    if(dd.includes("-3 HP")&&!dd.includes("враг")){S.hp-=3;btlLog("-3","#a44")}
    if(dd.includes("+8 кредитов")||dd.includes("+8 кр")){S.cr+=8;btlLog("+8$","#da3")}
    if(dd.includes("+15 кредитов")){S.cr+=15;btlLog("+15$","#da3")}
    if(dd.includes("x2 кредиты")){S.cr*=2;btlLog("x2$","#da3")}
    if(dd.includes("+10 HP")){S.hp=Math.min(S.hp+10,S.mhp);btlLog("+10 HP","#4a6")}
    if(dd.includes("+8 HP")&&!dd.includes("кр")){S.hp=Math.min(S.hp+8,S.mhp);btlLog("+8 HP","#4a6")}
    if(dd.includes("+6 HP")){S.hp=Math.min(S.hp+6,S.mhp);btlLog("+6 HP","#4a6")}
    if(dd.includes("+5 HP + 5")){S.hp=Math.min(S.hp+5,S.mhp);S.cr+=5;btlLog("+5 HP+5$","#4a6")}
    if(dd.includes("+15 HP")){S.hp=Math.min(S.hp+15,S.mhp);btlLog("+15 HP","#4a6")}
    if(dd.includes("+3 карты")){for(let i=0;i<3;i++)S.hand.push({...pick(CARDS),u:Math.random()});btlLog("+3 cards","#c4")}
    if(dd.includes("редкая")){let r=CARDS.filter(x=>x.rarity==="R"||x.rarity==="E");S.hand.push({...pick(r),u:Math.random()});btlLog("Rare!","#48f")}
    if(dd.includes("Draw 4"))drawN(4);
    if(dd.includes("Draw 2 атак")){let a=CARDS.filter(x=>x.type==="atk");for(let i=0;i<2;i++)S.hand.push({...pick(a),u:Math.random()})}
    if(dd.includes("+2 energy"))S.nrg+=2;
    if(dd.includes("Враг stun 2"))e.stun+=2;
    if(dd.includes("Враг stun 1"))e.stun++;
    if(dd.includes("slow 2"))e.slow+=2;
    if(dd.includes("-1 energy 3")){S.mnrg=Math.max(1,S.mnrg-1);btlLog("-1 max nrg","#a44")}
    if(dd.includes("+2 ур. 5 ходов")){S.perm.atk+=2;btlLog("+2 урон!","#c4")}
    if(dd.includes("Мехи +2 ур.")){S.mechs.forEach(m=>m.atk+=2);btlLog("Mechs +2!","#d73")}
    if(dd.includes("5 дронов")){for(let i=0;i<5;i++)if(S.mechs.length<4)S.mechs.push({n:"Drone",hp:2,mhp:2,atk:1});btlLog("+5 drones","#d73")}
    if(dd.includes("3 дрона")){for(let i=0;i<3;i++)if(S.mechs.length<4)S.mechs.push({n:"Drone",hp:2,mhp:2,atk:1});btlLog("+3 drones","#d73")}
    if(dd.includes("+1 energy навсегда")){S.perm.nrg++;btlLog("+1 nrg!","#4af")}
  }
};

rScr();
</script>
