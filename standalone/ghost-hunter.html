<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Охотники за привидениями</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Courier New',monospace;cursor:default}
canvas{display:block}
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;display:none}
#score{position:absolute;top:16px;left:20px;color:#8af;font-size:22px;text-shadow:0 0 10px rgba(136,170,255,.5)}
#timer{position:absolute;top:16px;right:20px;color:#f88;font-size:22px;text-shadow:0 0 10px rgba(255,136,136,.5)}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.5)}
#crosshair::before{width:2px;height:100%;left:50%;transform:translateX(-50%)}
#crosshair::after{width:100%;height:2px;top:50%;transform:translateY(-50%)}
#traps{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;gap:14px;pointer-events:auto}
.trap-btn{width:52px;height:52px;border:3px solid #fff5;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;background:rgba(0,0,0,.6);cursor:pointer;transition:.15s;user-select:none}
.trap-btn:hover{transform:scale(1.1)}
.trap-btn.active{box-shadow:0 0 16px currentColor;border-color:#fff}
.trap-btn .key{font-size:11px;opacity:.6;position:absolute;margin-top:28px}
#msg{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);color:#ff0;font-size:26px;text-shadow:0 0 20px rgba(255,255,0,.6);opacity:0;transition:opacity .3s;text-align:center;pointer-events:none}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(4,4,20,.92);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;color:#fff;font-family:'Courier New',monospace;text-align:center}
#overlay h1{font-size:44px;color:#8af;text-shadow:0 0 30px rgba(136,170,255,.4);margin-bottom:8px;letter-spacing:6px}
#overlay h2{font-size:18px;color:#666;font-weight:normal;margin-bottom:32px;letter-spacing:4px}
#overlay .keys{color:#888;font-size:14px;line-height:2}
#overlay .key{color:#ff0}
#overlay .start{color:#8af;font-size:20px;margin-top:32px;animation:pulse 1.5s infinite}
#overlay .final-score{font-size:48px;color:#ff0;margin:16px 0}
@keyframes pulse{50%{opacity:.3}}
</style>
</head>
<body>

<div id="overlay">
  <h1>👻 ОХОТНИКИ</h1>
  <h2>за привидениями</h2>
  <div class="keys">
    <span class="key">WASD</span> — движение<br>
    <span class="key">Мышь</span> — взгляд<br>
    <span class="key">1 2 3</span> — выбор ловушки<br>
    <span class="key">ЛКМ</span> — поставить ловушку
  </div>
  <div class="start" id="startBtn">▶ НАЖМИТЕ ПРОБЕЛ</div>
</div>

<div id="hud">
  <div id="score">👻 0</div>
  <div id="timer">⏱ 60</div>
  <div id="traps"></div>
  <div id="crosshair"></div>
  <div id="msg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// CONFIG
// ============================================================
const HW = 7, HD = 6, FH = 3.5;
const COLORS = { wall: 0x6688cc, wallDim: 0x445577, ghost: [0xff4444, 0x44ff44, 0x4488ff], trap: [0xff4444, 0x44ff44, 0x4488ff] };
const GHOST_TYPES = [
  { name:'Огневица', color:0xff4444, geo:'sphere', spd:2.0, pts:50, rad:0.35 },
  { name:'Дух леса',  color:0x44ff44, geo:'oct',   spd:1.4, pts:75, rad:0.45 },
  { name:'Фантом',    color:0x4488ff, geo:'ico',   spd:0.9, pts:100,rad:0.55 }
];

// ============================================================
// THREE.JS SETUP
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.Fog(0x0a0a1a, 18, 35);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 60);
camera.position.set(0, 1.7, 9.5);
camera.lookAt(0, 1.7, 4);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);

// ============================================================
// STARS
// ============================================================
(function(){
  const g = new THREE.BufferGeometry();
  const v = [];
  for(let i=0;i<800;i++) v.push((Math.random()-.5)*120, (Math.random()-.5)*80, -Math.random()*60-20);
  g.setAttribute('position', new THREE.Float32BufferAttribute(v,3));
  const m = new THREE.PointsMaterial({ color:0x88aaff, size:0.08, transparent:true, opacity:0.6 });
  scene.add(new THREE.Points(g,m));
})();

// ============================================================
// GROUND
// ============================================================
(function(){
  const g = new THREE.PlaneGeometry(40, 40);
  const m = new THREE.MeshBasicMaterial({ color:0x111122, side:THREE.DoubleSide, transparent:true, opacity:0.5 });
  const mesh = new THREE.Mesh(g, m);
  mesh.rotation.x = -Math.PI/2;
  mesh.position.y = -0.05;
  scene.add(mesh);
  // grid
  const grid = new THREE.GridHelper(40, 40, 0x223355, 0x223355);
  grid.material.transparent = true; grid.material.opacity = 0.3;
  scene.add(grid);
})();

// ============================================================
// HOUSE BUILDER
// ============================================================
const house = new THREE.Group();
const wallColliders = [];

function addWall(x, y, z, w, h, d, color, opacity) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshBasicMaterial({ color: color||COLORS.wall, transparent:true, opacity:opacity||0.12 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  house.add(mesh);
  // edges
  const edges = new THREE.EdgesGeometry(geo);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color:color||COLORS.wall, transparent:true, opacity:0.7 }));
  line.position.copy(mesh.position);
  house.add(line);
  // collider
  const half = { x:w/2, y:h/2, z:d/2 };
  wallColliders.push({
    min: { x:x-half.x, y:y-half.y, z:z-half.z },
    max: { x:x+half.x, y:y+half.y, z:z+half.z }
  });
  return mesh;
}

function addFloor(y, color) {
  const geo = new THREE.PlaneGeometry(HW*2-0.2, HD*2-0.2);
  const mat = new THREE.MeshBasicMaterial({ color:color||0x1a1a2e, side:THREE.DoubleSide, transparent:true, opacity:0.3 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI/2;
  mesh.position.y = y;
  house.add(mesh);
  // floor edges
  const edge = new THREE.EdgesGeometry(new THREE.PlaneGeometry(HW*2-0.2, HD*2-0.2));
  const line = new THREE.LineSegments(edge, new THREE.LineBasicMaterial({ color:0x445577, transparent:true, opacity:0.4 }));
  line.rotation.x = -Math.PI/2;
  line.position.y = y;
  house.add(line);
}

function buildHouse() {
  // Outer shell (full 2-floor height)
  const oh = FH*2;
  addWall(0, FH, -HD, HW*2, oh, 0.15); // back
  addWall(0, FH,  HD, HW*2, oh, 0.15); // front
  addWall(-HW, FH, 0, 0.15, oh, HD*2); // left
  addWall( HW, FH, 0, 0.15, oh, HD*2); // right

  // Floors
  addFloor(0);
  addFloor(FH);

  // Ground floor inner walls
  const c1 = COLORS.wallDim;
  addWall(-HW*0.35, FH/2, -HD*0.5, 0.12, FH, HD*0.9, c1); // left room divider (vert)
  addWall(0, FH/2, -HD*0.45, HW*0.65, FH, 0.12, c1);       // back room divider (horiz)
  
  // 2nd floor inner walls
  addWall(0, FH*1.5, -HD*0.5, 0.12, FH, HD*0.9, c1);
  addWall(HW*0.35, FH*1.5, -HD*0.45, HW*0.65, FH, 0.12, c1);

  // Stairs (simple steps)
  for (let i=0; i<10; i++) {
    const s = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.15, 0.6),
      new THREE.MeshBasicMaterial({ color:0x667788, wireframe:true })
    );
    s.position.set(HW-0.5, i*0.35+0.05, -HD*0.6+i*0.7);
    house.add(s);
  }

  // Simple furniture - wireframe boxes
  const furMat = new THREE.MeshBasicMaterial({ color:0x556677, wireframe:true });
  // Table (ground floor)
  const table = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), furMat);
  table.position.set(-HW*0.5, 0.4, -HD*0.3);
  house.add(table);
  // Chair
  const chair = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.4), furMat);
  chair.position.set(-HW*0.5+0.9, 0.25, -HD*0.3);
  house.add(chair);
  // Bed (2nd floor)
  const bed = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 1.0), furMat);
  bed.position.set(-HW*0.3, FH+0.2, -HD*0.2);
  house.add(bed);
  // Bookshelf
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.8, 0.4), furMat);
  shelf.position.set(HW-0.5, FH+0.9, HD*0.3);
  house.add(shelf);

  scene.add(house);
}

buildHouse();

// ============================================================
// PLAYER CONTROLS
// ============================================================
const player = { pos: new THREE.Vector3(0, 1.7, 9.5), yaw: 0, pitch: 0, speed: 3.5 };
const keys = {};

function collide(pos) {
  const r = 0.2;
  for (const w of wallColliders) {
    if (pos.x+r > w.min.x && pos.x-r < w.max.x &&
        pos.z+r > w.min.z && pos.z-r < w.max.z &&
        pos.y > w.min.y && pos.y < w.max.y) {
      return true;
    }
  }
  return false;
}

function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

function movePlayer(dt) {
  if (!document.pointerLockElement) return;
  const dir = new THREE.Vector3(0, 0, 0);
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const rgt = new THREE.Vector3(fwd.z, 0, -fwd.x);
  if (keys['KeyW']) dir.add(fwd);
  if (keys['KeyS']) dir.sub(fwd);
  if (keys['KeyA']) dir.sub(rgt);
  if (keys['KeyD']) dir.add(rgt);
  if (dir.length() > 0) {
    dir.normalize().multiplyScalar(player.speed * dt);
    const nx = player.pos.x + dir.x;
    const nz = player.pos.z + dir.z;
    if (!collide(new THREE.Vector3(nx, player.pos.y, player.pos.z))) player.pos.x = nx;
    if (!collide(new THREE.Vector3(player.pos.x, player.pos.y, nz))) player.pos.z = nz;
  }
  camera.position.copy(player.pos);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
}

let stairCD = 0;
function checkStairs(dt) {
  if (!document.pointerLockElement) return;
  stairCD -= dt;
  if (stairCD > 0) return;
  const dx = Math.abs(player.pos.x - (HW-0.5));
  const dz = Math.abs(player.pos.z - (-HD*0.3));
  if (dx < 1.0 && dz < 1.2) {
    if (Math.abs(player.pos.y - FH/2) < FH/2) {
      player.pos.y = FH + 1.7;
    } else {
      player.pos.y = 1.7;
    }
    stairCD = 1.5;
    showMsg(player.pos.y > FH ? '↕ Второй этаж' : '↕ Первый этаж', 0.8);
  }
}

document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  player.yaw -= e.movementX * 0.002;
  player.pitch -= e.movementY * 0.002;
  player.pitch = clamp(player.pitch, -Math.PI/2.2, Math.PI/2.2);
});

// ============================================================
// GHOST SYSTEM
// ============================================================
const ghosts = [];

function createGhost(type) {
  const cfg = GHOST_TYPES[type];
  let geo;
  if (cfg.geo === 'sphere') geo = new THREE.SphereGeometry(cfg.rad, 10, 10);
  else if (cfg.geo === 'oct') geo = new THREE.OctahedronGeometry(cfg.rad);
  else geo = new THREE.IcosahedronGeometry(cfg.rad);
  
  const mat = new THREE.MeshBasicMaterial({
    color: cfg.color,
    transparent: true,
    opacity: 0.7,
    wireframe: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  
  // Glow aura
  const auraMat = new THREE.MeshBasicMaterial({
    color: cfg.color,
    transparent: true,
    opacity: 0.15,
  });
  const aura = new THREE.Mesh(new THREE.SphereGeometry(cfg.rad*2.2, 8, 8), auraMat);
  mesh.add(aura);
  
  // Spawn position: inside the house, random room
  const side = Math.random() > 0.5 ? 1 : -1;
  const rx = (Math.random() * HW * 0.75) * side;
  const rz = (Math.random() * HD * 0.75) * side;
  const ry = Math.random() > 0.5 ? 0.8 + Math.random() * 1.5 : FH + 0.8 + Math.random() * 1.5;
  
  mesh.position.set(rx, ry, rz);
  
  const ghost = {
    mesh, type, cfg,
    home: new THREE.Vector3(rx, ry, rz),
    target: new THREE.Vector3(rx, ry, rz),
    speed: cfg.spd * (0.5 + Math.random() * 0.5),
    phase: Math.random() * Math.PI * 2,
    alive: true,
    caught: false
  };
  
  scene.add(mesh);
  ghosts.push(ghost);
  return ghost;
}

function updateGhosts(dt, time) {
  for (const g of ghosts) {
    if (g.caught) continue;
    // Bob
    g.mesh.position.y += Math.sin(time * 2 + g.phase) * dt * 0.15;
    
    // Move toward target
    const dx = g.target.x - g.mesh.position.x;
    const dz = g.target.z - g.mesh.position.z;
    const dist = Math.sqrt(dx*dx + dz*dz);
    if (dist < 0.3) {
      // New target
      g.target.set(
        g.home.x + (Math.random() - 0.5) * 3,
        g.home.y,
        g.home.z + (Math.random() - 0.5) * 3
      );
      // Clamp to house
      g.target.x = clamp(g.target.x, -HW+0.5, HW-0.5);
      g.target.z = clamp(g.target.z, -HD+0.5, HD-0.5);
      g.target.y = g.home.y + Math.sin(Math.random() * 6) * 0.5;
    } else {
      const step = g.speed * dt;
      g.mesh.position.x += (dx/dist) * step;
      g.mesh.position.z += (dz/dist) * step;
    }
    
    // Slight rotation
    g.mesh.rotation.y += dt * 0.5;
    g.mesh.rotation.x += dt * 0.2;
    
    // Pulse opacity
    g.mesh.material.opacity = 0.5 + Math.sin(time * 3 + g.phase) * 0.2;
    g.mesh.children[0].material.opacity = 0.1 + Math.sin(time * 2 + g.phase) * 0.08;
  }
}

// ============================================================
// TRAP SYSTEM
// ============================================================
const traps = [];
let currentTrap = 0;

function createTrap(x, y, z) {
  const type = currentTrap;
  const color = COLORS.trap[type];
  
  // Ring
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.01, 0.08, 8, 20),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.9 })
  );
  ring.position.set(x, y + 0.1, z);
  ring.rotation.x = Math.PI / 2;
  
  // Inner glow
  const glow = new THREE.Mesh(
    new THREE.CircleGeometry(0.01, 16),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.2 })
  );
  glow.position.set(x, y + 0.08, z);
  glow.rotation.x = -Math.PI / 2;
  
  scene.add(ring);
  scene.add(glow);
  
  const trap = {
    ring, glow, type, color,
    x, y, z,
    life: 0,
    maxLife: 4,
    radius: 0.01,
    maxRadius: 2.2,
    active: true
  };
  traps.push(trap);
  
  showMsg(`Ловушка ${GHOST_TYPES[type].name}!`, 1);
}

function updateTraps(dt) {
  for (let i=traps.length-1; i>=0; i--) {
    const t = traps[i];
    t.life += dt;
    
    if (t.life < 0.5) {
      // Expanding
      t.radius = t.maxRadius * (t.life / 0.5);
    } else if (t.life < t.maxLife - 0.5) {
      // Active
      t.radius = t.maxRadius;
    } else if (t.life < t.maxLife) {
      // Fading
      t.radius = t.maxRadius * ((t.maxLife - t.life) / 0.5);
    } else {
      // Remove
      scene.remove(t.ring);
      scene.remove(t.glow);
      traps.splice(i, 1);
      continue;
    }
    
    // Update visuals
    t.ring.scale.set(t.radius*5, t.radius*5, 1);
    t.glow.scale.set(t.radius*5, t.radius*5, 1);
    const fade = t.life < 0.5 ? t.life/0.5 : (t.life > t.maxLife-0.5 ? (t.maxLife-t.life)/0.5 : 1);
    t.ring.material.opacity = 0.9 * fade;
    t.glow.material.opacity = 0.25 * fade;
    
    // Check captures
    if (t.active && t.life > 0.3 && t.life < t.maxLife - 0.3) {
      for (const g of ghosts) {
        if (g.caught) continue;
        if (g.type !== t.type) continue;
        const dx = g.mesh.position.x - t.x;
        const dz = g.mesh.position.z - t.z;
        const dist = Math.sqrt(dx*dx + dz*dz);
        if (dist < t.radius) {
          captureGhost(g);
          t.active = false;
          break;
        }
      }
    }
  }
}

function captureGhost(g) {
  g.caught = true;
  game.score += GHOST_TYPES[g.type].pts;
  updateHUD();
  
  // Capture effect - flash and shrink
  g.mesh.material.color.set(0xffffff);
  showMsg(`+${GHOST_TYPES[g.type].pts} ${GHOST_TYPES[g.type].name} пойман!`, 1.5);
  
  setTimeout(() => {
    scene.remove(g.mesh);
  }, 300);
}

// ============================================================
// RAYCAST FOR TRAP PLACEMENT
// ============================================================
function tryPlaceTrap() {
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  
  // Cast against floor planes
  const floorY = [0.01, FH + 0.01];
  let hit = null;
  for (const fy of floorY) {
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -fy);
    const pt = new THREE.Vector3();
    const intersected = raycaster.ray.intersectPlane(plane, pt);
    if (intersected && pt.x > -HW+0.3 && pt.x < HW-0.3 && pt.z > -HD+0.3 && pt.z < HD-0.3) {
      if (!hit || camera.position.distanceTo(pt) < camera.position.distanceTo(hit)) hit = pt.clone();
    }
  }
  
  if (hit) {
    createTrap(hit.x, hit.y, hit.z);
  } else {
    showMsg('Цельтесь в пол!', 0.8);
  }
}

// ============================================================
// GAME STATE
// ============================================================
const game = {
  score: 0,
  timeLeft: 60,
  running: false,
  lastSpawn: 0,
  spawnInterval: 2.5,
  totalGhosts: 0
};

function startGame() {
  // Clear old
  ghosts.forEach(g => scene.remove(g.mesh));
  ghosts.length = 0;
  traps.forEach(t => { scene.remove(t.ring); scene.remove(t.glow); });
  traps.length = 0;
  game.score = 0;
  game.timeLeft = 60;
  game.running = true;
  game.lastSpawn = 0;
  game.spawnInterval = 2.5;
  game.totalGhosts = 0;
  
  player.pos.set(0, 1.7, 9.5);
  player.yaw = 0;
  player.pitch = 0;
  
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  renderer.domElement.requestPointerLock();
  
  updateHUD();
}

function endGame() {
  game.running = false;
  document.getElementById('hud').style.display = 'none';
  const ov = document.getElementById('overlay');
  ov.style.display = 'flex';
  ov.innerHTML = `
    <h1>👻 ИГРА ОКОНЧЕНА</h1>
    <div class="final-score">${game.score} очков</div>
    <div style="color:#888;font-size:16px;">Привидений поймано: ${game.totalGhosts}</div>
    <div class="start" id="restartBtn">▶ НАЖМИТЕ ПРОБЕЛ</div>
  `;
  if (document.pointerLockElement) document.exitPointerLock();
}

function showMsg(text, dur) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.style.opacity = 1;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.opacity = 0, (dur||1)*1000);
}

function updateHUD() {
  document.getElementById('score').textContent = `👻 ${game.score}`;
  document.getElementById('timer').textContent = `⏱ ${Math.ceil(game.timeLeft)}`;
}

// ============================================================
// TRAP UI
// ============================================================
(function buildTrapUI() {
  const c = document.getElementById('traps');
  const names = ['Огонь', 'Природа', 'Вода'];
  const colors = ['#ff4444', '#44ff44', '#4488ff'];
  for (let i = 0; i < 3; i++) {
    const b = document.createElement('div');
    b.className = 'trap-btn' + (i === 0 ? ' active' : '');
    b.style.cssText = `border-color:${colors[i]};color:${colors[i]}`;
    b.textContent = i + 1;
    b.dataset.idx = i;
    b.addEventListener('click', () => selectTrap(i));
    c.appendChild(b);
  }
})();

function selectTrap(idx) {
  currentTrap = idx;
  document.querySelectorAll('.trap-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });
}

// ============================================================
// SPAWNER
// ============================================================
function spawnGhosts(time) {
  if (!game.running) return;
  if (ghosts.filter(g => !g.caught).length >= 6) return;
  if (time - game.lastSpawn < game.spawnInterval) return;
  
  game.lastSpawn = time;
  const type = Math.floor(Math.random() * 3);
  createGhost(type);
}

// ============================================================
// EVENTS
// ============================================================
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    const ov = document.getElementById('overlay');
    if (ov.style.display !== 'none' || !game.running) {
      startGame();
    }
  }
  if (e.code >= 'Digit1' && e.code <= 'Digit3') {
    selectTrap(parseInt(e.code[5]) - 1);
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

renderer.domElement.addEventListener('click', () => {
  if (!game.running) return;
  tryPlaceTrap();
});

renderer.domElement.addEventListener('pointerlockchange', () => {});

// Prevent context menu
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

// Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
// GAME LOOP
// ============================================================
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;
  
  movePlayer(dt);
  checkStairs(dt);
  
  if (game.running) {
    game.timeLeft -= dt;
    if (game.timeLeft <= 0) {
      game.timeLeft = 0;
      endGame();
    }
    updateHUD();
    updateGhosts(dt, time);
    updateTraps(dt);
    spawnGhosts(time);
    
    // Increase spawn rate over time
    if (game.timeLeft < 30) game.spawnInterval = 1.5;
    else if (game.timeLeft < 45) game.spawnInterval = 2.0;
  }
  
  renderer.render(scene, camera);
}

animate();

// Initial overlay state
document.getElementById('overlay').style.display = 'flex';
document.getElementById('hud').style.display = 'none';
console.log('👻 Охотники за привидениями — игра загружена!');
</script>
</body>
</html>
