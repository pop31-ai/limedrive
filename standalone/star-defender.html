<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Defender</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', monospace;
}
canvas { border: 1px solid #1a1a2e; display: block; }
#ui {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: #0ff;
  font-size: 14px;
  text-align: center;
  pointer-events: none;
  text-shadow: 0 0 10px #0ff;
}
</style>
</head>
<body>
<div id="ui"></div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');

canvas.width = 600;
canvas.height = 800;

const W = canvas.width;
const H = canvas.height;

let state = 'menu';
let score = 0;
let highScore = parseInt(localStorage.getItem('starDefenderHigh')) || 0;
let wave = 1;
let waveTimer = 0;
let shakeTimer = 0;
let particles = [];
let bullets = [];
let enemies = [];
let powerups = [];
let stars = [];

const keys = {};
document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.code] = false; });

for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    s: Math.random() * 2 + 0.5,
    sp: Math.random() * 3 + 1,
    b: Math.random()
  });
}

const player = {
  x: W / 2, y: H - 100, w: 40, h: 40,
  hp: 5, maxHp: 5, lives: 3,
  speed: 5, shootCd: 0, shootRate: 10,
  invincible: 0, power: 1, powerTimer: 0,
  flameAnim: 0
};

function spawnEnemy(type) {
  const e = {
    x: Math.random() * (W - 60) + 30,
    y: -40,
    type: type || 'basic',
    w: 30, h: 30,
    hp: 1, maxHp: 1,
    speed: 2, shootCd: 0, shootRate: 120,
    angle: 0, pattern: 0
  };
  switch (e.type) {
    case 'basic':
      e.hp = 1; e.maxHp = 1; e.speed = 1.5 + wave * 0.1;
      e.color = '#f00'; break;
    case 'fast':
      e.hp = 1; e.maxHp = 1; e.speed = 3 + wave * 0.15;
      e.w = 20; e.h = 20; e.color = '#ff0'; break;
    case 'tank':
      e.hp = 4 + wave; e.maxHp = e.hp; e.speed = 0.8;
      e.w = 45; e.h = 45; e.color = '#f0f'; break;
    case 'shooter':
      e.hp = 2; e.maxHp = 2; e.speed = 1;
      e.shootRate = 80; e.color = '#0f0'; break;
    case 'boss':
      e.hp = 30 + wave * 10; e.maxHp = e.hp;
      e.speed = 0.5; e.w = 80; e.h = 80;
      e.color = '#f80'; e.pattern = 0;
      e.shootRate = 30; break;
  }
  enemies.push(e);
}

function spawnWaveEnemies() {
  if (wave % 5 === 0) {
    spawnEnemy('boss');
    return;
  }
  const count = 5 + wave * 2;
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const r = Math.random();
      if (r < 0.5) spawnEnemy('basic');
      else if (r < 0.75) spawnEnemy('fast');
      else if (r < 0.9) spawnEnemy('tank');
      else spawnEnemy('shooter');
    }, i * 400);
  }
}

function spawnParticle(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * speed + 1;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 30 + Math.random() * 30,
      maxLife: 60,
      color,
      size: Math.random() * 3 + 1
    });
  }
}

function spawnExplosion(x, y, size) {
  const colors = ['#f00', '#ff0', '#f80', '#fff'];
  for (let i = 0; i < size; i++) {
    spawnParticle(x, y, colors[Math.floor(Math.random() * colors.length)], 1, size / 5);
  }
}

function firePlayerBullet() {
  if (player.power >= 3) {
    for (let i = -2; i <= 2; i++) {
      bullets.push({ x: player.x + i * 8, y: player.y - 20, vx: i * 0.5, vy: -8, dmg: 1, color: '#0ff', size: 3, enemy: false });
    }
  } else if (player.power >= 2) {
    bullets.push({ x: player.x - 8, y: player.y - 15, vx: 0, vy: -8, dmg: 1, color: '#0ff', size: 3, enemy: false });
    bullets.push({ x: player.x + 8, y: player.y - 15, vx: 0, vy: -8, dmg: 1, color: '#0ff', size: 3, enemy: false });
  } else {
    bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: -8, dmg: 1, color: '#0ff', size: 3, enemy: false });
  }
}

function fireEnemyBullet(e) {
  const angle = Math.atan2(player.y - e.y, player.x - e.x);
  const sp = 3 + wave * 0.2;
  if (e.type === 'boss') {
    e.pattern = (e.pattern + 1) % 3;
    if (e.pattern === 0) {
      for (let i = 0; i < 12; i++) {
        const a = (Math.PI * 2 / 12) * i;
        bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dmg: 1, color: '#f80', size: 4, enemy: true });
      }
    } else if (e.pattern === 1) {
      bullets.push({ x: e.x, y: e.y + e.h/2, vx: Math.cos(angle) * sp * 1.5, vy: Math.sin(angle) * sp * 1.5, dmg: 1, color: '#f80', size: 4, enemy: true });
    } else {
      for (let i = -2; i <= 2; i++) {
        bullets.push({ x: e.x + i * 15, y: e.y + e.h/2, vx: Math.cos(angle + i * 0.2) * sp, vy: Math.sin(angle + i * 0.2) * sp, dmg: 1, color: '#f80', size: 3, enemy: true });
      }
    }
  } else {
    bullets.push({ x: e.x, y: e.y + e.h/2, vx: Math.cos(angle) * sp, vy: Math.sin(angle) * sp, dmg: 1, color: '#0f0', size: 3, enemy: true });
  }
}

function collides(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 &&
         Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}

function takeDamage(dmg) {
  if (player.invincible > 0) return;
  player.hp -= dmg;
  shakeTimer = 10;
  spawnPlayerExplosion();
  if (player.hp <= 0) {
    player.lives--;
    if (player.lives <= 0) {
      state = 'gameover';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('starDefenderHigh', highScore);
      }
    } else {
      player.hp = player.maxHp;
      player.invincible = 120;
      player.x = W / 2;
      player.y = H - 100;
    }
  }
}

function spawnPlayerExplosion() {
  spawnParticle(player.x, player.y, '#0ff', 15, 4);
  spawnParticle(player.x, player.y, '#fff', 8, 3);
}

function update() {
  if (state !== 'play') return;

  player.flameAnim += 0.3;

  if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
  player.x = Math.max(20, Math.min(W - 20, player.x));
  player.y = Math.max(20, Math.min(H - 20, player.y));

  if (keys['Space']) {
    player.shootCd--;
    if (player.shootCd <= 0) {
      firePlayerBullet();
      player.shootCd = player.shootRate;
    }
  } else {
    player.shootCd = 0;
  }

  if (player.invincible > 0) player.invincible--;
  if (player.powerTimer > 0) {
    player.powerTimer--;
    if (player.powerTimer <= 0) player.power = 1;
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    if (b.y < -10 || b.y > H + 10 || b.x < -10 || b.x > W + 10) {
      bullets.splice(i, 1);
      continue;
    }
    if (!b.enemy) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (Math.abs(b.x - e.x) < e.w/2 && Math.abs(b.y - e.y) < e.h/2) {
          e.hp -= b.dmg;
          spawnParticle(b.x, b.y, '#0ff', 3, 2);
          bullets.splice(i, 1);
          if (e.hp <= 0) {
            let pts = e.type === 'boss' ? 500 : e.type === 'tank' ? 100 : e.type === 'shooter' ? 75 : 25;
            score += pts * wave;
            spawnExplosion(e.x, e.y, e.type === 'boss' ? 50 : 20);
            if (Math.random() < 0.15) {
              const types = ['power', 'heal', 'life'];
              powerups.push({
                x: e.x, y: e.y, type: types[Math.floor(Math.random() * types.length)],
                w: 20, h: 20, vy: 1.5, life: 600
              });
            }
            enemies.splice(j, 1);
          }
          break;
        }
      }
    } else {
      if (Math.abs(b.x - player.x) < (player.w + b.size) / 2 &&
          Math.abs(b.y - player.y) < (player.h + b.size) / 2) {
        takeDamage(b.dmg);
        spawnParticle(b.x, b.y, '#f00', 5, 2);
        bullets.splice(i, 1);
      }
    }
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;
    e.angle += 0.05;
    e.shootCd--;
    if (e.shootCd <= 0 && e.y > 0 && e.y < H - 100) {
      fireEnemyBullet(e);
      e.shootCd = e.shootRate;
    }
    if (e.y > H + 60) {
      enemies.splice(i, 1);
      continue;
    }
    if (e.type !== 'boss' && collides(player, e)) {
      takeDamage(1);
      spawnExplosion(e.x, e.y, 15);
      enemies.splice(i, 1);
    }
    if (e.type === 'boss') {
      if (e.y > 100) e.y = 100 + Math.sin(e.angle) * 30;
      e.x += Math.sin(e.angle * 0.5) * 2;
      e.x = Math.max(e.w/2, Math.min(W - e.w/2, e.x));
      if (collides(player, e)) takeDamage(2);
    }
  }

  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy;
    p.life--;
    if (p.life <= 0 || p.y > H + 30) { powerups.splice(i, 1); continue; }
    if (Math.abs(p.x - player.x) < 25 && Math.abs(p.y - player.y) < 25) {
      if (p.type === 'power' && player.power < 3) player.power++;
      if (p.type === 'heal') player.hp = Math.min(player.maxHp, player.hp + 2);
      if (p.type === 'life') player.lives++;
      player.powerTimer = p.type === 'power' ? 600 : 0;
      spawnParticle(p.x, p.y, '#ff0', 10, 3);
      powerups.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (enemies.length === 0) {
    waveTimer++;
    if (waveTimer > 90) {
      wave++;
      waveTimer = 0;
      spawnWaveEnemies();
    }
  }

  if (shakeTimer > 0) shakeTimer--;

  for (const s of stars) {
    s.y += s.sp;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

function draw() {
  ctx.save();
  if (shakeTimer > 0) {
    ctx.translate(
      (Math.random() - 0.5) * shakeTimer * 1.5,
      (Math.random() - 0.5) * shakeTimer * 1.5
    );
  }

  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    ctx.globalAlpha = 0.3 + s.b * 0.7;
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  for (const b of bullets) {
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);

    if (e.type === 'boss') {
      ctx.fillStyle = e.color;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = (Math.PI * 2 / 8) * i + e.angle;
        const r = i % 2 === 0 ? e.w / 2 : e.w / 3;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f00';
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      const hpPct = e.hp / e.maxHp;
      ctx.fillStyle = '#300';
      ctx.fillRect(-e.w/2, -e.h/2 - 12, e.w, 6);
      ctx.fillStyle = hpPct > 0.5 ? '#0f0' : hpPct > 0.25 ? '#ff0' : '#f00';
      ctx.fillRect(-e.w/2, -e.h/2 - 12, e.w * hpPct, 6);
    } else {
      ctx.fillStyle = e.color;
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 8;

      if (e.type === 'fast') {
        ctx.beginPath();
        ctx.moveTo(0, -e.h/2);
        ctx.lineTo(e.w/2, e.h/2);
        ctx.lineTo(-e.w/2, e.h/2);
        ctx.closePath();
        ctx.fill();
      } else if (e.type === 'tank') {
        ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h);
        ctx.fillStyle = '#000';
        ctx.fillRect(-e.w/4, -e.h/4, e.w/2, e.h/2);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, e.w/2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      if (e.maxHp > 1) {
        const hpPct = e.hp / e.maxHp;
        ctx.fillStyle = '#300';
        ctx.fillRect(-e.w/2, -e.h/2 - 8, e.w, 4);
        ctx.fillStyle = hpPct > 0.5 ? '#0f0' : '#f00';
        ctx.fillRect(-e.w/2, -e.h/2 - 8, e.w * hpPct, 4);
      }
    }
    ctx.restore();
  }

  for (const p of powerups) {
    ctx.save();
    ctx.translate(p.x, p.y);
    const glow = 5 + Math.sin(Date.now() / 200) * 3;
    ctx.shadowBlur = glow;
    if (p.type === 'power') {
      ctx.fillStyle = '#f0f';
      ctx.shadowColor = '#f0f';
      ctx.beginPath();
      ctx.moveTo(0, -12);
      ctx.lineTo(4, -2);
      ctx.lineTo(10, -2);
      ctx.lineTo(5, 4);
      ctx.lineTo(7, 12);
      ctx.lineTo(0, 7);
      ctx.lineTo(-7, 12);
      ctx.lineTo(-5, 4);
      ctx.lineTo(-10, -2);
      ctx.lineTo(-4, -2);
      ctx.closePath();
      ctx.fill();
    } else if (p.type === 'heal') {
      ctx.fillStyle = '#0f0';
      ctx.shadowColor = '#0f0';
      ctx.fillRect(-2, -8, 4, 16);
      ctx.fillRect(-8, -2, 16, 4);
    } else {
      ctx.fillStyle = '#ff0';
      ctx.shadowColor = '#ff0';
      ctx.font = '20px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('1', 0, 7);
    }
    ctx.restore();
  }

  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  if (state === 'play' || state === 'gameover') {
    ctx.save();
    ctx.translate(player.x, player.y);

    const flameH = 8 + Math.sin(player.flameAnim) * 4;
    ctx.fillStyle = '#08f';
    ctx.beginPath();
    ctx.moveTo(-10, 15);
    ctx.lineTo(0, 15 + flameH);
    ctx.lineTo(10, 15);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#0ff';
    ctx.beginPath();
    ctx.moveTo(-5, 15);
    ctx.lineTo(0, 15 + flameH * 0.6);
    ctx.lineTo(5, 15);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = player.invincible > 0 && Math.floor(player.invincible / 3) % 2 ? '#444' : '#ccc';
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(-15, 15);
    ctx.lineTo(-8, 10);
    ctx.lineTo(0, 18);
    ctx.lineTo(8, 10);
    ctx.lineTo(15, 15);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    if (player.power >= 2) {
      ctx.fillStyle = '#f0f';
      ctx.beginPath();
      ctx.arc(-12, 5, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(12, 5, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  ctx.restore();

  if (state === 'play') {
    ctx.fillStyle = '#0ff';
    ctx.shadowColor = '#0ff';
    ctx.shadowBlur = 5;
    ctx.font = '16px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 15, 30);
    ctx.textAlign = 'right';
    ctx.fillText(`WAVE: ${wave}`, W - 15, 30);

    ctx.textAlign = 'left';
    let hpText = '';
    for (let i = 0; i < player.maxHp; i++) hpText += i < player.hp ? '♥' : '♡';
    ctx.fillStyle = '#f44';
    ctx.fillText(hpText, 15, 55);

    let livesText = 'LIVES: ';
    for (let i = 0; i < player.lives; i++) livesText += '▲ ';
    ctx.fillStyle = '#0f0';
    ctx.fillText(livesText, 15, 75);

    if (player.power > 1) {
      ctx.fillStyle = '#f0f';
      ctx.fillText(`POWER: ${player.power} (${Math.ceil(player.powerTimer/60)}s)`, 15, 95);
    }

    if (enemies.length > 0 && enemies.some(e => e.type === 'boss')) {
      const boss = enemies.find(e => e.type === 'boss');
      const hpPct = boss.hp / boss.maxHp;
      ctx.fillStyle = '#333';
      ctx.fillRect(W/2 - 150, 15, 300, 14);
      ctx.fillStyle = hpPct > 0.5 ? '#f80' : '#f00';
      ctx.fillRect(W/2 - 150, 15, 300 * hpPct, 14);
      ctx.strokeStyle = '#f80';
      ctx.strokeRect(W/2 - 150, 15, 300, 14);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS', W/2, 27);
    }

    ctx.shadowBlur = 0;
  }

  if (state === 'menu') {
    drawMenu();
  } else if (state === 'gameover') {
    drawGameOver();
  }
}

function drawMenu() {
  ctx.fillStyle = 'rgba(5,5,16,0.85)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.shadowColor = '#0ff';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#0ff';
  ctx.font = 'bold 48px monospace';
  ctx.fillText('STAR DEFENDER', W/2, H/3);

  ctx.shadowBlur = 10;
  ctx.font = '16px monospace';
  ctx.fillStyle = '#888';
  ctx.fillText('WASD / Стрелки - движение', W/2, H/3 + 50);
  ctx.fillText('ПРОБЕЛ - стрельба', W/2, H/3 + 75);

  const pulse = 0.7 + Math.sin(Date.now() / 400) * 0.3;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ff0';
  ctx.font = '20px monospace';
  ctx.fillText('[ НАЖМИ ENTER ДЛЯ СТАРТА ]', W/2, H/2 + 30);
  ctx.globalAlpha = 1;

  if (highScore > 0) {
    ctx.fillStyle = '#f80';
    ctx.font = '16px monospace';
    ctx.fillText(`РЕКОРД: ${highScore}`, W/2, H/2 + 80);
  }

  ctx.shadowBlur = 0;
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(5,5,16,0.85)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.shadowColor = '#f00';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#f00';
  ctx.font = 'bold 48px monospace';
  ctx.fillText('GAME OVER', W/2, H/3);

  ctx.shadowBlur = 10;
  ctx.fillStyle = '#fff';
  ctx.font = '20px monospace';
  ctx.fillText(`SCORE: ${score}`, W/2, H/3 + 50);
  ctx.fillText(`WAVE: ${wave}`, W/2, H/3 + 80);

  if (score >= highScore && score > 0) {
    ctx.fillStyle = '#ff0';
    ctx.font = '18px monospace';
    ctx.fillText('НОВЫЙ РЕКОРД!', W/2, H/3 + 115);
  }

  const pulse = 0.7 + Math.sin(Date.now() / 400) * 0.3;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#0ff';
  ctx.font = '18px monospace';
  ctx.fillText('[ ENTER - ЗАНОВО ]', W/2, H/2 + 50);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

function resetGame() {
  score = 0;
  wave = 1;
  waveTimer = 0;
  bullets = [];
  enemies = [];
  powerups = [];
  particles = [];
  player.x = W / 2;
  player.y = H - 100;
  player.hp = player.maxHp;
  player.lives = 3;
  player.power = 1;
  player.powerTimer = 0;
  player.invincible = 120;
  spawnWaveEnemies();
}

document.addEventListener('keydown', e => {
  if (e.code === 'Enter') {
    if (state === 'menu' || state === 'gameover') {
      resetGame();
      state = 'play';
    }
  }
});

let lastTime = 0;
function loop(time) {
  const dt = time - lastTime;
  if (dt >= 16) {
    lastTime = time;
    update();
    draw();
  }
  requestAnimationFrame(loop);
}

state = 'menu';
requestAnimationFrame(loop);
</script>
</body>
</html>
