<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Баскетбол</title>
<style>
  body{margin:0;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;color:#eee;font-family:Arial}
  canvas{background:#0f3460;border:2px solid #333;cursor:crosshair}
  #ui{display:flex;gap:40px;padding:10px;font-size:18px;align-items:center}
  #ui span b{color:#f2c94c}
  #assist{border:2px solid #f2c94c;background:none;color:#f2c94c;padding:4px 14px;font-size:15px;border-radius:8px;cursor:pointer}
  #assist.on{background:#f2c94c;color:#1a1a2e}
</style>
</head>
<body>
<div id="ui">
  <span>Уровень: <b id="lvl">1</b></span>
  <span>Счёт: <b id="score">0</b></span>
  <span>Рекорд: <b id="best">0</b></span>
  <span>Время: <b id="time">30.0</b></span>
  <button id="assist" type="button">Траектория: вкл</button>
</div>
<canvas id="c" width="900" height="600"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
let score = 0, best = +localStorage.getItem('bs') || 0, level = 1;
let timeLeft = 30, last = performance.now();
let particles = [], floaters = [], banner = '', bannerT = 0;

const ball = { x: 140, y: 470, r: 17, vx: 0, vy: 0, flying: false, rimCd: 0, rimBounces: 0 };
const GRAV = 0.25;
const hoop = { x: 780, baseY: 110 };
let aim = { x: ball.x, y: ball.y };
let assist = true;

function hoopR(){ return Math.max(28, 45 - (level - 1) * 3); }
function hoopAmp(){ return Math.min(70, (level - 1) * 7); }
function hoopSpeed(){ return 0.0012 + (level - 1) * 0.0007; }
function hoopY(){ return hoop.baseY + Math.sin(performance.now() * hoopSpeed()) * hoopAmp(); }

let ac = null;
function ensure(){ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); }
function tone(f, d, type, g, when){
  if (!ac) return;
  const o = ac.createOscillator(), ga = ac.createGain(), t0 = ac.currentTime + (when || 0);
  o.type = type || 'sine'; o.frequency.value = f;
  ga.gain.value = g || 0.12;
  o.connect(ga); ga.connect(ac.destination);
  o.start(t0); ga.gain.exponentialRampToValueAtTime(0.001, t0 + d); o.stop(t0 + d);
}
const sndToss = () => tone(320, .08);
const sndScore = () => { tone(880, .12, 'sine', .14); tone(1320, .18, 'sine', .12, .08); };
const sndMiss = () => tone(110, .2, 'triangle', .16);
const sndLevel = () => { tone(523, .12); tone(659, .12, 'sine', .12, .1); tone(784, .18, 'sine', .12, .2); };

function resetBall(){
  ball.x = 140; ball.y = 470; ball.vx = 0; ball.vy = 0; ball.flying = false;
  ball.rimCd = 0; ball.rimBounces = 0;
}
function resetGame(){
  score = 0; level = 1; timeLeft = 30; resetBall(); banner = 'УРОВЕНЬ 1'; bannerT = 1.4;
}

function drawAim(){
  if (ball.flying || assist) return;
  const tx = aim.x, ty = aim.y;
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = 'rgba(255,255,255,.6)';
  ctx.beginPath(); ctx.moveTo(ball.x, ball.y);
  ctx.quadraticCurveTo(ball.x + (tx - ball.x) / 2, ball.y - 130, tx, ty);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.arc(tx, ty, 8, 0, 7); ctx.fill();
}

function getShot(){
  const dy = ball.y - aim.y;
  const t = Math.abs(dy) > 1 ? Math.sqrt(2 * dy / GRAV) : 1;
  return { vx: (aim.x - ball.x) / t, vy: -Math.sqrt(2 * GRAV * dy), t };
}

function shoot(){
  if (ball.flying) return;
  ensure();
  const s = getShot();
  ball.vx = s.vx; ball.vy = s.vy;
  ball.flying = true;
  sndToss();
}

function simulateTrajectory(){
  const s = getShot();
  const b = { x: ball.x, y: ball.y, r: ball.r, vx: s.vx, vy: s.vy, rimCd: 0, rimBounces: 0 };
  let simMs = 0;
  const dots = [], mark = [];
  for (let i = 0; i < 400; i++){
    simMs += 16.67;
    const hy = hoop.baseY + Math.sin((performance.now() + simMs) * hoopSpeed()) * hoopAmp();
    const ev = stepBall(b, 1 / 60, hy);
    if (i % 2 === 0) dots.push({ x: b.x, y: b.y });
    if (ev.scored){ mark.push({ x: b.x, y: hy, hit: true }); break; }
    if (b.y > H){ mark.push({ x: b.x, y: H, hit: false }); break; }
  }
  if (!mark.length) mark.push({ x: b.x, y: H, hit: false });
  return { dots, mark };
}

function drawAssist(){
  if (ball.flying || !assist) return;
  const traj = simulateTrajectory();
  const n = traj.dots.length;
  for (let i = 0; i < n; i += 2){
    ctx.globalAlpha = 0.15 + 0.55 * i / n;
    ctx.fillStyle = '#7dd3fc';
    ctx.beginPath(); ctx.arc(traj.dots[i].x, traj.dots[i].y, 3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (traj.mark.length){
    const m = traj.mark[0];
    const hy = hoopY();
    if (m.hit){
      const inner = Math.max(6, hoopR() - ball.r);
      ctx.beginPath(); ctx.arc(hoop.x, hy, inner, 0, 7);
      ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 4;
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(m.x, m.y, 7, 0, 7);
    ctx.strokeStyle = m.hit ? '#4ade80' : '#f87171'; ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x, m.y, 2, 0, 7); ctx.fillStyle = m.hit ? '#4ade80' : '#f87171'; ctx.fill();
    ctx.font = '12px Arial'; ctx.textAlign = 'center';
    ctx.fillText(m.hit ? 'ПОПАДАНИЕ' : 'МИМО', m.x, m.y + 26);
  }
}

function sparks(x, y, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, c: ['#f2c94c', '#fff', '#ff6b35'][i % 3] });
  }
}

function stepBall(b, dt, hy){
  const step = dt * 60;
  b.vy += GRAV * step;
  const prevY = b.y;
  b.x += b.vx * step;
  b.y += b.vy * step;
  const r = hoopR();
  const dx = b.x - hoop.x, dy = b.y - hy;
  const dist = Math.hypot(dx, dy);
  const inner = Math.max(6, r - b.r);
  if (b.vy > 0 && prevY < hy && b.y >= hy && b.x > hoop.x - inner && b.x < hoop.x + inner){
    return { scored: true };
  }
  if (dist < r + b.r && dist > r - b.r && dist > 0 && b.rimCd <= 0 && b.rimBounces < 6
      && !(b.vy > 0 && b.y < hy && Math.abs(b.x - hoop.x) < inner)){
    const nx = dx / dist, ny = dy / dist;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0){
      const e = 0.55;
      b.vx -= (1 + e) * vn * nx;
      b.vy -= (1 + e) * vn * ny;
      b.vx *= 0.96;
      b.x += nx * (r + b.r - dist + 1);
      b.y += ny * (r + b.r - dist + 1);
      b.rimCd = 0.05; b.rimBounces++;
      return { bounced: true };
    }
  }
  b.rimCd -= dt;
  return {};
}

function update(){
  const now = performance.now(), dt = (now - last) / 1000; last = now;
  if (ball.flying){
    const ev = stepBall(ball, dt, hoopY());
    if (ev.scored){
      const hy = hoopY();
      score++; best = Math.max(best, score); localStorage.setItem('bs', best);
      sparks(ball.x, hy + 10, 26);
      floaters.push({ x: ball.x, y: hy - 20, vy: -1.2, life: 1.2 });
      ball.flying = false; sndScore();
    } else if (ev.bounced){
      tone(200, .06, 'square', .08);
    }
    if (ball.x < -50) ball.x = W - 20;
    if (ball.x > W + 50) ball.x = 20;
    if (ball.y - ball.r > H){
      sndMiss(); sparks(ball.x, H - 5, 10); resetBall();
    }
  }
  timeLeft -= dt;
  if (timeLeft <= 0){
    level++; timeLeft = 30; score = 0;
    banner = 'УРОВЕНЬ ' + level; bannerT = 1.6;
    resetBall(); sndLevel();
  }
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.vy += 0.12; p.x += p.vx; p.y += p.vy; p.life -= 0.025;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--){
    const f = floaters[i];
    f.y += f.vy; f.life -= 0.02;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  if (bannerT > 0) bannerT -= dt;
}

function drawBack(){
  ctx.clearRect(0, 0, W, H);
  const hy = hoopY(), r = hoopR();
  ctx.fillStyle = 'rgba(255,255,255,.15)';
  ctx.fillRect(hoop.x - 75, 20, 150, Math.max(0, hy - 20));
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.strokeRect(hoop.x - 75, 20, 150, Math.max(0, hy - 20));
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(hoop.x - 40, hy); ctx.lineTo(hoop.x - 40, H); ctx.stroke();
  const NSTR = 9, DEP = 58, SHR = 0.42;
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.4;
  for (let k = 0; k < NSTR; k++){
    const a = k / (NSTR - 1) * Math.PI;
    const sx = hoop.x + r * Math.cos(a), sy = hy + r * Math.sin(a);
    const ex = hoop.x + SHR * r * Math.cos(a), ey = hy + DEP;
    const cx = hoop.x + 0.85 * r * Math.cos(a), cy = hy + DEP * 0.45;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, ex, ey); ctx.stroke();
  }
  for (const f of [0.38, 0.72]){
    const rx = r * (1 - (1 - SHR) * f), y = hy + DEP * f;
    ctx.beginPath();
    for (let k = 0; k < NSTR; k++){
      const a = k / (NSTR - 1) * Math.PI;
      const x = hoop.x + rx * Math.cos(a);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.beginPath(); ctx.ellipse(hoop.x, hy + DEP, SHR * r, 7, 0, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(hoop.x, hy, r, 0, Math.PI, true); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.3)';
  ctx.beginPath(); ctx.moveTo(0, 500); ctx.lineTo(W, 500); ctx.stroke();
}

function drawFrontRim(){
  const hy = hoopY(), r = hoopR();
  ctx.strokeStyle = '#ff6b35'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(hoop.x, hy, r, 0, Math.PI, false); ctx.stroke();
}

function drawZone(){
  const hy = hoopY(), inner = Math.max(6, hoopR() - ball.r);
  const pulse = 0.12 + 0.08 * Math.sin(performance.now() / 300);
  ctx.beginPath(); ctx.arc(hoop.x, hy, inner, 0, 7);
  ctx.fillStyle = 'rgba(74,222,128,' + pulse + ')';
  ctx.fill();
  ctx.strokeStyle = 'rgba(74,222,128,.9)'; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(74,222,128,.55)';
  ctx.beginPath(); ctx.moveTo(hoop.x - inner, hy); ctx.lineTo(hoop.x + inner, hy);
  ctx.moveTo(hoop.x, hy - inner); ctx.lineTo(hoop.x, hy + inner);
  ctx.stroke();
}

function drawBall(){
  const g = ctx.createRadialGradient(ball.x - 6, ball.y - 8, 3, ball.x, ball.y, ball.r);
  g.addColorStop(0, '#fff'); g.addColorStop(.4, '#ff8c42'); g.addColorStop(1, '#c44');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#7a2'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(ball.x - ball.r, ball.y); ctx.lineTo(ball.x + ball.r, ball.y); ctx.stroke();
}

function drawFx(){
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#f2c94c'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center';
  for (const f of floaters){
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillText('+1', f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawTimer(){
  const w = 260, x = W - w - 20, y = 18, frac = Math.max(0, timeLeft / 30);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x, y, w, 10);
  ctx.fillStyle = frac > 0.3 ? '#4ade80' : '#f87171';
  ctx.fillRect(x, y, w * frac, 10);
}

function drawBanner(){
  if (bannerT <= 0) return;
  ctx.globalAlpha = Math.min(1, bannerT);
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(0, H / 2 - 45, W, 90);
  ctx.fillStyle = '#f2c94c'; ctx.font = 'bold 42px Arial'; ctx.textAlign = 'center';
  ctx.fillText(banner, W / 2, H / 2 + 14);
  ctx.globalAlpha = 1;
}

function loop(){
  update();
  drawBack();
  drawZone();
  drawBall();
  drawFrontRim();
  drawAim();
  drawAssist();
  drawFx();
  drawTimer();
  drawBanner();
  document.getElementById('lvl').textContent = level;
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('time').textContent = Math.max(0, timeLeft).toFixed(1);
  requestAnimationFrame(loop);
}

cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  aim.x = (e.clientX - r.left) * W / r.width;
  aim.y = Math.min((e.clientY - r.top) * H / r.height, 470);
});
cv.addEventListener('click', shoot);
window.addEventListener('keydown', e => {
  if (e.code === 'Space') resetBall();
  if (e.code === 'KeyR') resetGame();
  if (e.code === 'KeyH'){
    assist = !assist;
    document.getElementById('assist').textContent = 'Траектория: ' + (assist ? 'вкл' : 'выкл');
    document.getElementById('assist').classList.toggle('on', assist);
  }
});

const assistBtn = document.getElementById('assist');
assistBtn.addEventListener('click', () => {
  assist = !assist;
  assistBtn.textContent = 'Траектория: ' + (assist ? 'вкл' : 'выкл');
  assistBtn.classList.toggle('on', assist);
});
assistBtn.classList.add('on');

resetGame();
loop();
</script>
</body>
</html>
