// === Утилиты отрисовки ===
function setFill(c){ctx.fillStyle=c}
function setStroke(c){ctx.strokeStyle=c}
function setLineW(w){ctx.lineWidth=w}
function setFont(sz){ctx.font=sz+'px Courier New'}
function setTextAlign(a){ctx.textAlign=a}
function fillText(t,px,py){ctx.fillText(t,px,py)}
function strokeLine(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function fillRect(px,py,w,h){ctx.fillRect(px,py,w,h)}
function strokeRect(px,py,w,h){ctx.strokeRect(px,py,w,h)}
function arcPath(cx,cy,r){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2)}
function ellipsePath(cx,cy,rx,ry){ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2)}

function drawLabel(lx,ly,text,color){
  if(!labelsOn)return;
  let dir=lx>W/2?1:-1;
  let endX=lx+dir*25;
  let endY=ly-18;
  setStroke(color+'88');
  setLineW(0.5);
  strokeLine(lx,ly,endX,endY);
  setFont(8);
  let tw=ctx.measureText(text).width;
  let bx=endX+(dir>0?2:-tw-2);
  let by=endY-10;
  fillRect(bx-3,by-2,tw+6,14);
  setFill(color);
  setTextAlign(dir>0?'left':'right');
  fillText(text,bx+(dir>0?0:tw),by+9);
  setTextAlign('left');
}

function drawLabelsFor(zone){
  if(!labelsOn)return;
  DL.filter(d=>d.z===zone).forEach(d=>drawLabel(d.x,d.y,d.t,d.c));
}

// === КАБИНА ПИЛОТОВ ===
function drawCockpit(){
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#181838');g.addColorStop(0.35,'#2a2a5a');g.addColorStop(0.52,'#6a5a3a');g.addColorStop(1,'#0a0a18');
  setFill(g);fillRect(0,0,W,H);

  // Каркас лобовых стёкол
  setStroke('#555');setLineW(5);
  ctx.beginPath();
  ctx.moveTo(120,55);ctx.lineTo(370,35);ctx.lineTo(490,35);ctx.lineTo(W-120,55);
  ctx.lineTo(W-70,190);ctx.lineTo(W-70,H-160);ctx.lineTo(70,H-160);ctx.lineTo(70,190);
  ctx.closePath();ctx.stroke();
  setStroke('#444');setLineW(4);
  strokeLine(370,35,350,H-160);strokeLine(490,35,510,H-160);

  // Вид через стёкла — небо и земля
  ctx.save();
  ctx.beginPath();
  ctx.rect(122,57,246,H-220);ctx.rect(372,37,116,H-198);ctx.rect(512,57,W-184,H-220);
  ctx.clip();
  let hg=ctx.createLinearGradient(0,180,0,420);
  hg.addColorStop(0,'#2255aa');hg.addColorStop(0.45,'#4488cc');
  hg.addColorStop(0.5,'#88aa55');hg.addColorStop(0.55,'#668844');hg.addColorStop(1,'#2a3a1a');
  setFill(hg);fillRect(120,35,W-240,H-195);
  setFill('rgba(200,210,230,0.25)');
  for(let i=0;i<6;i++){
    let cx2=170+i*120+Math.sin(af*0.008+i)*15;
    let cy2=230+Math.sin(i*2)*25;
    ellipsePath(cx2,cy2,55,12);ctx.fill();
  }
  ctx.restore();

  // --- PFD (Primary Flight Display) ---
  setFill('#000');fillRect(95,200,210,280);
  setStroke('#0aa');setLineW(1);strokeRect(95,200,210,280);
  let pcx=200,pcy=340;
  ctx.save();ctx.beginPath();ctx.rect(96,201,208,278);ctx.clip();
  setFill('#1a3a7a');fillRect(96,pcy-80,208,80);
  setFill('#5a3a1a');fillRect(96,pcy,208,100);
  setStroke('#fff');setLineW(2);strokeLine(96,pcy,304,pcy);
  setLineW(1);setFont(7);setFill('#fff');setTextAlign('right');
  for(let p=-20;p<=20;p+=10){
    if(!p)continue;
    let py2=pcy-p*2;let lw=p%20===0?28:14;
    strokeLine(pcx-lw,py2,pcx+lw,py2);
    fillText(p+'°',302,py2+3);
  }
  setStroke('#ff0');setLineW(2);
  strokeLine(pcx-28,pcy,pcx-6,pcy);strokeLine(pcx+6,pcy,pcx+28,pcy);
  strokeLine(pcx-6,pcy,pcx-6,pcy+8);strokeLine(pcx+6,pcy,pcx+6,pcy+8);
  ctx.restore();
  // Speed tape
  setFill('#111');fillRect(96,201,35,278);
  setFill('#0f0');setFont(8);setTextAlign('right');
  for(let s=230;s<=270;s+=5){

function drawCabin(loc2){
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b0b1a');g.addColorStop(1,'#050510');
  setFill(g);fillRect(0,0,W,H);
  let vx=430,vy=100;

  // Потолок перспективный
  setFill('#18182a');
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W-50,vy);ctx.lineTo(50,vy);ctx.closePath();ctx.fill();
  // Пол
  setFill('#141220');
  ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(W,H);ctx.lineTo(W-50,vy+210);ctx.lineTo(50,vy+210);ctx.closePath();ctx.fill();
  // Левая стена
  setFill('#12121e');
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(50,vy);ctx.lineTo(50,vy+210);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  // Правая стена
  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(W-50,vy);ctx.lineTo(W-50,vy+210);ctx.lineTo(W,H);ctx.closePath();ctx.fill();

  // Багажники
  for(let i=0;i<6;i++){
    let t=i/6,ly=vy+t*190;
    setFill('#1a1a28');
    fillRect(55+t*(vx-80),ly,(vx-120)*t*0.22,14);
    fillRect(W-55-t*(vx-80)-(vx-120)*t*0.22,ly,(vx-120)*t*0.22,14);
  }

  // Окна
  for(let side=0;side<2;side++){
    for(let i=0;i<8;i++){
      let t2=i/8,wy=vy+25+t2*185;
      let wx=side===0?28+t2*(vx-65):W-28-t2*(vx-65);
      setFill(`rgba(80,130,220,${0.12+Math.sin(af*0.012+i)*0.04})`);
      ellipsePath(wx,wy,3+t2*8,8+t2*14);ctx.fill();
    }
  }

  // Кресла (перспектива)
  for(let row=0;row<5;row++){
    let t=row/5,ry=vy+55+t*170,rw=18+t*55;
    let rx1=vx-rw*3.5,rx2=vx+rw*0.5;
    for(let s=0;s<3;s++){
      setFill('#28284a');fillRect(rx1+s*rw*0.88,ry,rw*0.65,18+t*10);
      setStroke('#444');setLineW(0.5);strokeRect(rx1+s*rw*0.88,ry,rw*0.65,18+t*10);
    }
    for(let s=0;s<3;s++){
      setFill('#28284a');fillRect(rx2+s*rw*0.88,ry,rw*0.65,18+t*10);
      setStroke('#444');strokeRect(rx2+s*rw*0.88,ry,rw*0.65,18+t*10);
    }
  }

  // Пассажиры (головы)
  let ld=L[loc2];
  if(ld&&ld.ps){
    ld.ps.forEach((pi,idx)=>{
      let p=P[pi];if(!p)return;
      let row=idx%5,side=idx%2,t=row/5;
      let py=vy+50+t*170,px=side===0?vx-45-row*12:vx+45+row*12;
      setFill('#da8');arcPath(px,py-7,4+t*3);ctx.fill();
      setFill('#fa4');setFont(Math.round(7+t*2)+'');
      setTextAlign('center');fillText(p.name.split(' ')[0],px,py-14-t*3);
      setTextAlign('left');
    });
  }

  // Игрок в проходе
  let py2=vy+145;
  setStroke('#4af');setLineW(2);
  arcPath(vx,py2-38,8);ctx.stroke();
  strokeLine(vx,py2-30,vx,py2);
  strokeLine(vx-13,py2-22,vx+13,py2-22);
  strokeLine(vx,py2,vx-9,py2+14);strokeLine(vx,py2,vx+9,py2+14);
  setFill('#4af');setFont(10);setTextAlign('center');
  fillText('▶ Вы',vx,py2+28);setTextAlign('left');

  drawLabelsFor(loc2);
}

// === RENDER LOOP ===
function render(){
  af++;
  ctx.clearRect(0,0,W,H);
  if(view==='fuselage')drawFuselage();
  else if(loc==='cockpit')drawCockpit();
  else if(loc==='tail')drawTail();
  else drawCabin(loc);
  requestAnimationFrame(render);
}

// === UI ===
function updUI(){
  let l=L[loc];
  document.getElementById('locLabel').textContent='— '+l.name+' —';
  let desc=l.desc;
  if(l.ps){
    desc+='\n\nПоблизости:\n'+l.ps.map(i=>'• '+P[i].name+' ('+P[i].seat+', '+P[i].mood+')').join('\n');
  }
  document.getElementById('sceneDesc').textContent=desc;

  let zoneCount=DL.filter(d=>d.z===loc||(view==='fuselage'&&d.z==='fuselage')).length;
  document.getElementById('counter').textContent='Подписей на экране: '+zoneCount+' / Всего: '+DL.length;

  let ch=document.getElementById('choices');ch.innerHTML='';
  function addBtn(text,fn){
    let b=document.createElement('button');b.className='cb';b.textContent=text;b.onclick=fn;ch.appendChild(b);
  }

  if(view==='fuselage'){
    addBtn('← Назад к месту',()=>{view='walk';updUI();});
    return;
  }

  if(loc==='cockpit'){
    addBtn('🔍 Осмотреть приборы',()=>msg('p','Все показатели в норме. Давление, температура, расход — ОК.'));
    addBtn('📊 Проверить ECAM',()=>msg('c','ECAM: Все системы зелёные. Engine 1/2 — nominal.'));
    addBtn('📻 Настроить радио',()=>{msg('p','*переключает частоту*');setTimeout(()=>msg('c','Радиосвязь: частота 121.5 МГц установлена.'),600);});
    addBtn('🚪 Покинуть кабину →',()=>go('door1'));
    addBtn('📐 Схема фюзеляжа [C]',()=>{view='fuselage';updUI();});
  } else if(loc==='door1'){
    addBtn('← Кабина пилотов',()=>go('cockpit'));
    addBtn('Салон经济 →',()=>go('row1'));
    addBtn('☕ Кофе из буфета',()=>msg('p','*наливаете кофе в бумажный стакан* Вкусно!'));
    addBtn('📐 Схема фюзеляжа [C]',()=>{view='fuselage';updUI();});
  } else if(loc==='tail'){
    addBtn('← Назад в салон',()=>go('row16'));
    addBtn('🚪 Осмотреть аварийный выход',()=>msg('p','Дверь закрыта. Табличка: "НЕ ОТКРЫВАТЬ В ПОЛЁТЕ". Красная ручка в верхнем положении.'));
    addBtn('📐 Схема фюзеляжа [C]',()=>{view='fuselage';updUI();});
  } else {
    if(l.nl.left)addBtn('← '+L[l.nl.left].name,()=>go(l.nl.left));
    if(l.nl.right)addBtn(L[l.nl.right].name+' →',()=>go(l.nl.right));
    if(l.ps){
      l.ps.forEach(pi=>{
        let p=P[pi];
        addBtn('💬 '+p.name+' ('+p.seat+')',()=>talkTo(pi));
      });
    }
    if(loc==='row11'){
      addBtn('🚻 Сходить в туалет',()=>{msg('p','*заходите в туалет*');setTimeout(()=>msg('c','Лена: Извините, туалет закрыт на посадку. Откроем через 10 минут.'),800);});
      addBtn('🛒 Попросить напитки',()=>{msg('p','Наташа, можно воды?');setTimeout(()=>msg('c','Наташа: Конечно, вот ваша вода. Приятного полёта!'),600);});
    }
    addBtn('📐 Схема фюзеляжа [C]',()=>{view='fuselage';updUI();});
  }
}

function go(l2){
  loc=l2;view='walk';
  let ld=L[l2];
  if(ld.ps&&ld.ps.length){
    let pp=P[ld.ps[Math.floor(Math.random()*ld.ps.length)]];
    let isCrew=['stf','stf2','cpt','co','eng','ap','rdo'].includes(pp.av);
    setTimeout(()=>msg(isCrew?'c':'x',pp.name+': "'+ambience(pp)+'"'),400);
  }
  updUI();
}

function ambience(p){
  const generic=['Проходите, не стойте в проходе.','Осторожно, у меня колени...','Извините, пройдите.',
  '*вяло машет рукой*','А вы не стюард?','Ну и теснота...','Сколько ещё лететь?','Ладно, проходите.',
  'Вы не из нашего рейса?','Ой, извините, ноги протянула...'];
  let n=p.name;
  if(n.includes('Старушка'))return 'Молодой человек! Послушайте!';
  if(n.includes('Бизнесмен'))return 'Скажите, когда прилетим? Я опаздываю.';
  if(n.includes('Мама'))return 'Извините за малыша, он устал...';
  if(n.includes('Турист'))return 'Дружище, смотри как красиво за окном!';
  if(n.includes('Наташа'))return 'Проход свободен, пройдите, пожалуйста.';
  if(n.includes('Лена'))return 'Напитки? Кофе, чай, сок?';
  if(n.includes('Нервный'))return 'Вы тоже чувствуете эту тряску?!';
  if(n.includes('Близнецы'))return 'Мы летим! Мам, смотри в окно!';
  if(n.includes('кошк'))return '*мяу* *мурлычет*';
  if(n.includes('Спортсмен'))return 'Извините, разминаю ноги, свело...';
  if(n.includes('Студент'))return 'Извините, на учёбу опаздываю...';
  if(n.includes('Пожилой'))return '*тихо храпит*';
  if(n.includes('Девушка'))return '*снимает наушники* Хм? Извините...';
  return generic[Math.floor(Math.random()*generic.length)];
}

  let ch=document.getElementById('choices');ch.innerHTML='';
  function addBtn(text,fn){
    let b=document.createElement('button');b.className='cb';b.textContent=text;b.onclick=fn;ch.appendChild(b);
  }
  addBtn('👋 «Извините, проходите»',()=>{
    msg('p','Вы: «Извините, проходите, мне надо пройти»');
    setTimeout(()=>msg('x',p.name+': "'+d.r[Math.floor(Math.random()*d.r.length)]+'"'),600);
    setTimeout(updUI,800);
  });
  addBtn('💬 «Сколько ещё лететь?»',()=>{
    msg('p','Вы: «Сколько ещё лететь до Сочи?»');
    setTimeout(()=>msg('x',p.name+': "Ещё примерно час, может полтора..."'),600);
    setTimeout(updUI,800);
  });
  addBtn('😎 «Всё норм, не переживай»',()=>{
    msg('p','Вы: «Всё нормально, мы скоро приземлимся»');
    setTimeout(()=>msg('x',p.name+': "'+d.r[Math.floor(Math.random()*d.r.length)]+'"'),600);
    setTimeout(updUI,800);
  });
  addBtn('🤫 «Тише, люди спят»',()=>{
    msg('p','Вы: «Тише, пожалуйста, дети спят»');
    setTimeout(()=>msg('x',p.name+': "А, ладно, извините..."'),600);
    setTimeout(updUI,800);
  });
  addBtn('🚶 «Мне пора, всего хорошего»',()=>{
    msg('p','Вы: «Всего хорошего, приятного полёта!»');
    setTimeout(()=>msg('x',p.name+': "И вам того же! Хорошего отдыха!"'),600);
    setTimeout(updUI,800);
  });
}

function msg(t,txt){
  dlLog.push({t,txt});
  let h=document.getElementById('dialogHistory');
  let d=document.createElement('div');d.className='dl';
  let cls=t==='p'?'p':t==='c'?'c':'x';
  let prefix=t==='p'?'[Вы]':t==='c'?'[Экипаж]':'';
  d.innerHTML='<span class="s '+cls+'">'+prefix+'</span> '+txt;
  h.appendChild(d);h.parentElement.scrollTop=h.parentElement.scrollHeight;
  if(h.children.length>50)h.removeChild(h.firstChild);
}

// === КЛАВИАТУРА ===
document.addEventListener('keydown',e=>{
  let l=L[loc];
  if(e.key==='a'||e.key==='ArrowLeft'){if(view==='walk'&&l.nl.left)go(l.nl.left);}
  if(e.key==='d'||e.key==='ArrowRight'){if(view==='walk'&&l.nl.right)go(l.nl.right);}
  if(e.key==='c'||e.key==='C'){view=view==='fuselage'?'walk':'fuselage';updUI();}
  if(e.key==='l'||e.key==='L')toggleLabels();
  if(e.key==='e'&&view==='walk'&&loc!=='cockpit'&&l.ps&&l.ps.length){
    talkTo(l.ps[Math.floor(Math.random()*l.ps.length)]);
  }
});

function toggleLabels(){
  labelsOn=!labelsOn;
  let b=document.getElementById('lblBtn');
  b.textContent='Подписи: '+(labelsOn?'ВКЛ':'ВЫКЛ');
  b.className=labelsOn?'active':'';
}
document.getElementById('lblBtn').onclick=toggleLabels;

msg('c','Копилот Егоров: «Все системы проверены. Давление в норме. Ожидаемое время прибытия — 2 часа 15 минут.»');
render();
</script>
