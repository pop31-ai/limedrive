<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГЛУБИНА — 16 Фарфоровых Статуэток</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #060810;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }
        #gameContainer { position: relative; }
        canvas {
            display: block;
            border: 2px solid #1a2a3c;
            border-radius: 6px;
            box-shadow: 0 0 50px rgba(60, 140, 200, 0.2);
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #c0d8e8;
            font-size: 13px;
            text-shadow: 0 0 8px rgba(80, 160, 220, 0.6);
            pointer-events: none;
        }
        #ui div { margin: 4px 0; }
        .bar {
            width: 120px;
            height: 10px;
            background: rgba(0, 15, 30, 0.85);
            border: 1px solid #2a5070;
            border-radius: 5px;
            overflow: hidden;
        }
        .bar-fill { height: 100%; transition: width 0.3s; }
        #oxygenBar { background: linear-gradient(90deg, #00a0e0, #00e0ff); }
        #healthBar { background: linear-gradient(90deg, #e06060, #ff9090); }
        #controls {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(8, 16, 30, 0.92);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1a3a5a;
            color: #90b0c8;
            font-size: 11px;
            pointer-events: none;
        }
        #controls p { margin: 3px 0; }
        .key {
            background: #142838;
            padding: 1px 5px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 10px;
        }
        #inventory {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(8, 16, 30, 0.92);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #1a3a5a;
            color: #90b0c8;
            pointer-events: none;
        }
        #inventory h3 { color: #60a0c0; margin-bottom: 8px; font-size: 12px; }
        .inv-slot {
            display: inline-block;
            width: 32px;
            height: 32px;
            background: rgba(0, 20, 40, 0.7);
            border: 1px solid #1a3a5a;
            border-radius: 4px;
            margin: 1px;
            text-align: center;
            line-height: 32px;
            font-size: 16px;
        }
        #charBar {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
            pointer-events: auto;
        }
        .char-btn {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            border: 2px solid #1a2a3c;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            overflow: hidden;
        }
        .char-btn:hover { border-color: #4a8ab0; transform: scale(1.15); }
        .char-btn.active { border-color: #e0c080; box-shadow: 0 0 12px rgba(200, 170, 100, 0.4); }
        .char-btn canvas { display: block; }
        .char-btn .char-key {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 8px;
            color: rgba(255,255,255,0.5);
            font-family: monospace;
        }
        #dialogBox {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(8, 16, 30, 0.95);
            padding: 18px;
            border-radius: 10px;
            border: 1px solid #3a6a8a;
            color: #c0d8e8;
            max-width: 280px;
            display: none;
        }
        #dialogBox h4 { color: #60a0c0; margin-bottom: 8px; font-size: 13px; }
        #dialogText { line-height: 1.4; margin-bottom: 10px; font-size: 12px; }
        .dialog-btn {
            background: #142838;
            border: 1px solid #2a5070;
            color: #90b0c8;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .dialog-btn:hover { background: #1a3848; }
        #levelName {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #60a0c0;
            font-size: 28px;
            text-shadow: 0 0 20px rgba(80, 160, 220, 0.6);
            opacity: 0;
            transition: opacity 1s;
            pointer-events: none;
        }
        #museumHint {
            position: absolute;
            top: 50px;
            left: 15px;
            color: rgba(160, 190, 210, 0.5);
            font-size: 11px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="600"></canvas>
        <div id="ui">
            <div>Кислород</div>
            <div class="bar"><div class="bar-fill" id="oxygenBar" style="width:100%"></div></div>
            <div style="margin-top:6px">Здоровье</div>
            <div class="bar"><div class="bar-fill" id="healthBar" style="width:100%"></div></div>
            <div style="margin-top:6px">Глубина: <span id="depth">0</span>м</div>
            <div style="margin-top:6px" id="charLabel">Лира</div>
        </div>
        <div id="controls">
            <p><span class="key">←</span><span class="key">→</span> Движение</p>
            <p><span class="key">↑</span> Прыжок</p>
            <p><span class="key">E</span> Взаимодействие</p>
            <p><span class="key">SPC</span> Фонарик</p>
            <p><span class="key">TAB</span> Осмотреть</p>
            <p><span class="key">X</span> Выбор куклы</p>
            <p><span class="key">C</span> Кастомизация</p>
        </div>
        <div id="inventory">
            <h3>Коллекция</h3>
            <div id="invSlots"></div>
        </div>
        <div id="charBar"></div>
        <div id="dialogBox">
            <h4 id="dialogSpeaker"></h4>
            <p id="dialogText"></p>
            <button class="dialog-btn" onclick="nextDialog()">Далее</button>
        </div>
        <div id="levelName"></div>
        <div id="museumHint">TAB — режим осмотра статуэтки</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
