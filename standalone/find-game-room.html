<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Найди и покажи! - Hidden Object Quest</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
body {
  background: linear-gradient(135deg, #1a0533, #2d1b69, #1a0533);
  min-height: 100vh; display: flex; justify-content: center; align-items: center;
  font-family: 'Segoe UI', 'Comic Sans MS', cursive, sans-serif;
  overflow: hidden;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); }
}
@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-8px); }
}
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 8px rgba(255,215,0,0.3); }
  50% { box-shadow: 0 0 25px rgba(255,215,0,0.8), 0 0 50px rgba(255,215,0,0.3); }
}
@keyframes breathe {
  0%, 100% { opacity: var(--obj-opacity, 0.5); transform: scale(0.85); }
  50% { opacity: calc(var(--obj-opacity, 0.5) + 0.15); transform: scale(0.95); }
}
@keyframes confetti-fall {
  0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
@keyframes bounce-in {
  0% { transform: scale(0); }
  50% { transform: scale(1.2); }
  70% { transform: scale(0.9); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
@keyframes sparkle-burst {
  0% { transform: scale(0) rotate(0deg); opacity: 0; }
  50% { transform: scale(1.5) rotate(180deg); opacity: 1; }
  100% { transform: scale(0) rotate(360deg); opacity: 0; }
}
@keyframes slide-up {
  0% { transform: translateY(30px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}
@keyframes rainbow-bg {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

#game-wrapper {
  position: relative;
  width: 820px; height: 620px;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(147,51,234,0.4), 0 20px 60px rgba(0,0,0,0.5);
  border: 3px solid rgba(255,215,0,0.3);
}

#game-container {
  position: relative;
  width: 100%; height: 100%;
  background: #87CEEB;
  overflow: hidden;
  cursor: default;
}

/* ── HUD ── */
#hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 16px;
  background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
  pointer-events: none;
}
#hud > * { pointer-events: auto; }
.hud-item {
  display: flex; align-items: center; gap: 6px;
  color: #fff; font-size: 16px; font-weight: bold;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  background: rgba(0,0,0,0.35); padding: 4px 12px; border-radius: 20px;
  backdrop-filter: blur(4px);
}
.hud-item .icon { font-size: 20px; }

#level-name {
  color: #fff; font-size: 18px; font-weight: bold;
  text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  letter-spacing: 1px;
  background: rgba(0,0,0,0.3); padding: 4px 16px; border-radius: 20px;
}

/* ── Scene ── */
#scene {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  overflow: hidden;
}

.scene-bg-layer {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
}

/* ── Furniture ── */
.furniture {
  position: absolute;
  pointer-events: none;
}

/* ── Hidden Objects ── */
.hidden-object {
  position: absolute;
  cursor: pointer;
  transition: transform 0.2s, filter 0.3s;
  font-size: 40px;
  display: flex; align-items: center; justify-content: center;
  pointer-events: auto;
  z-index: 10;
}
.hidden-object:hover {
  animation-play-state: paused;
  transform: scale(1.15) !important;
  filter: brightness(1.2) !important;
}
.hidden-object.found {
  pointer-events: none;
  animation: bounce-in 0.5s ease forwards;
}
.hidden-object.found::after {
  content: '✓';
  position: absolute; top: -10px; right: -10px;
  background: #4CAF50; color: #fff;
  width: 26px; height: 26px; border-radius: 50%;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  border: 2px solid #fff;
}
.hidden-object {
  animation: breathe 3s ease-in-out infinite;
}
.hidden-object.found {
  animation: bounce-in 0.5s ease forwards;
}
.hidden-object .glow-ring {
  position: absolute; inset: -8px;
  border-radius: 50%;
  border: 2px solid rgba(255,215,0,0.08);
  animation: pulse-glow 3s infinite;
  pointer-events: none;
}
.hidden-object.hint-glow .glow-ring {
  border-color: rgba(255,215,0,0.8);
}

.hidden-object.wrong {
  animation: shake 0.4s ease;
}

.object-peek {
  position: absolute;
  pointer-events: none;
  z-index: 5;
}

/* ── Hints Bar ── */
#hints-bar {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 50;
  padding: 10px 16px 12px;
  background: linear-gradient(0deg, rgba(0,0,0,0.6) 0%, transparent 100%);
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
  min-height: 70px;
}
.hint-item {
  display: flex; flex-direction: column; align-items: center;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(4px);
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 12px; padding: 4px 10px;
  min-width: 60px;
  transition: all 0.3s;
  cursor: default;
}
.hint-item .hint-icon { font-size: 28px; line-height: 1.2; }
.hint-item .hint-label {
  font-size: 10px; color: rgba(255,255,255,0.7);
  margin-top: 2px; white-space: nowrap;
}
.hint-item.found-hint {
  opacity: 0.4;
  background: rgba(76,175,80,0.2);
  border-color: rgba(76,175,80,0.4);
  text-decoration: line-through;
}
.hint-item.found-hint .hint-icon { filter: grayscale(1); }

/* ── Hint button ── */
#hint-btn {
  position: absolute; bottom: 80px; right: 16px; z-index: 60;
  background: linear-gradient(135deg, #FFD700, #FFA500);
  border: none; border-radius: 50%; width: 50px; height: 50px;
  font-size: 24px; cursor: pointer;
  box-shadow: 0 4px 15px rgba(255,165,0,0.5);
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
#hint-btn:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(255,165,0,0.7); }
#hint-btn:disabled {
  opacity: 0.5; cursor: not-allowed; transform: none;
}

/* ── Level select ── */
#level-select {
  position: absolute; inset: 0; z-index: 200;
  background: linear-gradient(135deg, #1a0533, #2d1b69, #1a0533);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 30px;
}
#level-select h1 {
  color: #FFD700; font-size: 42px; margin-bottom: 8px;
  text-shadow: 0 0 30px rgba(255,215,0,0.3);
  letter-spacing: 2px;
}
#level-select .subtitle {
  color: rgba(255,255,255,0.6); font-size: 16px; margin-bottom: 30px;
}
.level-grid {
  display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
}
.level-card {
  width: 140px; padding: 16px;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.1);
  border-radius: 16px; cursor: pointer;
  text-align: center; color: #fff;
  transition: all 0.3s;
}
.level-card:hover {
  background: rgba(255,255,255,0.15);
  border-color: #FFD700;
  transform: translateY(-4px);
  box-shadow: 0 8px 25px rgba(255,215,0,0.2);
}
.level-card .lc-icon { font-size: 48px; margin-bottom: 8px; }
.level-card .lc-name { font-size: 14px; font-weight: bold; }
.level-card .lc-desc { font-size: 11px; opacity: 0.6; margin-top: 4px; }
.level-card.locked {
  opacity: 0.4; cursor: not-allowed;
}
.level-card.locked:hover { transform: none; border-color: rgba(255,255,255,0.1); box-shadow: none; }

/* ── Completion overlay ── */
#completion {
  position: absolute; inset: 0; z-index: 150;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  color: #fff;
}
#completion.show { display: flex; animation: slide-up 0.5s ease; }
#completion .big-icon { font-size: 80px; margin-bottom: 10px; }
#completion h2 { font-size: 36px; color: #FFD700; margin-bottom: 4px; }
#completion .stats { display: flex; gap: 20px; margin: 16px 0 24px; }
#completion .stat-item { text-align: center; }
#completion .stat-item .num { font-size: 28px; font-weight: bold; color: #FFD700; }
#completion .stat-item .label { font-size: 12px; opacity: 0.7; }
#completion .btn {
  padding: 12px 36px; border-radius: 30px; border: none;
  font-size: 18px; font-weight: bold; cursor: pointer;
  transition: all 0.2s; margin: 4px;
}
#completion .btn-primary {
  background: linear-gradient(135deg, #FFD700, #FFA500);
  color: #1a0533;
}
#completion .btn-primary:hover { transform: scale(1.05); }
#completion .btn-secondary {
  background: rgba(255,255,255,0.15);
  color: #fff;
}
#completion .btn-secondary:hover { background: rgba(255,255,255,0.25); }

/* ── Confetti ── */
.confetti-piece {
  position: fixed; width: 10px; height: 10px;
  animation: confetti-fall linear forwards;
  pointer-events: none; z-index: 300;
}
.confetti-piece.circle { border-radius: 50%; }
.confetti-piece.square { border-radius: 2px; }

/* ── Combo popup ── */
#combo-popup {
  position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
  z-index: 120;
  font-size: 32px; font-weight: bold; color: #FFD700;
  text-shadow: 0 0 20px rgba(255,215,0,0.5);
  pointer-events: none;
  opacity: 0;
  transition: all 0.3s;
}
#combo-popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Bonus popup ── */
.bonus-popup {
  position: absolute; z-index: 110;
  font-size: 24px; font-weight: bold; color: #FFD700;
  text-shadow: 0 0 15px rgba(255,215,0,0.5);
  pointer-events: none;
  animation: float 0.8s ease forwards, fade-up 0.8s ease forwards;
}
@keyframes fade-up {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-40px) scale(0.5); }
}

/* ── Responsive ── */
@media (max-width: 860px) {
  #game-wrapper { width: 95vw; height: calc(95vw * 0.75); border-radius: 16px; }
  .hidden-object { font-size: 30px; }
  #level-name { font-size: 14px; }
  .hint-item .hint-icon { font-size: 20px; }
  .hint-item { min-width: 44px; padding: 2px 6px; }
  #hint-btn { width: 40px; height: 40px; font-size: 18px; bottom: 72px; right: 10px; }
  #level-select h1 { font-size: 28px; }
  .level-card { width: 100px; }
  .level-card .lc-icon { font-size: 36px; }
  #hud { padding: 4px 10px; }
  .hud-item { font-size: 13px; padding: 2px 8px; }
}
</style>
</head>
<body>

<div id="game-wrapper">
<div id="game-container">

  <!-- HUD -->
  <div id="hud">
    <div class="hud-item">
      <span class="icon">⭐</span>
      <span id="stars-count">0</span>
    </div>
    <div class="hud-item">
      <span class="icon">🪙</span>
      <span id="coins-count">0</span>
    </div>
    <div class="hud-item">
      <span class="icon">🔥</span>
      <span id="combo-count">x1</span>
    </div>
    <div id="level-name">Моя комната</div>
    <div class="hud-item">
      <span class="icon">⏱️</span>
      <span id="timer-display">0с</span>
    </div>
  </div>

  <!-- Scene -->
  <div id="scene"></div>

  <!-- Hint button -->
  <button id="hint-btn" title="Подсказка">💡</button>

  <!-- Combo popup -->
  <div id="combo-popup"></div>

  <!-- Hints bar -->
  <div id="hints-bar"></div>

  <!-- Completion overlay -->
  <div id="completion">
    <div class="big-icon">🎉</div>
    <h2>Уровень пройден!</h2>
    <p style="opacity:0.7;margin-bottom:4px;" id="completion-msg">Отлично!</p>
    <div class="stats">
      <div class="stat-item"><div class="num" id="final-stars">0</div><div class="label">⭐ Звёзды</div></div>
      <div class="stat-item"><div class="num" id="final-coins">0</div><div class="label">🪙 Монеты</div></div>
      <div class="stat-item"><div class="num" id="final-time">0с</div><div class="label">⏱️ Время</div></div>
      <div class="stat-item"><div class="num" id="final-combo">x1</div><div class="label">🔥 Комбо</div></div>
    </div>
    <div>
      <button class="btn btn-primary" onclick="game.nextLevel()">➡️ Следующий</button>
      <button class="btn btn-secondary" onclick="game.showLevelSelect()">🏠 Уровни</button>
    </div>
  </div>

  <!-- Level select -->
  <div id="level-select">
    <h1>🔍 Найди и покажи!</h1>
    <div class="subtitle">Находи спрятанные предметы и собирай звёзды! ✨</div>
    <div class="level-grid" id="level-grid"></div>
  </div>

</div>
</div>

<script>
// ─── SCENES ────────────────────────────────────────────────
const SCENES = [
  // ── LEVEL 0: Kids Room ──
  {
    name: 'Моя комната',
    icon: '🧸',
    bg: { type: 'room-wall' },
    objects: [
      { id: 'bear',   emoji: '🧸', name: 'Мишка',     x: 14, y: 40, w: 48, h: 48, zIdx: 15, hint: 'За шторой' },
      { id: 'ball',   emoji: '⚽', name: 'Мяч',       x: 34, y: 72, w: 44, h: 44, zIdx: 15, hint: 'Под кроватью' },
      { id: 'block',  emoji: '🧱', name: 'Кубик',     x: 68, y: 16, w: 38, h: 38, zIdx: 15, hint: 'На полке' },
      { id: 'car',    emoji: '🚗', name: 'Машинка',   x: 78, y: 50, w: 48, h: 36, zIdx: 15, hint: 'Под одеялом' },
      { id: 'book',   emoji: '📚', name: 'Книжка',    x: 5,  y: 24, w: 36, h: 40, zIdx: 15, hint: 'На подоконнике' },
      { id: 'paints', emoji: '🎨', name: 'Краски',    x: 56, y: 42, w: 40, h: 40, zIdx: 15, hint: 'За тумбочкой' },
      { id: 'yoYo',   emoji: '🪀', name: 'Йо-йо',     x: 40, y: 76, w: 32, h: 32, zIdx: 15, hint: 'На ковре' },
    ]
  },
  // ── LEVEL 1: Space ──
  {
    name: 'Космическое путешествие',
    icon: '🚀',
    bg: { type: 'space' },
    objects: [
      { id: 'rocket',   emoji: '🚀', name: 'Ракета',    x: 38, y: 15, w: 52, h: 52, zIdx: 10, hint: 'За планетами' },
      { id: 'alien',    emoji: '👽', name: 'Пришелец',  x: 80, y: 52, w: 44, h: 44, zIdx: 9,  hint: 'В кратере' },
      { id: 'star',     emoji: '⭐', name: 'Звезда',    x: 22, y: 20, w: 36, h: 36, zIdx: 11, hint: 'В туманности' },
      { id: 'ufo',      emoji: '🛸', name: 'НЛО',       x: 55, y: 30, w: 48, h: 36, zIdx: 8,  hint: 'За спутником' },
      { id: 'moon',     emoji: '🌙', name: 'Луна',      x: 10, y: 12, w: 44, h: 44, zIdx: 12, hint: 'За кольцами' },
    ]
  },
  // ── LEVEL 2: Underwater ──
  {
    name: 'Подводный мир',
    icon: '🐠',
    bg: { type: 'underwater' },
    objects: [
      { id: 'fish',     emoji: '🐠', name: 'Рыбка',     x: 28, y: 38, w: 44, h: 36, zIdx: 10, hint: 'За кораллом' },
      { id: 'octopus',  emoji: '🐙', name: 'Осьминог',  x: 68, y: 50, w: 48, h: 44, zIdx: 9,  hint: 'За водорослями' },
      { id: 'treasure', emoji: '💎', name: 'Сокровище', x: 42, y: 68, w: 38, h: 38, zIdx: 8,  hint: 'Под камнями' },
      { id: 'starfish', emoji: '⭐', name: 'Морская звезда', x: 15, y: 72, w: 36, h: 36, zIdx: 7, hint: 'На песке' },
      { id: 'shell',    emoji: '🐚', name: 'Ракушка',   x: 58, y: 74, w: 34, h: 34, zIdx: 7,  hint: 'В песке' },
    ]
  },
];

// ─── GAME CLASS ────────────────────────────────────────────
class HiddenObjectGame {
  constructor() {
    this.currentLevel = 0;
    this.unlockedLevels = [true, false, false];
    this.stars = 0;
    this.coins = 0;
    this.combo = 1;
    this.maxCombo = 1;
    this.foundCount = 0;
    this.totalObjects = 0;
    this.isPlaying = false;
    this.startTime = null;
    this.timerInterval = null;
    this.hintIndex = -1;
    this.usedHints = new Set();

    this.sceneEl = document.getElementById('scene');
    this.hintsBar = document.getElementById('hints-bar');
    this.completionEl = document.getElementById('completion');
    this.levelSelect = document.getElementById('level-select');
    this.levelGrid = document.getElementById('level-grid');
    this.levelName = document.getElementById('level-name');
    this.starsEl = document.getElementById('stars-count');
    this.coinsEl = document.getElementById('coins-count');
    this.comboEl = document.getElementById('combo-count');
    this.timerEl = document.getElementById('timer-display');
    this.comboPopup = document.getElementById('combo-popup');
    this.hintBtn = document.getElementById('hint-btn');

    this.hintBtn.addEventListener('click', () => this.useHint());

    this.buildLevelSelect();
  }

  buildLevelSelect() {
    this.levelGrid.innerHTML = '';
    SCENES.forEach((scene, i) => {
      const card = document.createElement('div');
      card.className = 'level-card' + (this.unlockedLevels[i] ? '' : ' locked');
      card.innerHTML = `
        <div class="lc-icon">${scene.icon}</div>
        <div class="lc-name">${scene.name}</div>
        <div class="lc-desc">${this.unlockedLevels[i] ? 'Нажми, чтобы играть' : '🔒 Закрыто'}</div>
      `;
      if (this.unlockedLevels[i]) {
        card.addEventListener('click', () => this.startLevel(i));
      }
      this.levelGrid.appendChild(card);
    });
  }

  startLevel(index) {
    if (!this.unlockedLevels[index]) return;
    this.currentLevel = index;
    this.foundCount = 0;
    this.combo = 1;
    this.maxCombo = 1;
    this.hintIndex = -1;
    this.usedHints.clear();
    this.isPlaying = true;

    this.levelSelect.style.display = 'none';
    this.completionEl.classList.remove('show');
    this.completionEl.style.display = 'none';

    const scene = SCENES[index];
    this.levelName.textContent = scene.name;
    this.totalObjects = scene.objects.length;

    this.renderScene(scene);
    this.renderHints(scene);
    this.updateHUD();

    // Timer
    this.startTime = Date.now();
    clearInterval(this.timerInterval);
    this.timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
      this.timerEl.textContent = elapsed + 'с';
    }, 200);

    // First hints
    this.hintBtn.disabled = false;
  }

  renderScene(scene) {
    this.sceneEl.innerHTML = '';

    // Background
    const bg = document.createElement('div');
    bg.className = 'scene-bg-layer';
    bg.id = 'bg-layer';
    this.sceneEl.appendChild(bg);

    // Draw background based on type
    this.drawBackground(bg, scene.bg.type);

    // Create furniture (decorative)
    this.createFurniture(scene.bg.type);

    // Create objects (sorted by zIndex so lower ones render first)
    const sorted = [...scene.objects].sort((a, b) => a.zIdx - b.zIdx);
    sorted.forEach((obj, i) => {
      const el = document.createElement('div');
      el.className = 'hidden-object';
      el.dataset.id = obj.id;
      el.style.left = obj.x + '%';
      el.style.top = obj.y + '%';
      el.style.width = obj.w + 'px';
      el.style.height = obj.h + 'px';
      el.style.fontSize = Math.min(obj.w, obj.h) * 0.7 + 'px';
      el.style.zIndex = obj.zIdx;
      el.style.transform = 'scale(0.85)';

      // Random initial rotation for natural look
      const rot = (Math.random() * 10 - 5);
      el.style.transform = `scale(0.85) rotate(${rot}deg)`;

      el.innerHTML = `<div class="glow-ring"></div><span style="filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3))">${obj.emoji}</span>`;

      // Objects get partially hidden with opacity + brightness to simulate camouflage
      const hidingEffects = {
        'bear':   { opacity: 0.30, filter: 'brightness(0.55) saturate(0.7)' },
        'ball':   { opacity: 0.25, filter: 'brightness(0.45) contrast(0.8)' },
        'block':  { opacity: 0.50, filter: 'brightness(0.7) saturate(0.6)' },
        'car':    { opacity: 0.20, filter: 'brightness(0.4) contrast(0.7)' },

  renderHints(scene) {
    this.hintsBar.innerHTML = '';
    scene.objects.forEach(obj => {
      const el = document.createElement('div');
      el.className = 'hint-item';
      el.dataset.id = obj.id;
      el.innerHTML = `<div class="hint-icon">${obj.emoji}</div><div class="hint-label">${obj.name}</div>`;
      el.title = obj.hint;
      this.hintsBar.appendChild(el);
    });
  }

  onObjectClick(e, el, obj) {
    if (!this.isPlaying) return;
    if (el.classList.contains('found')) return;

    // Check if this object is still to be found
    const scene = SCENES[this.currentLevel];
    const stillToFind = scene.objects.filter(o => {
      const oEl = this.sceneEl.querySelector(`[data-id="${o.id}"]`);
      return !oEl.classList.contains('found');
    });

    if (stillToFind.some(o => o.id === obj.id)) {
      // Found!
      el.classList.add('found');

      // Calculate bonus
      const elapsed = Date.now() - this.startTime;
      const speedBonus = elapsed < 45000 ? 3 : elapsed < 90000 ? 2 : 1;
      const comboBonus = this.combo;

      const starsEarned = 1 * speedBonus;
      const coinsEarned = 10 * comboBonus;

      this.stars += starsEarned;
      this.coins += coinsEarned;

      this.foundCount++;
      this.combo = Math.min(this.combo + 1, 10);
      this.maxCombo = Math.max(this.maxCombo, this.combo);

      // Show bonus popup
      this.showBonusPopup(e.clientX || e.touches?.[0]?.clientX || 400, 
                          (e.clientY || e.touches?.[0]?.clientY || 300) - 30, 
                          `+${starsEarned}⭐ +${coinsEarned}🪙`);

      // Combo popup
      if (this.combo >= 3) {
        this.showComboPopup(`🔥 Комбо x${this.combo}!`);
      }

      // Update hint item
      const hintEl = this.hintsBar.querySelector(`[data-id="${obj.id}"]`);
      if (hintEl) hintEl.classList.add('found-hint');

      this.updateHUD();

      // Remove object after animation
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'scale(0)';
      }, 400);

      // Check level complete
      if (this.foundCount >= this.totalObjects) {
        setTimeout(() => this.completeLevel(), 600);
      }
    } else {
      // Wrong click
      el.classList.add('wrong');
      setTimeout(() => el.classList.remove('wrong'), 400);
      this.combo = 1;
      this.updateHUD();
      this.showBonusPopup(e.clientX || 400, (e.clientY || 300) - 30, '❌ Промах!', '#ff6b6b');
    }
  }

  showBonusPopup(x, y, text, color = '#FFD700') {
    const popup = document.createElement('div');
    popup.className = 'bonus-popup';
    popup.style.color = color;
    popup.textContent = text;
    const gameRect = document.getElementById('game-container').getBoundingClientRect();
    let px = ((x || 400) - gameRect.left) / gameRect.width * 100;
    let py = ((y || 300) - gameRect.top) / gameRect.height * 100;
    px = Math.max(5, Math.min(px, 85));
    py = Math.max(5, Math.min(py, 80));
    popup.style.left = px + '%';
    popup.style.top = py + '%';
    document.getElementById('game-container').appendChild(popup);
    setTimeout(() => popup.remove(), 900);
  }

  showComboPopup(text) {
    this.comboPopup.textContent = text;
    this.comboPopup.classList.add('show');
    clearTimeout(this.comboPopup._timeout);
    this.comboPopup._timeout = setTimeout(() => {
      this.comboPopup.classList.remove('show');
    }, 1200);
  }

  useHint() {
    if (!this.isPlaying) return;
    const scene = SCENES[this.currentLevel];
    const stillToFind = scene.objects.filter(o => {
      const oEl = this.sceneEl.querySelector(`[data-id="${o.id}"]`);
      return !oEl.classList.contains('found');
    });

    if (stillToFind.length === 0) return;

    // Find next unhinted object
    let hintTarget = null;
    for (let i = this.hintIndex + 1; i < scene.objects.length; i++) {
      const o = scene.objects[i];
      const oEl = this.sceneEl.querySelector(`[data-id="${o.id}"]`);
      if (oEl && !oEl.classList.contains('found') && !this.usedHints.has(o.id)) {
        hintTarget = o;
        this.hintIndex = i;
        break;
      }
    }
    if (!hintTarget) {
      // wrap around
      for (let i = 0; i < scene.objects.length; i++) {
        const o = scene.objects[i];
        const oEl = this.sceneEl.querySelector(`[data-id="${o.id}"]`);
        if (oEl && !oEl.classList.contains('found') && !this.usedHints.has(o.id)) {
          hintTarget = o;
          this.hintIndex = i;
          break;
        }
      }
    }

    if (!hintTarget) return;

    // Cost: 5 coins
    if (this.coins < 5) return;
    this.coins -= 5;

    this.usedHints.add(hintTarget.id);
    const oEl = this.sceneEl.querySelector(`[data-id="${hintTarget.id}"]`);
    if (!oEl) return;

    // Temporarily reveal the hidden object
    const origOpacity = oEl.style.opacity;
    const origFilter = oEl.style.filter;
    oEl.style.opacity = '1';
    oEl.style.filter = 'brightness(1.2) saturate(1.3) drop-shadow(0 0 12px gold)';
    oEl.classList.add('hint-glow');
    oEl.style.transform = 'scale(1.3)';
    setTimeout(() => {
      oEl.style.opacity = origOpacity;
      oEl.style.filter = origFilter;
      oEl.classList.remove('hint-glow');
      oEl.style.transform = '';
    }, 2500);

    this.updateHUD();
  }

  completeLevel() {
    this.isPlaying = false;
    clearInterval(this.timerInterval);

    const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
    const finalStars = this.stars;
    const finalCoins = this.coins;

    document.getElementById('final-stars').textContent = finalStars;
    document.getElementById('final-coins').textContent = finalCoins;
    document.getElementById('final-time').textContent = elapsed + 'с';
    document.getElementById('final-combo').textContent = 'x' + this.maxCombo;

    // Messages based on performance
    let msg = 'Отлично! Ты настоящий сыщик! 🔍';
    if (this.maxCombo >= 5) msg = '🔥 ОГОНЬ! Невероятная серия!';
    else if (elapsed < 30) msg = '⚡ Молниеносная скорость!';
    else if (elapsed < 60) msg = '✨ Очень быстро! Молодец!';
    document.getElementById('completion-msg').textContent = msg;

    this.completionEl.style.display = 'flex';
    this.completionEl.classList.add('show');

    // Confetti!
    this.spawnConfetti();

    // Unlock next level
    if (this.currentLevel + 1 < SCENES.length) {
      this.unlockedLevels[this.currentLevel + 1] = true;
    }
  }

  spawnConfetti() {
    const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6B6B', '#C084FC', '#FF8C00', '#FF69B4'];
    const shapes = ['circle', 'square'];
    const container = document.body;

    for (let i = 0; i < 80; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece ' + shapes[Math.floor(Math.random() * shapes.length)];
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.width = (5 + Math.random() * 8) + 'px';
      piece.style.height = (5 + Math.random() * 8) + 'px';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDuration = (2 + Math.random() * 3) + 's';
      piece.style.animationDelay = (Math.random() * 2) + 's';
      container.appendChild(piece);
      setTimeout(() => piece.remove(), 6000);
    }
  }

  nextLevel() {
    const next = this.currentLevel + 1;
    if (next < SCENES.length) {
      this.startLevel(next);
    } else {
      this.showLevelSelect();
    }
  }

  showLevelSelect() {
    this.isPlaying = false;
    clearInterval(this.timerInterval);
    this.completionEl.classList.remove('show');
    this.completionEl.style.display = 'none';
    this.sceneEl.innerHTML = '';
    this.hintsBar.innerHTML = '';
    this.buildLevelSelect();
    this.levelSelect.style.display = 'flex';
  }

  updateHUD() {
    this.starsEl.textContent = this.stars;
    this.coinsEl.textContent = this.coins;
    this.comboEl.textContent = 'x' + this.combo;
  }
}

const game = new HiddenObjectGame();
