<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Velocity 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var C=document.getElementById('c'),X=C.getContext('2d');
var W,H;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}
resize();
addEventListener('resize',resize);

var LAPS=3,SEG=200,RD_W=160;
var CAM_H=250,FOCAL=300;
var track,car,keys={},running,lapTime,bestLap,lap,lastCross,boost,shake;
var parts=[],rivals=[];
var curTrack=0;

var TRACKS=[
    {
        name:'NEON CITY',sub:'Неоновый город',icon:'\u{1F3D9}',
        sky:'#020208',bld1:'#0a0a20',bld2:'#080818',
        road1:'#0a0a2e',road2:'#0d0d35',        curbs:['#200','#400'],
        edge:'#0ff',flags:['#f44','#4f4','#ff0','#f0f','#0ff'],
        gen:function(i){
            var c=0,p=i%50;
            if(p>=5&&p<15)c=3;else if(p>=20&&p<30)c=-4;else if(p>=35&&p<45)c=2;
            var h=Math.sin(i*0.1)*40+Math.sin(i*0.06)*20;
            return{c:c,h:h,b:i%20===5||i%20===14};
        }
    },
    {
        name:'MOUNTAIN PASS',sub:'Горный перевал',icon:'\u{1F3D4}',
        sky:'#060612',bld1:'#1a1510',bld2:'#12100c',
        road1:'#1a1a1a',road2:'#151515',        curbs:['#320','#430'],
        edge:'#f80',flags:['#f80','#fa0','#fc0','#f60','#f40'],
        gen:function(i){
            var c=0,p=i%60;
            if(p>=3&&p<12)c=5;else if(p>=15&&p<25)c=-6;else if(p>=28&&p<38)c=4;
            else if(p>=42&&p<50)c=-3;
            var h=Math.sin(i*0.08)*60+Math.sin(i*0.04)*35+Math.cos(i*0.15)*15;
            return{c:c,h:h,b:i%25===8||i%25===20};
        }
    },
    {
        name:'DESERT HIGHWAY',sub:'Пустынное шоссе',icon:'\u{1F3DC}',
        sky:'#0a0604',bld1:'#2a1c0e',bld2:'#1e150a',
        road1:'#2a2218',road2:'#221c14',        curbs:['#430','#540'],
        edge:'#fa0',flags:['#fa0','#ff0','#f80','#fc0','#fe0'],
        gen:function(i){
            var c=0,p=i%70;
            if(p>=10&&p<25)c=1.5;else if(p>=35&&p<50)c=-1.5;
            var h=Math.sin(i*0.05)*15+Math.sin(i*0.02)*8;
            return{c:c,h:h,b:i%30===10||i%30===25};
        }
    },
    {
        name:'ICE RIDGE',sub:'Ледяной хребет',icon:'\u2744',
        sky:'#040810',bld1:'#0c1828',bld2:'#081420',
        road1:'#0e1828',road2:'#0a1420',        curbs:['#024','#036'],
        edge:'#4ff',flags:['#4ff','#8ff','#aff','#4cf','#0ff'],
        gen:function(i){
            var c=0,p=i%55;
            if(p>=5&&p<18)c=4;else if(p>=22&&p<35)c=-5;else if(p>=40&&p<48)c=3;
            var h=Math.sin(i*0.07)*50+Math.sin(i*0.12)*25+Math.cos(i*0.03)*20;
            return{c:c,h:h,b:i%18===4||i%18===12};
        }
    }
];

function mkTrack(){
    track=[];
    var T=TRACKS[curTrack];
    for(var i=0;i<160;i++){
        var d=T.gen(i);
        var fl=i%10===0;
        var fc=T.flags[((i/10)|0)%5];
        var col=i%2?T.road1:T.road2;
        track.push({c:d.c,h:d.h,b:d.b,fl:fl,fc:fc,col:col});
    }
}

function mkCar(){
    return{pos:0,spd:0,max:16,acc:0.22,brk:0.3,dec:0.07,x:0,st:0,
        drift:false,dd:0,dt:0,boost:false,bt:0,shield:100,inv:0};
}

function mkRivals(){
    return[
        {pos:0,spd:0,x:-0.3,col:'#f44',sk:0.82},
        {pos:0,spd:0,x:0.2,col:'#f0f',sk:0.88},
        {pos:0,spd:0,x:0,col:'#ff0',sk:0.75}
    ];
}

function go(){
    mkTrack();
    car=mkCar();
    rivals=mkRivals();
    keys={};
    lapTime=0;bestLap=null;lap=1;lastCross=0;
    boost=0;parts=[];shake=0;running=true;
    lastT=performance.now();
    requestAnimationFrame(loop);
}

function fmt(ms){
    var s=ms/1000;
    return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')+'.'+Math.floor((ms%1000)/100);
}

function partsAdd(x,y,col,n){
    for(var i=0;i<n;i++)
        parts.push({x:x,y:y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6-2,
            life:20+Math.random()*15,ml:35,col:col,sz:1+Math.random()*3});
}

function upd(dt){
    if(!running)return;
    lapTime+=dt;
    if(shake>0)shake-=dt*0.07;

    var si=((car.pos%track.length)+track.length)%track.length|0;
    var seg=track[si];

    var sf=car.spd/car.max;
    var sf2=sf*sf;
    var ss=0.035*(1-sf2*0.5);
    var steerIn=keys.ArrowLeft||keys.KeyA?-1:keys.ArrowRight||keys.KeyD?1:0;
    if(steerIn!==0){
        var absSt=Math.abs(car.st);
        var ramp=0.7+absSt*0.6;
        car.st+=steerIn*ss*ramp;
    }
    car.st*=0.91;
    car.st=Math.max(-1,Math.min(1,car.st));
    var latAcc=car.st*car.st*Math.sign(car.st)*car.spd*0.15;
    car.x+=latAcc;

    if(keys.ShiftLeft||keys.ShiftRight){
        if(!car.drift){car.drift=true;car.dd=car.st>0?1:car.st<0?-1:0}
    }else{
        if(car.drift&&car.dt>25){
            boost=Math.min(100,boost+Math.min(30,car.dt)*0.9);
            partsAdd(car.x*W/2+W/2,H-80,TRACKS[curTrack].edge,8);
        }
        car.drift=false;car.dd=0;car.dt=0;
    }
    if(car.drift){
        car.dt++;
        if(car.dd!==0&&car.st*car.dd<0)car.dd=-car.dd;
    }

    if(seg.b&&car.drift&&car.dt>8){
        boost=Math.min(100,boost+0.6);
        if(Math.random()<0.15)partsAdd(W/2,H-60,'#ff0',3);
    }

    if(keys.ArrowUp||keys.KeyW)car.spd+=car.acc*(1+sf*0.5);
    else if(keys.ArrowDown||keys.KeyS)car.spd-=car.brk*(1+sf2*0.3);
    else if(car.spd>0)car.spd=Math.max(0,car.spd-car.dec*(0.5+sf*0.5));

    if(keys.Space&&boost>0){
        car.boost=true;car.bt++;
        var bPower=0.35*(1+sf*0.3);
        car.spd+=bPower;
        boost-=0.7;
        if(car.bt%3===0)partsAdd(car.x*W/2+W/2+(Math.random()-0.5)*10,H-50,TRACKS[curTrack].edge,2);
    }else{car.boost=false;car.bt=0}

    car.spd=Math.max(-2,Math.min(car.max*(car.boost?1.4:1),car.spd));
    car.x-=car.spd*seg.c*0.0015*(0.5+sf*0.5);

    if(Math.abs(car.x)>1){
        car.spd*=0.96;
        car.x=Math.max(-1.5,Math.min(1.5,car.x));
        if(car.spd>4&&Math.random()<0.25)partsAdd(car.x*W/2+W/2,H-40,'#864',2);
    }

    var prevPos=car.pos;
    car.pos+=car.spd*0.06;

    if(car.inv>0)car.inv-=dt*0.07;
    if(car.shield<100)car.shield+=0.006;

    var prevSi=((prevPos%track.length)+track.length)%track.length|0;
    if(prevSi>track.length-15&&si<15&&lapTime-lastCross>3000){
        var lt=lapTime-lastCross;
        if(lap>1||lapTime>4000){
            if(!bestLap||lt<bestLap)bestLap=lt;
            lastCross=lapTime;lap++;shake=12;
            if(lap>LAPS){finish();return}
        }
    }

    var tl=track.length;
    rivals.forEach(function(r){
        var ts=car.max*r.sk*(0.65+Math.random()*0.15);
        r.spd+=(ts-r.spd)*0.02;
        r.spd=Math.max(2,Math.min(car.max*0.92,r.spd));
        r.pos+=r.spd*0.06;
        r.x+=Math.sin(r.pos*0.03)*0.004;

        var dx=Math.abs(r.x-car.x);
        var ri=((r.pos%tl)+tl)%tl;
        var ci=((car.pos%tl)+tl)%tl;
        if(dx<0.28&&Math.abs(ri-ci)<1.5&&car.inv<=0){
            if(car.drift){
                r.spd*=0.4;car.spd*=1.1;
                partsAdd(W/2,H/2,TRACKS[curTrack].edge,12);shake=10;
            }else{
                car.spd*=0.35;car.shield-=12;car.inv=70;
                shake=18;partsAdd(W/2,H/2,'#f44',18);
                if(car.shield<=0)endGame('Shield destroyed!');
            }
        }
    });

    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--});
    parts=parts.filter(function(p){return p.life>0});

    if(car.drift&&car.dt>4&&Math.random()<0.45)
        partsAdd(car.x*W/2+W/2+(Math.random()-0.5)*14,H-55,car.dd>0?'#f80':TRACKS[curTrack].edge,1);
}

function finish(){running=false;showEnd('RACE COMPLETE',bestLap?'Best lap: '+fmt(bestLap):'Great!')}
function endGame(m){running=false;showEnd('RACE COMPLETE',m)}

function showEnd(title,msg){
    X.fillStyle='rgba(0,0,0,0.85)';X.fillRect(0,0,W,H);
    X.fillStyle=TRACKS[curTrack].edge;X.shadowColor=TRACKS[curTrack].edge;X.shadowBlur=40;
    X.font='bold 52px Arial';X.textAlign='center';
    X.fillText(title,W/2,H/2-60);X.shadowBlur=0;
    X.fillStyle='#ff0';X.font='bold 36px Arial';
    X.fillText(fmt(lapTime),W/2,H/2);
    X.fillStyle='#8af';X.font='18px Arial';
    X.fillText(msg,W/2,H/2+40);
    X.fillStyle=TRACKS[curTrack].edge;X.font='20px Arial';
    X.fillText('TRACK SELECT',W/2,H/2+90);
    running=false;
    C.onclick=function(){C.onclick=null;drawMenu()};
}

function proj(x,y,z){
    if(z<1)z=1;
    var sc=FOCAL/z;
    return{x:W/2+x*sc,y:H*0.45-(y-CAM_H)*sc,s:sc};
}

function draw(){
    var T=TRACKS[curTrack];
    X.fillStyle=T.sky;X.fillRect(0,0,W,H);

    X.fillStyle='#fff';
    for(var i=0;i<40;i++){
        var sx=(i*137+50)%W;
        var sy=(i*97+20)%(H*0.42);
        var sb=0.3+Math.sin(performance.now()*0.001+i)*0.3;
        X.globalAlpha=sb;X.fillRect(sx,sy,1.5,1.5);
    }
    X.globalAlpha=1;

    if(shake>0){X.save();X.translate((Math.random()-0.5)*shake*2,(Math.random()-0.5)*shake*2)}

    var horiz=H*0.45;
    X.fillStyle=T.bld1;
    for(var i=0;i<35;i++){
        var bx=(i*85+20)%(W+200)-100;
        var bh=30+Math.sin(i*2.3)*25+Math.cos(i*1.7)*15;
        X.fillRect(bx,horiz-bh,50,bh+300);
    }
    X.fillStyle=T.bld2;
    for(var i=0;i<25;i++){
        var bx=(i*120+60)%(W+200)-100;
        var bh=40+Math.cos(i*3.1)*30;
        X.fillRect(bx,horiz-bh,65,bh+300);
    }

    // road lights for desert/ice
    if(curTrack===2||curTrack===3){
        X.fillStyle=T.edge;X.shadowColor=T.edge;
        for(var i=5;i<30;i+=3){
            var lz=i*SEG;
            var lp=proj(0,0,lz);
            if(lp.s>0.01){
                X.shadowBlur=8*lp.s;
                X.fillRect(W/2-RD_W*lp.s*1.1-3,lp.y-20*lp.s,6*lp.s,20*lp.s);
                X.fillRect(W/2+RD_W*lp.s*1.1-3,lp.y-20*lp.s,6*lp.s,20*lp.s);
            }
        }
        X.shadowBlur=0;
    }

    var base=car.pos|0;
    var roadX=W/2;

    for(var i=30;i>=0;i--){
        var idx=((base+i)%track.length+track.length)%track.length;
        var idx2=((base+i+1)%track.length+track.length)%track.length;
        var sg=track[idx];
        var sg2=track[idx2];
        var z=i*SEG;
        if(z<=0)continue;

        var p1=proj(0,sg.h,z);
        var p2=proj(0,sg2.h,z+SEG);

        var y1=p1.y,y2=p2.y;
        var w1=RD_W*p1.s;
        var w2=RD_W*p2.s;
        var ox1=car.x*w1*0.5;
        var ox2=car.x*w2*0.5;

        X.fillStyle=sg.col;
        X.beginPath();
        X.moveTo(roadX-ox1-w1,y1);X.lineTo(roadX-ox1+w1,y1);
        X.lineTo(roadX-ox2+w2,y2);X.lineTo(roadX-ox2-w2,y2);
        X.closePath();X.fill();

        var rw1=w1*1.08,rw2=w2*1.08;
        X.fillStyle=idx%4<2?T.curbs[0]:T.curbs[1];
        X.beginPath();
        X.moveTo(roadX-ox1-rw1,y1);X.lineTo(roadX-ox1-w1,y1);
        X.lineTo(roadX-ox2-w2,y2);X.lineTo(roadX-ox2-rw2,y2);
        X.closePath();X.fill();
        X.beginPath();
        X.moveTo(roadX-ox1+w1,y1);X.lineTo(roadX-ox1+rw1,y1);
        X.lineTo(roadX-ox2+rw2,y2);X.lineTo(roadX-ox2+w2,y2);
        X.closePath();X.fill();

        X.strokeStyle=idx%6<3?'#1a1a4a':'#0a0a2a';
        X.lineWidth=2*p2.s;
        X.beginPath();X.moveTo(roadX-ox1,y1);X.lineTo(roadX-ox2,y2);X.stroke();

        X.strokeStyle=T.edge;X.lineWidth=2.5*p2.s;
        X.shadowColor=T.edge;X.shadowBlur=10*p2.s;
        X.beginPath();X.moveTo(roadX-ox1-w1,y1);X.lineTo(roadX-ox2-w2,y2);X.stroke();
        X.beginPath();X.moveTo(roadX-ox1+w1,y1);X.lineTo(roadX-ox2+w2,y2);X.stroke();
        X.shadowBlur=0;

        if(sg.b){
            X.fillStyle='#ff0';X.shadowColor='#ff0';X.shadowBlur=18;
            var mz=w1*0.12;
            X.fillRect(roadX-ox1-mz,y1-3,mz*2,6);
            var mz2=w2*0.12;
            X.fillRect(roadX-ox2-mz2,y2-2,mz2*2,5);
            X.shadowBlur=0;
        }

        rivals.forEach(function(r){
            var ri=((r.pos|0)%track.length+track.length)%track.length;
            if(ri===idx)drawRival(roadX-ox1+r.x*w1,y1,p2.s,r);
        });

        if(sg.fl&&w1>2){
            var fx=roadX-ox1+w1+8*p2.s;
            var poleH=60*p2.s;
            X.strokeStyle='#888';X.lineWidth=1.5*p2.s;
            X.beginPath();X.moveTo(fx,y1);X.lineTo(fx,y1-poleH);X.stroke();
            X.fillStyle=sg.fc;X.shadowColor=sg.fc;X.shadowBlur=6*p2.s;
            X.beginPath();X.moveTo(fx,y1-poleH);
            X.lineTo(fx+18*p2.s,y1-poleH+8*p2.s);
            X.lineTo(fx,y1-poleH+16*p2.s);X.closePath();X.fill();
            X.shadowBlur=0;
        }
    }

    parts.forEach(function(p){
        X.globalAlpha=p.life/p.ml;X.fillStyle=p.col;
        X.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
    });
    X.globalAlpha=1;

    var hlGrad=X.createRadialGradient(W/2,H*0.85,10,W/2,H*0.55,H*0.5);
    hlGrad.addColorStop(0,'rgba(180,220,255,0.12)');
    hlGrad.addColorStop(0.5,'rgba(100,160,255,0.06)');
    hlGrad.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=hlGrad;X.fillRect(0,H*0.3,W,H*0.7);

    X.save();
    X.globalAlpha=0.04+car.spd/car.max*0.04;X.fillStyle='#aaccff';
    X.beginPath();
    X.moveTo(W/2-20,H-125);X.lineTo(W/2-180,H*0.35);
    X.lineTo(W/2+180,H*0.35);X.lineTo(W/2+20,H-125);
    X.closePath();X.fill();X.restore();

    drawDrone();
    drawDashboard();

    if(car.drift&&car.dt>8){
        X.fillStyle=car.dd>0?'#f80':T.edge;
        X.shadowColor=X.fillStyle;X.shadowBlur=20;
        X.font='bold 22px Arial';X.textAlign='center';
        X.fillText('DRIFT'+(car.dt>28?' PERFECT!':''),W/2,H-170);X.shadowBlur=0;
    }
    if(car.boost){
        X.fillStyle=T.edge;X.shadowColor=T.edge;X.shadowBlur=30;
        X.font='bold 26px Arial';X.textAlign='center';
        X.fillText('BOOST!',W/2,H-190);X.shadowBlur=0;
    }

    X.textAlign='left';
    X.fillStyle=T.edge;X.shadowColor=T.edge;X.shadowBlur=8;X.font='15px Arial';
    X.fillText(T.name,15,20);
    X.fillText('LAP: '+Math.min(lap,LAPS)+' / '+LAPS,15,40);
    X.fillText('TIME: '+fmt(lapTime),15,58);
    X.fillText('BEST: '+(bestLap?fmt(bestLap):'--:--'),15,76);
    X.fillText('SPEED: '+Math.round(car.spd*22)+' km/h',15,94);
    X.shadowBlur=0;

    X.fillStyle='#111';X.fillRect(15,104,200,12);
    X.strokeStyle=T.edge;X.lineWidth=1;X.strokeRect(15,104,200,12);
    X.fillStyle=T.edge;X.fillRect(15,104,Math.min(100,boost)*2,12);

    X.fillStyle='#111';X.fillRect(15,122,200,10);
    X.strokeStyle='#0f0';X.lineWidth=1;X.strokeRect(15,122,200,10);
    X.fillStyle='#0f0';X.fillRect(15,122,Math.max(0,car.shield)*2,10);

    if(shake>0)X.restore();
}

function drawDashboard(){
    var T=TRACKS[curTrack];
    var dy=H-120,dw=420,dx=W/2-dw/2;
    X.fillStyle='#0c0c0c';X.fillRect(dx,dy,dw,120);
    X.strokeStyle='#222';X.lineWidth=1;X.strokeRect(dx,dy,dw,120);

    X.fillStyle='#111';
    X.beginPath();X.arc(dx+60,dy+50,30,0,Math.PI*2);X.fill();
    X.strokeStyle=T.edge;X.lineWidth=2;X.stroke();
    X.beginPath();X.arc(dx+dw-60,dy+50,30,0,Math.PI*2);X.fill();
    X.strokeStyle='#f0f';X.stroke();

    var na=-Math.PI*0.75+(car.spd/car.max)*Math.PI*1.5;
    X.strokeStyle=T.edge;X.lineWidth=2;
    X.beginPath();X.moveTo(dx+60,dy+50);
    X.lineTo(dx+60+Math.cos(na)*22,dy+50+Math.sin(na)*22);X.stroke();

    var ra=-Math.PI*0.75+(car.spd/car.max)*Math.PI*1.2;
    X.strokeStyle='#f0f';X.lineWidth=2;
    X.beginPath();X.moveTo(dx+dw-60,dy+50);
    X.lineTo(dx+dw-60+Math.cos(ra)*22,dy+50+Math.sin(ra)*22);X.stroke();

    X.fillStyle=T.edge;X.font='9px Arial';X.textAlign='center';
    X.fillText('km/h',dx+60,dy+70);
    X.fillStyle='#f0f';X.fillText('RPM',dx+dw-60,dy+70);
    X.fillStyle=T.edge;X.font='bold 14px Arial';
    X.fillText(Math.round(car.spd*22),dx+60,dy+55);

    var swx=W/2,swy=dy+30,swr=42;
    X.save();X.translate(swx,swy);X.rotate(car.st*2.5);

    X.strokeStyle='#333';X.lineWidth=6;
    X.beginPath();X.arc(0,0,swr,0,Math.PI*2);X.stroke();
    X.strokeStyle=T.edge;X.lineWidth=2;X.shadowColor=T.edge;X.shadowBlur=10;
    X.beginPath();X.arc(0,0,swr,0,Math.PI*2);X.stroke();X.shadowBlur=0;

    X.strokeStyle='#444';X.lineWidth=3;
    for(var a=0;a<3;a++){
        var ag=a*Math.PI*2/3;
        X.beginPath();X.moveTo(0,0);X.lineTo(Math.cos(ag)*swr,Math.sin(ag)*swr);X.stroke();
    }
    X.fillStyle=T.edge;X.shadowColor=T.edge;X.shadowBlur=8;
    X.beginPath();X.arc(0,0,6,0,Math.PI*2);X.fill();X.shadowBlur=0;
    X.restore();
}

function drawRival(rx,ry,s,r){
    X.save();X.translate(rx,ry);X.scale(s*0.85,s*0.85);
    X.fillStyle=r.col;X.shadowColor=r.col;X.shadowBlur=12;
    X.beginPath();X.moveTo(0,-18);X.lineTo(-20,4);X.lineTo(-14,8);
    X.lineTo(14,8);X.lineTo(20,4);X.closePath();X.fill();X.shadowBlur=0;
    X.fillStyle='#fff';X.beginPath();X.arc(0,-3,4,0,Math.PI*2);X.fill();
    X.fillStyle=r.col;X.shadowColor=r.col;X.shadowBlur=8;
    X.beginPath();X.ellipse(0,9,6,2,0,0,Math.PI*2);X.fill();X.shadowBlur=0;
    X.restore();
}

var droneAng=0;
function drawDrone(){
    droneAng+=0.08;
    var dx=W/2+Math.sin(droneAng)*60;
    var dy=H*0.28+Math.cos(droneAng*1.3)*15;
    var ds=0.7+car.spd/car.max*0.3;

    X.save();X.globalAlpha=0.03;X.fillStyle=TRACKS[curTrack].edge;
    X.beginPath();X.moveTo(dx,dy+6);X.lineTo(dx-40*ds,H*0.5);
    X.lineTo(dx+40*ds,H*0.5);X.closePath();X.fill();X.restore();

    X.fillStyle='#222';X.beginPath();X.ellipse(dx,dy,10*ds,4*ds,0,0,Math.PI*2);X.fill();
    X.strokeStyle='#444';X.lineWidth=1.5;
    X.beginPath();X.moveTo(dx-10*ds,dy);X.lineTo(dx-16*ds,dy-3*ds);X.stroke();
    X.beginPath();X.moveTo(dx+10*ds,dy);X.lineTo(dx+16*ds,dy-3*ds);X.stroke();
    X.strokeStyle='#666';X.lineWidth=1;
    var ra=performance.now()*0.02;
    X.beginPath();X.arc(dx-16*ds,dy-3*ds,5*ds,ra,ra+Math.PI*1.5);X.stroke();
    X.beginPath();X.arc(dx+16*ds,dy-3*ds,5*ds,ra+1,ra+Math.PI*1.5+1);X.stroke();
    X.fillStyle=TRACKS[curTrack].edge;X.shadowColor=TRACKS[curTrack].edge;X.shadowBlur=12;
    X.beginPath();X.arc(dx,dy+3,2*ds,0,Math.PI*2);X.fill();X.shadowBlur=0;
    if(Math.sin(performance.now()*0.005)>0.7){
        X.fillStyle='#f44';X.shadowColor='#f44';X.shadowBlur=8;
        X.beginPath();X.arc(dx-8*ds,dy,1.5,0,Math.PI*2);X.fill();X.shadowBlur=0;
    }
}

var lastT=0;
function loop(t){
    var dt=Math.min(t-lastT,50);lastT=t;
    upd(dt);draw();
    if(running)requestAnimationFrame(loop);
}

addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',function(e){keys[e.code]=false});

var tch=null;
C.addEventListener('touchstart',function(e){e.preventDefault();tch={x:e.touches[0].clientX,y:e.touches[0].clientY}});
C.addEventListener('touchmove',function(e){
    e.preventDefault();if(!tch)return;
    var t=e.touches[0],dx=t.clientX-tch.x,dy=t.clientY-tch.y;
    keys.ArrowLeft=dx<-25;keys.ArrowRight=dx>25;
    keys.ArrowUp=dy<-25;keys.ArrowDown=dy>25;
    keys.ShiftLeft=Math.abs(dx)>35||Math.abs(dy)>35;
});
C.addEventListener('touchend',function(){
    keys.ArrowLeft=keys.ArrowRight=keys.ArrowUp=keys.ArrowDown=keys.ShiftLeft=false;tch=null;
});

function drawMenu(){
    running=false;
    X.fillStyle='#050510';X.fillRect(0,0,W,H);

    // stars
    X.fillStyle='#fff';
    for(var i=0;i<60;i++){
        X.globalAlpha=0.2+Math.sin(performance.now()*0.001+i)*0.2;
        X.fillRect((i*137+50)%W,(i*97+20)%(H*0.3),1.5,1.5);
    }
    X.globalAlpha=1;

    X.fillStyle='#0ff';X.shadowColor='#0ff';X.shadowBlur=30;
    X.font='bold 44px Arial';X.textAlign='center';
    X.fillText('NEON VELOCITY 3D',W/2,60);
    X.shadowBlur=0;

    X.fillStyle='#555';X.font='14px Arial';
    X.fillText('SELECT TRACK',W/2,95);

    var tw=220,th=100,gap=20;
    var totalW=TRACKS.length*tw+(TRACKS.length-1)*gap;
    var startX=(W-totalW)/2;
    var ty=130;

    for(var i=0;i<TRACKS.length;i++){
        var T=TRACKS[i];
        var tx=startX+i*(tw+gap);
        var hover=mouseX>tx&&mouseX<tx+tw&&mouseY>ty&&mouseY<th+ty;

        X.fillStyle=hover?'#111':'#0a0a14';
        X.fillRect(tx,ty,tw,th);
        X.strokeStyle=hover?T.edge:'#333';
        X.lineWidth=hover?2:1;
        X.strokeRect(tx,ty,tw,th);

        X.fillStyle=T.edge;X.shadowColor=T.edge;X.shadowBlur=hover?15:5;
        X.font='bold 18px Arial';X.textAlign='center';
        X.fillText(T.name,tx+tw/2,ty+35);
        X.shadowBlur=0;

        X.fillStyle='#888';X.font='13px Arial';
        X.fillText(T.sub,tx+tw/2,ty+55);

        // mini preview line
        X.strokeStyle=T.edge;X.lineWidth=2;X.globalAlpha=0.5;
        X.beginPath();
        for(var j=0;j<40;j++){
            var d=T.gen(j);
            var px=tx+20+j*(tw-40)/40;
            var py=ty+75+d.c*2;
            if(j===0)X.moveTo(px,py);else X.lineTo(px,py);
        }
        X.stroke();X.globalAlpha=1;

        if(hover){
            X.fillStyle=T.edge;X.font='12px Arial';
            X.fillText('CLICK TO RACE',tx+tw/2,ty+th+18);
        }
    }

    X.fillStyle='#444';X.font='13px Arial';X.textAlign='center';
    X.fillText('W/UP - gas  |  S/DOWN - brake  |  A/D - steer  |  SHIFT - drift  |  SPACE - boost',W/2,H-30);

    menuHover=-1;
    for(var i=0;i<TRACKS.length;i++){
        var tx2=startX+i*(tw+gap);
        if(mouseX>tx2&&mouseX<tx2+tw&&mouseY>ty&&mouseY<th+ty)menuHover=i;
    }
}

var mouseX=0,mouseY=0,menuHover=-1;
C.addEventListener('mousemove',function(e){mouseX=e.clientX;mouseY=e.clientY;drawMenu()});
C.addEventListener('click',function(e){
    var tw=220,th=100,gap=20;
    var totalW=TRACKS.length*tw+(TRACKS.length-1)*gap;
    var startX=(W-totalW)/2;
    var ty=130;
    for(var i=0;i<TRACKS.length;i++){
        var tx=startX+i*(tw+gap);
        if(e.clientX>tx&&e.clientX<tx+tw&&e.clientY>ty&&e.clientY<th+ty){
            curTrack=i;C.onclick=null;go();return;
        }
    }
});

drawMenu();
</script>
</body>
</html>
