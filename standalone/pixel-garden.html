<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantagotchi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',sans-serif;color:#e6edf3}
.app{display:flex;gap:16px;padding:20px;max-width:900px}
.left-panel{flex:1;display:flex;flex-direction:column;gap:12px}
.right-panel{width:340px;display:flex;flex-direction:column;gap:12px}

.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px}
.card-title{font-size:0.7em;text-transform:uppercase;letter-spacing:1.5px;color:#8b949e;margin-bottom:10px;text-align:center}

.garden{height:380px;display:flex;justify-content:center;align-items:flex-end;position:relative;overflow:hidden}
.garden svg{position:absolute;bottom:20px;width:300px;height:340px}

.robot-box{display:flex;flex-direction:column;align-items:center;gap:8px}
.robot{font-size:48px;line-height:1;animation:robotBob 2s ease-in-out infinite}
@keyframes robotBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.robot-speech{background:#1f6feb22;border:1px solid #1f6feb;border-radius:10px;padding:8px 14px;font-size:0.82em;color:#79c0ff;max-width:260px;text-align:center;position:relative}
.robot-speech::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #1f6feb33}

.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gauge{text-align:center}
.gauge svg{width:80px;height:50px}
.gauge-label{font-size:0.65em;color:#8b949e;margin-top:2px}
.gauge-val{font-size:0.8em;font-weight:bold;color:#e6edf3}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-icon{font-size:1.2em;width:24px;text-align:center}
.bar-info{flex:1}
.bar-name{font-size:0.7em;color:#8b949e}
.bar-track{background:#21262d;border-radius:6px;height:10px;overflow:hidden;margin-top:3px}
.bar-fill{height:100%;border-radius:6px;transition:width .4s}
.bar-val{font-size:0.75em;color:#e6edf3;font-weight:bold;width:36px;text-align:right}

.flask-area{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:10px}
.flask-svg{width:100px;height:140px}
.flask-info{text-align:center}
.flask-count{font-size:2.4em;font-weight:bold;color:#f87171;line-height:1}
.flask-label{font-size:0.7em;color:#8b949e;margin-top:2px}
.flask-cap{font-size:0.65em;color:#f87171;margin-top:6px}

.diet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.diet-btn{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:10px 8px;cursor:pointer;text-align:center;transition:all .15s}
.diet-btn:hover{border-color:#58a6ff;background:#1a2332}
.diet-btn:active{transform:scale(0.96)}
.diet-btn .emoji{font-size:1.5em}
.diet-btn .name{font-size:0.65em;color:#8b949e;margin-top:2px}
.diet-btn.cooldown{opacity:0.4;pointer-events:none}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act-btn{padding:12px;border:none;border-radius:10px;font-size:0.85em;font-weight:600;cursor:pointer;transition:all .15s;color:#fff}
.act-btn:hover{filter:brightness(1.2);transform:translateY(-1px)}
.act-btn:active{transform:translateY(0)}
.act-btn.green{background:#238636}
.act-btn.blue{background:#1f6feb}
.act-btn.orange{background:#bd561d}
.act-btn.red{background:#da3633}
.act-btn.purple{background:#8957e5}

.sparkle{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:spk .8s ease-out forwards}
@keyframes spk{0%{opacity:1;transform:scale(1) translate(0,0)}100%{opacity:0;transform:scale(0) translate(var(--dx),var(--dy))}}

.stage-badge{text-align:center;padding:4px 12px;background:#21262d;border-radius:20px;font-size:0.75em;color:#58a6ff;border:1px solid #1f6feb44}
</style>
</head>
<body>
<div class="app">
  <div class="left-panel">
    <div class="card garden" id="garden">
      <svg id="plantSvg" viewBox="0 0 300 340">
        <defs>
          <linearGradient id="stemG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#40916c"/><stop offset="100%" stop-color="#2d6a4f"/></linearGradient>
          <radialGradient id="leafG"><stop offset="0%" stop-color="#52b788"/><stop offset="100%" stop-color="#2d6a4f"/></radialGradient>
          <radialGradient id="leafG2"><stop offset="0%" stop-color="#74c69d"/><stop offset="100%" stop-color="#40916c"/></radialGradient>
          <radialGradient id="flowerG"><stop offset="0%" stop-color="#f8f9fa"/><stop offset="60%" stop-color="#e8d5f5"/><stop offset="100%" stop-color="#c084fc"/></radialGradient>
          <radialGradient id="flowerCenter"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f59e0b"/></radialGradient>
          <radialGradient id="berryG"><stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#dc2626"/></radialGradient>
          <radialGradient id="berryG2"><stop offset="0%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></radialGradient>
          <radialGradient id="potG" cx="0.5" cy="0.3"><stop offset="0%" stop-color="#c0956c"/><stop offset="100%" stop-color="#8b5e3c"/></radialGradient>
        </defs>
        <!-- soil mound -->
        <ellipse cx="150" cy="305" rx="55" ry="12" fill="#3d2b1f"/>
        <ellipse cx="150" cy="303" rx="50" ry="8" fill="#5c3d2e"/>
        <!-- pot -->
        <rect x="110" y="290" width="80" height="45" rx="4" fill="url(#potG)"/>
        <rect x="103" y="285" width="94" height="14" rx="4" fill="#c9a07a"/>
        <rect x="130" y="300" width="40" height="12" rx="3" fill="#a0714f" opacity="0.5"/>
        <!-- stem -->
        <path id="stemPath" d="M150,290 Q150,290 150,290" stroke="url(#stemG)" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- leaves group -->
        <g id="leavesGroup"></g>
        <!-- flowers group -->
        <g id="flowersGroup"></g>
        <!-- berries group -->
        <g id="berriesGroup"></g>
        <!-- seed (visible at start) -->
        <g id="seedGroup">
          <ellipse cx="150" cy="296" rx="6" ry="4" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
          <path d="M148,294 Q150,291 152,294" fill="#6b5335" opacity="0.6"/>
        </g>
      </svg>
    </div>
    <div class="stage-badge" id="stageBadge">Seed</div>
  </div>

  <div class="right-panel">
    <div class="card robot-box">
      <div class="robot" id="robotEmoji">🤖</div>
      <div class="robot-speech" id="speech">I'm ready to take care of your plant!</div>
    </div>

    <div class="card">
      <div class="card-title">Environment Sensors</div>
      <div class="gauges" id="gauges"></div>
    </div>

    <div class="card">
      <div class="card-title">Collection Flask</div>
      <div class="flask-area">
        <svg class="flask-svg" viewBox="0 0 100 140">
          <defs>
            <clipPath id="flaskClip">
              <path d="M30,45 L30,60 Q10,80 10,100 Q10,130 50,130 Q90,130 90,100 Q90,80 70,60 L70,45 Z"/>
            </clipPath>
            <linearGradient id="flaskGlass" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ffffff15"/>
              <stop offset="50%" stop-color="#ffffff08"/>
              <stop offset="100%" stop-color="#ffffff20"/>
            </linearGradient>
            <linearGradient id="flaskLiquid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#dc262622"/>
              <stop offset="100%" stop-color="#dc262644"/>
            </linearGradient>
          </defs>
          <!-- neck -->
          <rect x="30" y="20" width="40" height="30" rx="2" fill="none" stroke="#8b949e" stroke-width="1.5" opacity="0.4"/>
          <!-- cork -->
          <rect x="32" y="12" width="36" height="12" rx="4" fill="#a0714f"/>
          <rect x="34" y="15" width="32" height="3" rx="1" fill="#c9a07a" opacity="0.5"/>
          <!-- flask body -->
          <path d="M30,45 L30,60 Q10,80 10,100 Q10,130 50,130 Q90,130 90,100 Q90,80 70,60 L70,45 Z" fill="#ffffff08" stroke="#8b949e" stroke-width="1.5" opacity="0.5"/>
          <!-- glass shine -->
          <path d="M30,45 L30,60 Q10,80 10,100 Q10,115 25,125" fill="none" stroke="#ffffff18" stroke-width="2"/>
          <!-- liquid fill area (dynamic) -->
          <g clip-path="url(#flaskClip)">
            <rect id="flaskLiquid" x="10" y="130" width="80" height="0" fill="url(#flaskLiquid)"/>
            <!-- berries inside flask -->
            <g id="flaskBerries"></g>
          </g>
          <!-- measurement lines -->
          <line x1="13" y1="90" x2="20" y2="90" stroke="#8b949e44" stroke-width="1"/>
          <line x1="13" y1="100" x2="20" y2="100" stroke="#8b949e44" stroke-width="1"/>
          <line x1="13" y1="110" x2="20" y2="110" stroke="#8b949e44" stroke-width="1"/>
          <line x1="13" y1="120" x2="20" y2="120" stroke="#8b949e44" stroke-width="1"/>
          <text x="7" y="91" font-size="5" fill="#8b949e44" text-anchor="end">25</text>
          <text x="7" y="101" font-size="5" fill="#8b949e44" text-anchor="end">50</text>
          <text x="7" y="111" font-size="5" fill="#8b949e44" text-anchor="end">75</text>
          <text x="7" y="121" font-size="5" fill="#8b949e44" text-anchor="end">100</text>
        </svg>
        <div class="flask-info">
          <div class="flask-count" id="flaskCount">0</div>
          <div class="flask-label">berries collected</div>
          <div class="flask-cap" id="flaskCap"></div>
        </div>
      </div>
      <div style="text-align:center;font-size:0.7em;color:#8b949e" id="berryOnPlant">0 berries on plant</div>
    </div>

    <div class="card">
      <div class="bars">
        <div class="bar-row"><div class="bar-icon">🌱</div><div class="bar-info"><div class="bar-name">Growth</div><div class="bar-track"><div class="bar-fill" id="barGrowth" style="width:0%;background:linear-gradient(90deg,#2d6a4f,#4ecca3)"></div></div></div><div class="bar-val" id="valGrowth">0%</div></div>
        <div class="bar-row"><div class="bar-icon">💚</div><div class="bar-info"><div class="bar-name">Health</div><div class="bar-track"><div class="bar-fill" id="barHealth" style="width:100%;background:linear-gradient(90deg,#b91c1c,#ef4444)"></div></div></div><div class="bar-val" id="valHealth">100%</div></div>
        <div class="bar-row"><div class="bar-icon">🍽️</div><div class="bar-info"><div class="bar-name">Hunger</div><div class="bar-track"><div class="bar-fill" id="barHunger" style="width:0%;background:linear-gradient(90deg,#d97706,#facc15)"></div></div></div><div class="bar-val" id="valHunger">0%</div></div>
        <div class="bar-row"><div class="bar-icon">💧</div><div class="bar-info"><div class="bar-name">Thirst</div><div class="bar-track"><div class="bar-fill" id="barThirst" style="width:0%;background:linear-gradient(90deg,#1d4ed8,#60a5fa)"></div></div></div><div class="bar-val" id="valThirst">0%</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Diet</div>
      <div class="diet-grid" id="dietGrid"></div>
    </div>

    <div class="card">
      <div class="card-title">Actions</div>
      <div class="actions">
        <button class="act-btn blue" onclick="doWater()">💧 Water</button>
        <button class="act-btn green" onclick="doLight()">☀️ Sunlight</button>
        <button class="act-btn orange" onclick="doFertilize()">🧪 Fertilize</button>
        <button class="act-btn purple" onclick="doBoost()">⚡ Boost</button>
        <button class="act-btn red" onclick="doCollect()" style="background:#c026d3">🫙 Collect</button>
        <button class="act-btn red" onclick="doRestart()">🔄 New Seed</button>
      </div>
    </div>
  </div>
</div>

<script>
const P = {
  growth: 0, health: 100, hunger: 0, thirst: 0,
  accelerated: false, accelPoint: 60, accelCount: 0,
  stage: 0, alive: true, berries: 0, berryYield: 0, pendingBerries: 0,
  light: 50, temp: 50, humidity: 50, soilNutrients: 50,
  lightDir: 1, tempDir: -1, humDir: 1, soilDir: -1,
  lastFeed: 0, lastWater: 0
};

const STAGES = ['Seed', 'Sprout', 'Leaves', 'Stem', 'Bud', 'Bloom', 'Fruiting'];
const THRESHOLDS = [0, 5, 15, 30, 50, 70, 88];

const FOODS = [
  { emoji: '🌾', name: 'Grain', growth: 3, hunger: -20, nutrient: 5, cooldown: 0 },
  { emoji: '🍎', name: 'Fruit', growth: 2, hunger: -25, nutrient: 8, cooldown: 0 },
  { emoji: '🧪', name: 'Vitamin', growth: 4, hunger: -5, nutrient: 15, cooldown: 0 },
  { emoji: '🍬', name: 'Sugar', growth: 6, hunger: -30, nutrient: -5, cooldown: 0 },
  { emoji: '🥬', name: 'Leaves', growth: 1, hunger: -15, nutrient: 3, cooldown: 0 },
  { emoji: '🍄', name: 'Mushroom', growth: 3, hunger: -10, nutrient: 12, cooldown: 0 },
];

const ROBOT_LINES = {
  happy: ["Looking great today!", "Healthy plant, happy robot!", "You're doing amazing!"],
  hungry: ["Feed me please!", "I'm getting hungry...", "Some food would be nice!"],
  thirsty: ["Water please!", "I need a drink!", "So dry..."],
  sick: ["I don't feel good...", "Help me please!", "Need medicine..."],
  grow: ["I'm growing!", "New leaves incoming!", "Getting bigger!"],
  berry: ["I made a berry!", "Collect me!", "Berry ready!"],
  accel: ["Turbo mode!", "Wow, so fast!", "Accelerating!"],
  idle: ["Waiting...", "Just chilling.", "Growing slowly..."],
  dead: ["I'm gone...", "You forgot me..."],
  flower: ["I'm blooming!", "How pretty!", "Flower power!"]
};

let svgLeaves = [];
let svgFlowers = [];
let svgBerries = [];
let foodCooldowns = {};

function init() {
  buildGauges();
  buildDiet();
  update();
  setInterval(tick, 600);
}

function buildGauges() {
  const g = document.getElementById('gauges');
  const sensors = [
    { id: 'light', label: 'Light', icon: '☀️', color: '#fbbf24' },
    { id: 'temp', label: 'Temp', icon: '🌡️', color: '#f87171' },
    { id: 'humidity', label: 'Humidity', icon: '💧', color: '#60a5fa' },
    { id: 'soilNutrients', label: 'Soil', icon: '🪴', color: '#86efac' }
  ];
  g.innerHTML = sensors.map(s => `
    <div class="gauge">
      <svg viewBox="0 0 100 60">
        <path d="M10,55 A40,40 0 0,1 90,55" fill="none" stroke="#21262d" stroke-width="8" stroke-linecap="round"/>
        <path d="M10,55 A40,40 0 0,1 90,55" fill="none" stroke="${s.color}22" stroke-width="8" stroke-linecap="round"/>
        <line id="needle_${s.id}" x1="50" y1="55" x2="50" y2="18" stroke="${s.color}" stroke-width="3" stroke-linecap="round" transform="rotate(-90,50,55)"/>
        <circle cx="50" cy="55" r="4" fill="${s.color}"/>
        <text x="50" y="52" text-anchor="middle" font-size="10" fill="#8b949e">${s.icon}</text>
      </svg>
      <div class="gauge-val" id="gval_${s.id}">50%</div>
      <div class="gauge-label">${s.label}</div>
    </div>
  `).join('');
}

function buildDiet() {
  const d = document.getElementById('dietGrid');
  d.innerHTML = FOODS.map((f, i) => `
    <div class="diet-btn" id="food_${i}" onclick="feedFood(${i})">
      <div class="emoji">${f.emoji}</div>
      <div class="name">${f.name}</div>
    </div>
  `).join('');
}

function feedFood(i) {
  if (!P.alive) return;
  if (foodCooldowns[i] > 0) return;
  const f = FOODS[i];
  P.hunger = Math.max(0, P.hunger + f.hunger);
  P.growth = Math.min(100, P.growth + f.growth);
  P.soilNutrients = Math.min(100, Math.max(0, P.soilNutrients + f.nutrient));
  P.health = Math.min(100, P.health + 2);
  P.lastFeed = Date.now();
  foodCooldowns[i] = 8;
  sparkles(150, 250, '#fbbf24');
  speak('hungry');
  update();
}

function doWater() {
  if (!P.alive) return;
  P.thirst = Math.max(0, P.thirst - 40);
  P.health = Math.min(100, P.health + 8);
  P.humidity = Math.min(100, P.humidity + 20);
  P.lastWater = Date.now();
  sparkles(150, 280, '#60a5fa');
  speak('thirsty');
  update();
}

function doLight() {
  if (!P.alive) return;
  P.light = Math.min(100, P.light + 25);
  P.health = Math.min(100, P.health + 3);
  if (P.stage >= 2) P.growth = Math.min(100, P.growth + 1);
  sparkles(150, 200, '#fbbf24');
  update();
}

function doFertilize() {
  if (!P.alive) return;
  P.soilNutrients = Math.min(100, P.soilNutrients + 30);
  P.growth = Math.min(100, P.growth + 3);
  P.health = Math.min(100, P.health + 4);
  sparkles(150, 290, '#86efac');
  speak('grow');
  update();
}

function doBoost() {
  if (!P.alive) return;
  if (P.growth >= P.accelPoint) { speak('idle'); update(); return; }
  P.growth = P.accelPoint;
  P.accelerated = true;
  P.accelCount++;
  P.lastFeed = Date.now();
  for (let i = 0; i < 5; i++) setTimeout(() => sparkles(130 + Math.random() * 40, 150 + Math.random() * 80, '#c084fc'), i * 100);
  speak('accel');
  update();
}

function doCollect() {
  if (!P.alive) return;
  if (P.pendingBerries <= 0) {
    speak('idle');
    update();
    return;
  }
  const collected = P.pendingBerries;
  P.berries += collected;
  P.pendingBerries = 0;
  sparkles(150, 180, '#f87171');
  sparkles(150, 190, '#f97316');
  speak('berry');
  update();
}

function doRestart() {
  Object.assign(P, {
    growth: 0, health: 100, hunger: 0, thirst: 0,
    accelerated: false, accelCount: 0, stage: 0,
    alive: true, berries: 0, berryYield: 0, pendingBerries: 0,
    light: 50, temp: 50, humidity: 50, soilNutrients: 50,
    lightDir: 1, tempDir: -1, humDir: 1, soilDir: -1,
    lastFeed: 0, lastWater: 0
  });
  svgLeaves = []; svgFlowers = []; svgBerries = [];
  foodCooldowns = {};
  speak('idle');
  update();
}

function speak(category) {
  const lines = ROBOT_LINES[category] || ROBOT_LINES.idle;
  document.getElementById('speech').textContent = lines[Math.floor(Math.random() * lines.length)];
}

function sparkles(x, y, color) {
  const g = document.getElementById('garden');
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 30;
    s.style.cssText = `left:${x}px;top:${y}px;background:${color};--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist - 30}px`;
    g.appendChild(s);
    setTimeout(() => s.remove(), 800);
  }
}

function calcStage() {
  let s = 0;
  for (let i = THRESHOLDS.length - 1; i >= 0; i--) {
    if (P.growth >= THRESHOLDS[i]) { s = i; break; }
  }
  return s;
}

function stemXAt(t, sway) {
  return 150 + sway * (2 * t - 1.5 * t * t);
}

function updatePlant() {
  const stem = document.getElementById('stemPath');
  const seedG = document.getElementById('seedGroup');
  const leavesG = document.getElementById('leavesGroup');
  const flowersG = document.getElementById('flowersGroup');
  const berriesG = document.getElementById('berriesGroup');

  const stemH = Math.max(0, (P.growth / 100) * 230);
  const baseY = 288;

  seedG.style.opacity = P.growth < 5 ? 1 : Math.max(0, 1 - (P.growth - 3) / 3);

  if (P.growth >= 5) {
    const top = baseY - stemH;
    const sway = Math.sin(Date.now() / 2000) * (stemH > 100 ? 8 : 3);
    stem.setAttribute('d', `M150,${baseY} Q${150 + sway},${baseY - stemH * 0.5} ${150 + sway * 0.5},${top}`);
    stem.setAttribute('stroke-width', P.growth > 30 ? 6 : 4);

    const targetLeafCount = Math.min(8, Math.floor((P.growth - 5) / 10) + 1);

    leavesG.innerHTML = '';
    for (let i = 0; i < targetLeafCount; i++) {
      const progress = (i + 1) / (targetLeafCount + 1);
      const leafY = baseY - stemH * (0.15 + progress * 0.75);
      const t = Math.max(0, Math.min(1, (baseY - leafY) / stemH));
      const sx = stemXAt(t, sway);

      const side = i % 2 === 0 ? -1 : 1;
      const leafSize = 14 + Math.min(20, P.growth * 0.28);
      const angle = side * (28 + Math.sin(i * 1.5) * 12);
      const lx = sx + side * 3;

      const leaf = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      leaf.setAttribute('transform', `translate(${sx},${leafY}) rotate(${angle})`);

      const leafPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const w = leafSize;
      const h = leafSize * 0.5;
      leafPath.setAttribute('d', `M0,0 Q${w * 0.25},${-h} ${w},0 Q${w * 0.25},${h} 0,0`);
      leafPath.setAttribute('fill', i % 3 === 0 ? 'url(#leafG2)' : 'url(#leafG)');
      leafPath.setAttribute('stroke', '#2d6a4f');
      leafPath.setAttribute('stroke-width', '0.8');

      const vein = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      vein.setAttribute('x1', '3');
      vein.setAttribute('y1', '0');
      vein.setAttribute('x2', (w - 3) + '');
      vein.setAttribute('y2', '0');
      vein.setAttribute('stroke', '#2d6a4f55');
      vein.setAttribute('stroke-width', '1');

      const subV1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      subV1.setAttribute('x1', w * 0.3 + '');
      subV1.setAttribute('y1', '0');
      subV1.setAttribute('x2', w * 0.5 + '');
      subV1.setAttribute('y2', -h * 0.5 + '');
      subV1.setAttribute('stroke', '#2d6a4f33');
      subV1.setAttribute('stroke-width', '0.6');

      const subV2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      subV2.setAttribute('x1', w * 0.3 + '');
      subV2.setAttribute('y1', '0');
      subV2.setAttribute('x2', w * 0.5 + '');
      subV2.setAttribute('y2', h * 0.5 + '');
      subV2.setAttribute('stroke', '#2d6a4f33');
      subV2.setAttribute('stroke-width', '0.6');

      leaf.appendChild(leafPath);
      leaf.appendChild(vein);
      leaf.appendChild(subV1);
      leaf.appendChild(subV2);
      leavesG.appendChild(leaf);
    }

    const targetFlowers = P.growth >= 70 ? Math.min(3, Math.floor((P.growth - 70) / 10) + 1) : 0;
    flowersG.innerHTML = '';
    for (let i = 0; i < targetFlowers; i++) {
      const t = Math.max(0, Math.min(1, 0.85 + i * 0.06));
      const fy = baseY - stemH * t;
      const fx = stemXAt(t, sway);
      const fsize = 9 + Math.min(12, (P.growth - 70) * 0.35);
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('transform', `translate(${fx},${fy})`);
      for (let p = 0; p < 6; p++) {
        const petal = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        const pa = (p / 6) * Math.PI * 2;
        petal.setAttribute('cx', Math.cos(pa) * fsize * 0.5);
        petal.setAttribute('cy', Math.sin(pa) * fsize * 0.5);
        petal.setAttribute('rx', fsize * 0.45);
        petal.setAttribute('ry', fsize * 0.25);
        petal.setAttribute('transform', `rotate(${p * 60})`);
        petal.setAttribute('fill', 'url(#flowerG)');
        g.appendChild(petal);
      }
      const center = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      center.setAttribute('cx', '0');
      center.setAttribute('cy', '0');
      center.setAttribute('r', fsize * 0.25);
      center.setAttribute('fill', 'url(#flowerCenter)');
      g.appendChild(center);
      flowersG.appendChild(g);
    }

    const targetBerries = P.growth >= 88 ? Math.min(4, Math.floor((P.growth - 88) / 3) + 1) : 0;
    berriesG.innerHTML = '';
    for (let i = 0; i < targetBerries; i++) {
      const bt = Math.max(0, Math.min(1, 0.5 + i * 0.12));
      const by = baseY - stemH * bt;
      const bx = stemXAt(bt, sway) + (i % 2 === 0 ? -1 : 1) * 14;
      const br = 5 + Math.min(4, (P.growth - 88) * 0.25);
      const berry = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      berry.setAttribute('cx', bx);
      berry.setAttribute('cy', by);
      berry.setAttribute('r', br);
      berry.setAttribute('fill', i % 2 === 0 ? 'url(#berryG)' : 'url(#berryG2)');
      const shine = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      shine.setAttribute('cx', bx - br * 0.25);
      shine.setAttribute('cy', by - br * 0.25);
      shine.setAttribute('r', br * 0.22);
      shine.setAttribute('fill', '#ffffff88');
      berriesG.appendChild(berry);
      berriesG.appendChild(shine);
    }

    P.berryYield = targetBerries;

  } else {
    stem.setAttribute('d', `M150,${baseY} L150,${baseY}`);
    leavesG.innerHTML = '';
    flowersG.innerHTML = '';
    berriesG.innerHTML = '';
  }

  document.getElementById('stageBadge').textContent = STAGES[P.stage];
}

function updateNeedle(id, value) {
  const angle = -90 + (value / 100) * 180;
  const needle = document.getElementById('needle_' + id);
  if (needle) {
    needle.setAttribute('transform', `rotate(${angle},50,55)`);
  }
  const val = document.getElementById('gval_' + id);
  if (val) val.textContent = Math.round(value) + '%';
}

function updateFlask() {
  const total = P.berries;
  const maxShow = 100;
  const liquidH = Math.min(85, total * 0.85);
  const liquidY = 130 - liquidH;
  document.getElementById('flaskLiquid').setAttribute('y', liquidY);
  document.getElementById('flaskLiquid').setAttribute('height', liquidH);

  const fb = document.getElementById('flaskBerries');
  fb.innerHTML = '';
  const showCount = Math.min(total, 30);
  for (let i = 0; i < showCount; i++) {
    const bx = 20 + (i % 5) * 13 + Math.sin(i * 2.1) * 3;
    const by = 125 - Math.floor(i / 5) * 7 - Math.random() * 2;
    const br = 3 + Math.random() * 1.5;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', bx);
    c.setAttribute('cy', Math.max(liquidY + 3, by));
    c.setAttribute('r', br);
    c.setAttribute('fill', i % 3 === 0 ? '#f87171' : i % 3 === 1 ? '#f97316' : '#ef4444');
    c.setAttribute('opacity', '0.85');
    fb.appendChild(c);
  }

  document.getElementById('flaskCount').textContent = total;
  document.getElementById('berryOnPlant').textContent = P.pendingBerries + ' berries on plant';
  const cap = document.getElementById('flaskCap');
  if (total >= 100) cap.textContent = 'MAX CAPACITY!';
  else if (total >= 75) cap.textContent = 'Almost full!';
  else if (total >= 50) cap.textContent = 'Halfway there';
  else if (total >= 25) cap.textContent = 'Nice collection!';
  else cap.textContent = '';
}

function updateBars() {
  const sets = [
    ['Growth', P.growth], ['Health', P.health],
    ['Hunger', P.hunger], ['Thirst', P.thirst]
  ];
  sets.forEach(([n, v]) => {
    document.getElementById('bar' + n).style.width = v + '%';
    document.getElementById('val' + n).textContent = Math.round(v) + '%';
  });
  updateFlask();
}

function update() {
  const ns = calcStage();
  if (ns > P.stage) {
    speak('grow');
    if (ns >= 5) speak('flower');
  }
  P.stage = ns;
  updatePlant();
  updateNeedle('light', P.light);
  updateNeedle('temp', P.temp);
  updateNeedle('humidity', P.humidity);
  updateNeedle('soilNutrients', P.soilNutrients);
  updateBars();
}

function tick() {
  if (!P.alive) return;

  P.hunger = Math.min(100, P.hunger + 0.35);
  P.thirst = Math.min(100, P.thirst + 0.4);

  P.light += P.lightDir * (0.3 + Math.random() * 0.4);
  if (P.light > 85) P.lightDir = -1;
  if (P.light < 15) P.lightDir = 1;

  P.temp += P.tempDir * (0.2 + Math.random() * 0.3);
  if (P.temp > 80) P.tempDir = -1;
  if (P.temp < 20) P.tempDir = 1;

  P.humidity += P.humDir * (0.25 + Math.random() * 0.35);
  if (P.humidity > 90) P.humDir = -1;
  if (P.humidity < 10) P.humDir = 1;

  P.soilNutrients += P.soilDir * (0.15 + Math.random() * 0.25);
  if (P.soilNutrients > 75) P.soilDir = -1;
  if (P.soilNutrients < 15) P.soilDir = 1;

  let envFactor = 1;
  if (P.light < 25 || P.light > 80) envFactor -= 0.3;
  if (P.temp < 25 || P.temp > 80) envFactor -= 0.3;
  if (P.humidity < 20 || P.humidity > 85) envFactor -= 0.2;
  if (P.soilNutrients < 20) envFactor -= 0.2;
  envFactor = Math.max(0.1, envFactor);

  if (P.hunger > 60) P.health -= 0.2;
  if (P.hunger > 85) P.health -= 0.4;
  if (P.thirst > 60) P.health -= 0.15;
  if (P.thirst > 85) P.health -= 0.35;

  P.health -= 0.05;

  if (P.growth < P.accelPoint) {
    let gr = 0.015 * envFactor;
    if (P.hunger < 30 && P.thirst < 30) gr += 0.01;
    P.growth += gr;
    if (P.hunger > 50 && P.growth > 10) P.growth = Math.max(0, P.growth - 0.02);
    if (P.thirst > 60 && P.growth > 10) P.growth = Math.max(0, P.growth - 0.015);
  }

  if (P.growth >= 88 && P.berryYield > 0 && Math.random() < 0.05) {
    P.pendingBerries += P.berryYield;
    speak('berry');
    sparkles(150, 180, '#f87171');
  }

  P.growth = Math.max(0, Math.min(100, P.growth));
  P.health = Math.max(0, Math.min(100, P.health));

  for (let k in foodCooldowns) {
    if (foodCooldowns[k] > 0) {
      foodCooldowns[k]--;
      const el = document.getElementById('food_' + k);
      if (el) el.classList.toggle('cooldown', foodCooldowns[k] > 0);
    }
  }

  if (P.health <= 0) {
    P.alive = false;
    speak('dead');
  } else if (P.health < 25) {
    speak('sick');
  } else if (P.hunger > 75) {
    speak('hungry');
  } else if (P.thirst > 75) {
    speak('thirsty');
  }

  update();
}

init();
</script>
