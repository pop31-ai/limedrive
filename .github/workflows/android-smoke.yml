name: android-smoke

on:
  push:
    paths:
      - "platforms/android/**"
      - "engine/**"
      - "lang/**"
      - "tools/build-apk.sh"
      - ".github/workflows/android-smoke.yml"
  workflow_dispatch:

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP: com.limedrive.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK (no Gradle)
        run: |
          set -eo pipefail
          bash tools/build-apk.sh 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LimeDrive-apk
          path: platforms/android/dist/LimeDrive.apk

      - name: KVM check
        run: |
          ls -la /dev/kvm || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Emulator smoke (explicit, logged)
        run: |
          set -eo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$PATH"
          adb version
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMU="$ANDROID_HOME/emulator/emulator"

          RUNTAG=$(date +%s)
          EMULOG="emu-$RUNTAG.log"
          echo "== env check =="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "HOME=$HOME"
          ls "$ANDROID_HOME" 2>/dev/null | head -10 || echo "ANDROID_HOME not set or missing"

          AVD_DIR="$HOME/.android/avd"
          export ANDROID_AVD_HOME="$AVD_DIR"
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$AVD_DIR"

          echo "== sdkmanager: install platform-tools + system image =="
          "$SDKM" --install "platform-tools"
          "$SDKM" --install "system-images;android-30;google_apis;x86_64"
          echo "== installed images =="
          ls "$ANDROID_HOME/system-images"/*/*/* 2>/dev/null | head -3 || true

          echo "== create AVD manually (AVD_DIR=$AVD_DIR) =="
          mkdir -p "$AVD_DIR/ci.avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s/.android/avd/ci.avd\npath.rel=ci.avd\ntarget=android-30\n' "$HOME" > "$AVD_DIR/ci.ini"
          {
          echo "AvdId=ci"
          echo "PlayStore.enabled=false"
          echo "abi.type=x86_64"
          echo "avd.ini.displayname=CI Emulator"
          echo "avd.ini.encoding=UTF-8"
          echo "disk.dataPartition.size=2G"
          echo "hw.accelerometer=yes"
          echo "hw.arc=false"
          echo "hw.audioInput=yes"
          echo "hw.battery=yes"
          echo "hw.cpu.arch=x86_64"
          echo "hw.cpu.ncore=2"
          echo "hw.dPad=no"
          echo "hw.device.manufacturer=Google"
          echo "hw.device.name=pixel"
          echo "hw.gps=yes"
          echo "hw.gpu.enabled=yes"
          echo "hw.gpu.mode=swiftshader_indirect"
          echo "hw.initialOrientation=Portrait"
          echo "hw.keyboard=yes"
          echo "hw.lcd.density=420"
          echo "hw.lcd.height=1920"
          echo "hw.lcd.width=1080"
          echo "hw.mainKeys=no"
          echo "hw.ramSize=2048"
          echo "hw.sdCard=yes"
          echo "hw.sensors.orientation=yes"
          echo "hw.sensors.proximity=yes"
          echo "hw.trackBall=no"
          echo "image.sysdir.1=system-images/android-30/google_apis/x86_64/"
          echo "tag.display=Google APIs"
          echo "tag.id=google_apis"
          } > "$AVD_DIR/ci.avd/config.ini"
          echo "== AVD files =="
          cat "$AVD_DIR/ci.ini"
          cat "$AVD_DIR/ci.avd/config.ini" | head -5
          echo "..."
          echo "== avdmanager list =="
          "$AVDM" list avd 2>&1 | head -10 || true

          echo "== boot emulator (headless) =="
          "$EMU" -avd ci -no-window -gpu swiftshader_indirect -no-snapshot \
            -no-audio -no-boot-anim -port 5554 -read-only > "$EMULOG" 2>&1 &
          EMU_PID=$!
          DEV=""
          for i in $(seq 1 40); do
            DEV=$(adb devices | grep -E "emulator-5554[[:space:]]+device" || true)
            if [ -n "$DEV" ]; then echo "device online at attempt $i"; break; fi
            if [ $((i % 5)) -eq 0 ]; then echo "waiting device… attempt $i"; tail -6 "$EMULOG" || true; fi
            sleep 8
          done
          if [ -z "$DEV" ]; then
            echo "FAIL: emulator device never came online"
            tail -60 "$EMULOG"
            kill $EMU_PID || true
            exit 1
          fi
          OK=""
          for i in $(seq 1 100); do
            B=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$B" = "1" ]; then OK=1; echo "boot completed at attempt $i"; break; fi
            if [ $((i % 10)) -eq 0 ]; then echo "waiting attempt $i"; fi
            sleep 3
          done
          if [ -z "$OK" ]; then
            echo "FAIL: boot timeout"; tail -40 "$EMULOG"
            kill $EMU_PID || true
            exit 1
          fi

          echo "== PHASE 1: install & menu =="
          adb install -r platforms/android/dist/LimeDrive.apk
          adb shell am start -n $APP/.MainActivity
          sleep 7
          adb shell pidof $APP > /dev/null || { echo "FAIL: app process died"; tail -30 "$EMULOG"; exit 1; }
          if adb logcat -d | grep -q "FATAL EXCEPTION"; then echo "FAIL: FATAL in menu"; exit 1; fi
          adb exec-out screencap -p > menu.png
          MENU_SIZE=$(stat -c%s menu.png); echo "menu.png: $MENU_SIZE bytes"
          if [ "$MENU_SIZE" -le 30000 ]; then echo "FAIL: menu looks blank"; exit 1; fi
          echo "== PHASE 1 OK =="

          echo "== PHASE 2: real game =="
          adb shell am force-stop $APP
          adb shell am start -n $APP/.MainActivity --es loadUrl \
            "file:///android_asset/www/examples/player.html?game=01-lime-platformer.json"
          sleep 10
          if adb logcat -d | grep -q "FATAL EXCEPTION"; then echo "FAIL: FATAL in player"; exit 1; fi
          adb exec-out screencap -p > game.png
          GAME_SIZE=$(stat -c%s game.png); echo "game.png: $GAME_SIZE bytes"
          if [ "$GAME_SIZE" -le 30000 ]; then echo "FAIL: player looks blank"; exit 1; fi
          echo "== SMOKE OK =="

          kill $EMU_PID || true

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log
          path: emu-*.log
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            menu.png
            game.png
          if-no-files-found: ignore
