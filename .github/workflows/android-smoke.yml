name: android-build

on:
  push:
    paths:
      - "platforms/android/**"
      - "engine/**"
      - "lang/**"
      - "tools/build-apk.sh"
      - ".github/workflows/android-smoke.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK (no Gradle)
        run: |
          set -eo pipefail
          bash tools/build-apk.sh 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LimeDrive-apk
          path: platforms/android/dist/LimeDrive.apk

      - name: Smoke: APK sanity check
        run: |
          set -eo pipefail
          APK="platforms/android/dist/LimeDrive.apk"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then echo "FAIL: APK too small ($SIZE bytes)"; exit 1; fi
          file "$APK" || true
          python3 -c "
          import zipfile, sys
          z = zipfile.ZipFile('$APK')
          names = z.namelist()
          assert 'AndroidManifest.xml' in names, 'missing AndroidManifest.xml'
          assert any('classes' in n for n in names), 'no classes.dex'
          assert any('assets/www' in n for n in names), 'no www assets'
          print(f'APK valid: {len(names)} entries')
          "
          echo "== BUILD OK =="
