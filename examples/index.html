<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LimeDrive Games</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      color: #00ff88;
      font-size: 3rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    }

    .subtitle {
      text-align: center;
      color: #88aacc;
      font-size: 1.2rem;
      margin-bottom: 50px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .game-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .game-thumbnail {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      position: relative;
      overflow: hidden;
    }

    .game-thumbnail::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.3) 100%);
    }

    .game-thumbnail span {
      position: relative;
      z-index: 1;
      text-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .game-info {
      padding: 20px;
    }

    .game-title {
      color: #ffffff;
      font-size: 1.4rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .game-type {
      color: #00ff88;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .game-description {
      color: #aabbcc;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .play-button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
      border: none;
      border-radius: 8px;
      color: #1a1a2e;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .play-button:hover {
      background: linear-gradient(135deg, #00ffaa 0%, #00dd77 100%);
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
    }

    .play-button:active {
      transform: scale(0.98);
    }

    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .loading-overlay.active {
      display: flex;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 255, 136, 0.2);
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    .loading-text {
      color: #00ff88;
      font-size: 1.2rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff4444;
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      z-index: 1001;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }

    footer {
      text-align: center;
      margin-top: 60px;
      color: #667788;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .games-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>
<body>
  <h1>LimeDrive Games</h1>
  <p class="subtitle">13 complete game examples built with the LimeDrive engine</p>

  <div class="games-grid" id="gamesGrid"></div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading game...</div>
  </div>

  <div class="error-message" id="errorMessage"></div>

  <footer>
    Powered by LimeDrive Engine • Built with JSON Game Format
  </footer>

  <script>
    const games = [
      {
        id: '01',
        name: 'Lime Platformer',
        type: 'Platformer',
        description: 'Classic side-scrolling platformer with forest, cave, mountain, and castle levels. Defeat enemies, collect items, and conquer the Slime King!',
        color: 'linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%)',
        icon: '🟩',
        file: '01-lime-platformer.json'
      },
      {
        id: '02',
        name: 'Space Drift',
        type: 'Space Shooter',
        description: 'Blast through alien formations across 5 intense waves. Power up your ship and take down the Mothership in this epic space battle!',
        color: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)',
        icon: '🚀',
        file: '02-space-invaders.json'
      },
      {
        id: '03',
        name: 'Lime Dungeon',
        type: 'Dungeon Crawler',
        description: 'Explore dangerous dungeons in top-down view. Find keys, fight skeletons, and defeat the Dungeon Boss across three floors.',
        color: 'linear-gradient(135deg, #5D4037 0%, #3E2723 100%)',
        icon: '⚔️',
        file: '03-dungeon-crawler.json'
      },
      {
        id: '04',
        name: 'Cube Shift',
        type: 'Puzzle',
        description: 'Push colored cubes onto matching switches. Plan your moves carefully in this challenging puzzle game with 5 unique levels!',
        color: 'linear-gradient(135deg, #9C27B0 0%, #673AB7 100%)',
        icon: '🟪',
        file: '04-puzzle-cubes.json'
      },
      {
        id: '05',
        name: 'Race Lime',
        type: 'Racing',
        description: 'Race through forest, desert, and ice tracks. Dodge obstacles, collect boost pads, and outpace AI opponents to the finish line!',
        color: 'linear-gradient(135deg, #FF9800 0%, #F57C00 100%)',
        icon: '🏎️',
        file: '05-race-lime.json'
      },
      {
        id: '06',
        name: 'Ghost Mansion',
        type: 'Horror Platformer',
        description: 'Survive three floors of Ghost Mansion. Use light to reveal hidden paths and defeat the Ghost King in this spooky adventure!',
        color: 'linear-gradient(135deg, #4A148C 0%, #311B92 100%)',
        icon: '👻',
        file: '06-ghost-mansion.json'
      },
      {
        id: '07',
        name: 'Deep Lime',
        type: 'Underwater Exploration',
        description: 'Dive through coral reefs, kelp forests, and deep ocean trenches. Manage oxygen while fighting sea creatures and the Leviathan!',
        color: 'linear-gradient(135deg, #0277BD 0%, #01579B 100%)',
        icon: '🐠',
        file: '07-ocean-diver.json'
      },
      {
        id: '08',
        name: 'Lime Towers',
        type: 'Tower Defense',
        description: 'Strategically place towers to defend against waves of enemies across grasslands, deserts, arctic, and lava environments!',
        color: 'linear-gradient(135deg, #795548 0%, #5D4037 100%)',
        icon: '🏰',
        file: '08-tower-defense.json'
      },
      {
        id: '09',
        name: 'Neon Dash',
        type: 'Endless Runner',
        description: 'Cyberpunk endless runner through neon-lit highways. Collect orbs, dodge laser gates, and activate gravity zones!',
        color: 'linear-gradient(135deg, #FF00FF 0%, #00FFFF 100%)',
        icon: '⚡',
        file: '09-neon-runner.json'
      },
      {
        id: '10',
        name: 'Chess Clash',
        type: 'Turn-Based Strategy',
        description: 'Chess-inspired grid combat with counterattack mechanics. Outsmart your opponent in three increasingly challenging battles!',
        color: 'linear-gradient(135deg, #212121 0%, #424242 100%)',
        icon: '♟️',
        file: '10-chess-battle.json'
      },
      {
        id: '11',
        name: 'Финансовый Тайкун',
        type: 'Экономический платформер',
        description: 'Путь от уличного торговца до магната биржи: собирай монеты и контракты, уворачивайся от коллекторов и быков с медведями, победи Медвежьего Барона!',
        color: 'linear-gradient(135deg, #FFD700 0%, #FF8F00 100%)',
        icon: '💰',
        file: '11-finance-tycoon.json'
      },
      {
        id: '12',
        name: 'Cyber Heist',
        type: 'Stealth Action',
        description: 'Navigate a neon-lit cyberpunk city, hack terminals, dodge security bots, and pull off the ultimate digital heist!',
        color: 'linear-gradient(135deg, #00E5FF 0%, #0091EA 100%)',
        icon: '🤖',
        file: '12-cyber-heist.json'
      },
      {
        id: '13',
        name: 'Quantum Puzzle',
        type: 'Puzzle',
        description: 'Manipulate quantum states, collapse wave functions, and solve mind-bending puzzles across parallel dimensions!',
        color: 'linear-gradient(135deg, #7C4DFF 0%, #E040FB 100%)',
        icon: '⚛️',
        file: '13-quantum-puzzle.json'
      }
    ];

    function createGameCard(game) {
      return `
        <div class="game-card">
          <div class="game-thumbnail" style="background: ${game.color}">
            <span>${game.icon}</span>
          </div>
          <div class="game-info">
            <div class="game-type">${game.type}</div>
            <h3 class="game-title">${game.name}</h3>
            <p class="game-description">${game.description}</p>
            <button class="play-button" onclick="loadGame('${game.file}')">
              Play Game
            </button>
          </div>
        </div>
      `;
    }

    function renderGames() {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = games.map(createGameCard).join('');
    }

    async function loadGame(filename) {
      const overlay = document.getElementById('loadingOverlay');
      const errorDiv = document.getElementById('errorMessage');

      overlay.classList.add('active');
      errorDiv.style.display = 'none';

      try {
        const response = await fetch(filename);

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const gameData = await response.json();
        console.log('Game loaded:', gameData);

        localStorage.setItem('currentGame', JSON.stringify(gameData));

        overlay.classList.remove('active');
        window.location.href = 'player.html?game=' + encodeURIComponent(filename);

      } catch (error) {
        console.error('Error loading game:', error);
        overlay.classList.remove('active');

        errorDiv.textContent = `Failed to load game: ${error.message}`;
        errorDiv.style.display = 'block';

        setTimeout(() => {
          errorDiv.style.display = 'none';
        }, 5000);
      }
    }

    renderGames();
  </script>
</body>
</html>
