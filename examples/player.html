    entities.unshift(hero);
  }
  puzzleMovesLeft = (hero.properties && hero.properties.moveLimit) || 50;
  puzzleCellSize = (hero.properties && hero.properties.gridSize) || 64;
  camera.x = 0;
  camera.y = 0;
  camera.targetX = 0;
  camera.targetY = 0;
}

function puzzleSolidAt(rect, ignore) {
  for (let i = 0; i < entities.length; i++) {
    const e = entities[i];
    if (e === ignore || e === hero || !e.alive || !e.active) continue;
    let solid = false;
    if (e.type === "platform") solid = true;
    else if (e.type === "enemy" && e.properties && e.properties.pushable) solid = true;
    else if (e.type === "trigger" && e.properties && e.properties.locked) solid = true;
    if (!solid) continue;
    if (rectOverlap(rect, e)) return e;
  }
  return null;
}

function updatePuzzle(dt) {
  updateFade(dt);
  updateParticles(dt);
  if (puzzleMsgTimer > 0) puzzleMsgTimer -= dt;
  if (fadeDir !== 0 || levelTransitioning || paused) return;

  if (justPressed.KeyR) {
    fadeDir = 1;
    fadeSpeed = 4;
    fadeCallback = function () { loadLevel(currentLevelIdx); };
    return;
  }

  var dx = 0, dy = 0;
  if (justPressed.ArrowLeft || justPressed.KeyA) dx = -1;
  else if (justPressed.ArrowRight || justPressed.KeyD) dx = 1;
  else if (justPressed.ArrowUp || justPressed.KeyW) dy = -1;
  else if (justPressed.ArrowDown || justPressed.KeyS) dy = 1;
  if (!dx && !dy) return;
  tryPuzzleStep(dx, dy);
}

function tryPuzzleStep(dx, dy) {
  if (!hero || !hero.alive) return;
  if (dx !== 0) hero.facing = dx;
  var nx = hero.x + dx * puzzleCellSize;
  var ny = hero.y + dy * puzzleCellSize;
  var blocker = puzzleSolidAt({ x: nx, y: ny, width: hero.width, height: hero.height }, null);
  if (!blocker) {
    hero.x = nx;
    hero.y = ny;
    puzzleConsumeMove();
    return;
  }
  if (blocker.type === "enemy" && blocker.properties && blocker.properties.pushable) {
    var bx = nx + dx * puzzleCellSize;
    var by = ny + dy * puzzleCellSize;
    if (!puzzleSolidAt({ x: bx, y: by, width: blocker.width, height: blocker.height }, blocker)) {
      blocker.x = bx;
      blocker.y = by;
      hero.x = nx;
      hero.y = ny;
      spawnParticles(bx + blocker.width / 2, by + blocker.height / 2, stripAlpha(blocker.color) || "#aaaaaa", 6, "collect");
      shakeCamera(2, 0.12);
      puzzleUpdateSwitches();
      puzzleConsumeMove();
    } else {
      spawnParticles(blocker.x + blocker.width / 2, blocker.y + blocker.height / 2, "#888888", 3, "collect");
    }
  }
}

function puzzleConsumeMove() {
  puzzleMovesLeft--;
  for (let i = 0; i < entities.length; i++) {
    const f = entities[i];
    if (f.type === "finish" && f.alive && f.active && rectOverlap(hero, f)) {
      levelTransitioning = true;
      const next = (f.properties && f.properties.nextLevel != null) ? f.properties.nextLevel : null;
      if (next === null || next === -1 || next >= gameData.levels.length) {
        showVictory();
      } else {
        fadeDir = 1;
        fadeSpeed = 4;
        fadeCallback = function () { loadLevel(next); };
      }
      return;
    }
  }
  if (puzzleMovesLeft <= 0 && gameState === "playing" && !levelTransitioning) {
    puzzleMsg = uiText("ui.outOfMoves");
    puzzleMsgTimer = 1.2;
    fadeDir = 1;
    fadeSpeed = 2.5;
    fadeCallback = function () { loadLevel(currentLevelIdx); };
  }
}

function puzzleUpdateSwitches() {
  for (const sw of entities) {
    if (sw.type !== "trigger" || !sw.alive || !sw.properties || sw.properties.switchColor === undefined) continue;
    sw.properties.activated = false;
    for (const b of entities) {
      if (b !== sw && b.alive && b.active && b.type === "enemy" &&
          b.properties && b.properties.pushable && rectOverlap(sw, b)) {
        sw.properties.activated = true;
        break;
      }
    }
  }
  for (const door of entities) {
    const p = door.properties;
    if (door.type !== "trigger" || !door.alive || !p || !Array.isArray(p.requiredSwitches)) continue;
    let all = true;
    for (const id of p.requiredSwitches) {
      const sw = entities.find(s => s.id === id && s.properties && s.properties.activated);
      if (!sw) { all = false; break; }
    }
    if (all && p.locked) {
      p.locked = false;
      door.alive = false;
      score += 100;
      SFX.door();
      spawnParticles(door.x + door.width / 2, door.y + door.height / 2, "#FFD700", 14, "collect");
      puzzleMsg = "Door opened!";
      puzzleMsgTimer = 1.2;
    }
  }
}

function renderPuzzle() {
  drawBackground(camera.x, camera.y);
  ctx.save();
  ctx.translate(-camera.x, -camera.y);
  drawEntities(camera.x, camera.y);
  ctx.restore();

  ctx.textAlign = "left";
  ctx.fillStyle = "#00ff88";
  ctx.font = "bold 20px monospace";
  ctx.fillText(uiText("ui.movesLeft") + Math.max(0, puzzleMovesLeft), 24, H - 24);
  ctx.textAlign = "right";
  ctx.fillStyle = "#FFD700";
  ctx.fillText(uiText("ui.score") + score, W - 24, H - 24);
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px monospace";
  ctx.fillText(levelData.name || "", W / 2, 30);
  ctx.fillStyle = "#888888";
  ctx.font = "13px monospace";
  ctx.fillText(uiText("ui.hintPuzzle"), W / 2, H - 8);

  if (puzzleMsgTimer > 0) {
    ctx.globalAlpha = Math.min(1, puzzleMsgTimer);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 22px monospace";
    ctx.textAlign = "center";
    ctx.fillText(puzzleMsg, W / 2, H / 2 - 10);
    ctx.globalAlpha = 1;
  }

  drawParticles();
  if (fadeAlpha > 0) {
    ctx.fillStyle = "rgba(0,0,0," + fadeAlpha + ")";
    ctx.fillRect(0, 0, W, H);
  }
}
// ---------- END PUZZLE MODE ----------

// ---------- TOWER DEFENSE MODE ----------
function initTdLevel() {
  tdWaves = [];
  tdEnemies = [];
  tdTowers = [];
  tdProjectiles = [];
  tdSpawnQueue = [];
  tdSlots = [];
  tdWaypoints = [];
  tdGameOver = false;
  tdSelected = 0;
  tdWaveNum = 0;
  tdIntermission = 3;
  tdSpawnTimer = 0;
  levelEntityDefs = levelData.entities || [];
  for (let i = 0; i < levelEntityDefs.length; i++) {
    const def = JSON.parse(JSON.stringify(levelEntityDefs[i]));
    entities.push(createEntity(def));
  }
  hero = null;
  for (const e of entities) {
    if ((e.type === "hero" || e.type === "player") && !hero) hero = e;
  }
  if (!hero) {
    hero = createEntity({ type: "hero", x: 0, y: 0, width: 1, height: 1, color: "#fff", properties: {} });
    entities.push(hero);
  }
  tdGold = (hero.properties && hero.properties.gold) || 150;
  tdLives = (hero.properties && hero.properties.lives) || 10;
  tdTowerTypes = (hero.properties && hero.properties.towerTypes) || ["arrow", "cannon", "ice"];
  for (const e of entities) {
    if (e.type === "spawn_point" && e.properties && e.properties.spawnInterval != null) {
      tdSpawnTimerMax = e.properties.spawnInterval;
    }
    if (e.type === "trigger" && e.properties && Array.isArray(e.properties.waypointIndex)) {
      // not used
    } else if (e.type === "trigger" && e.properties && typeof e.properties.waypointIndex === "number") {
      tdWaypoints.push({ idx: e.properties.waypointIndex, x: e.x, y: e.y });
      e.active = false;
      continue;
    } else if (e.type === "trigger" && e.properties && e.properties.wave != null) {
      tdWaves.push(e);
      e.active = false;
      continue;
    } else if (e.type === "decoration" && (e.components || []).includes("TowerSlot")) {
      tdSlots.push(e);
      continue;
    } else if (e.type === "finish") {
      tdBase = e;
      continue;
    }
  }
  tdWaypoints.sort((a, b) => a.idx - b.idx);
  tdWaves.sort((a, b) => a.properties.wave - b.properties.wave);
  camera.x = 0;
  camera.y = 0;
  camera.targetX = 0;
  camera.targetY = 0;
}
let tdSpawnTimerMax = 2;

const TD_ENEMY_COLORS = { grunt: "#ff5252", fast: "#FFD740", tank: "#8D6E63" };

function updateTd(dt) {
  updateFade(dt);
  updateParticles(dt);

  if (tdGameOver) {
    if (justPressed.KeyR) {
      startGame();
    }
    return;
  }

  // tower selection keys 1..4
  for (let k = 1; k <= 4; k++) {
    if (justPressed["Digit" + k] && k <= tdTowerTypes.length) tdSelected = k - 1;
  }

  // build tower on click
  if (mouseClicked) {
    mouseClicked = false;
    for (const slot of tdSlots) {
      if (!slot.built && mouseX >= slot.x && mouseX <= slot.x + slot.width &&
          mouseY >= slot.y && mouseY <= slot.y + slot.height) {
        const type = tdTowerTypes[tdSelected] || "arrow";
        const st = TD_TOWER_STATS[type];
        if (st && tdGold >= st.cost) {
          tdGold -= st.cost;
          slot.built = true;
          tdTowers.push({ x: slot.x + slot.width / 2, y: slot.y + slot.height / 2,
            type: type, cd: 0, range: st.range, damage: st.damage,
            cooldown: st.cooldown, color: st.color,
            splash: st.splash || 0, slow: st.slow || 0, slowDur: st.slowDur || 0 });
          spawnParticles(slot.x + slot.width / 2, slot.y + slot.height / 2, st.color, 10, "collect");
        }
        break;
      }
    }
  }

  // wave scheduling
  if (tdIntermission > 0) {
    tdIntermission -= dt;
    if (justPressed.Space) tdIntermission = 0;
    if (tdIntermission > 0) return;
    if (tdWaveNum < tdWaves.length) {
      tdStartWave(tdWaves[tdWaveNum]);
      tdWaveNum++;
    } else {
      return;
    }
  }

  // spawn from queue
    if (tdSpawnQueue.length > 0) {
    tdSpawnTimer -= dt;
    if (tdSpawnTimer <= 0) {
      const spec = tdSpawnQueue.shift();
      let sp = null;
      for (const e of entities) if (e.type === "spawn_point") { sp = e; break; }
      tdEnemies.push({
        x: sp ? sp.x + sp.width / 2 : 0,
        y: sp ? sp.y + sp.height / 2 : 0,
        hp: spec.hp, maxHp: spec.hp, speed: spec.speed, reward: spec.reward,
        color: TD_ENEMY_COLORS[spec.type] || "#ff5555",
        pathIdx: 0, slowTimer: 0, r: spec.type === "tank" ? 16 : spec.type === "fast" ? 8 : 11
      });
      tdSpawnTimer = tdSpawnTimerMax;
    }
  }

  updateTdEnemies(dt);
  updateTdTowers(dt);

  // wave end conditions
  if (tdIntermission <= 0 && tdWaveNum >= tdWaves.length &&
      tdSpawnQueue.length === 0 && tdEnemies.length === 0) {
    showVictory();
    return;
  }
  if (tdWaveNum < tdWaves.length && tdWaveNum > 0 &&
      tdSpawnQueue.length === 0 && tdEnemies.length === 0 && tdIntermission <= 0) {
    tdGold += 50;
    score += 100;
    tdIntermission = 4;
  }
}

function tdStartWave(waveEnt) {
  const groups = waveEnt.properties.enemies || [];
  tdSpawnQueue = [];
  for (const g of groups) {
    for (let n = 0; n < (g.count || 1); n++) tdSpawnQueue.push(g);
  }
  tdSpawnTimer = 0.5;
}

function updateTdEnemies(dt) {
  for (let i = tdEnemies.length - 1; i >= 0; i--) {
    const en = tdEnemies[i];
    if (en.slowTimer > 0) en.slowTimer -= dt;
    const spd = en.speed * 60 * dt * (en.slowTimer > 0 ? 0.55 : 1);
    const wp = tdWaypoints[en.pathIdx];
    if (!wp) {
      // reached base
      tdEnemies.splice(i, 1);
      tdLives--;
      shakeCamera(6, 0.3);
      if (tdLives <= 0) { tdLives = 0; tdGameOver = true; SFX.lose(); }
      continue;
    }
    const dx = wp.x - en.x, dy = wp.y - en.y;
    const dist = Math.hypot(dx, dy);
    if (dist < Math.max(6, spd)) {
      en.pathIdx++;
    } else {
      en.x += dx / dist * spd;
      en.y += dy / dist * spd;
    }
  }
}

function updateTdTowers(dt) {
  for (const tw of tdTowers) {
    tw.cd -= dt;
    if (tw.cd > 0) continue;
    let best = null, bestD = 1e9;
    for (const en of tdEnemies) {
      const d = Math.hypot(en.x - tw.x, en.y - tw.y);
      if (d <= tw.range && d < bestD) { bestD = d; best = en; }
    }
    if (!best) continue;
    tw.cd = tw.cooldown;
    tdProjectiles.push({
      x: tw.x, y: tw.y, tx: best.x, ty: best.y,
      target: best, speed: 420, damage: tw.damage,
      splash: tw.splash, slow: tw.slow, slowDur: tw.slowDur,
      color: tw.color
    });
  }

  for (let i = tdProjectiles.length - 1; i >= 0; i--) {
    const pr = tdProjectiles[i];
    if (pr.target && pr.target.hp > 0) { pr.tx = pr.target.x; pr.ty = pr.target.y; }
    const dx = pr.tx - pr.x, dy = pr.ty - pr.y;
    const d = Math.hypot(dx, dy);
    const step = pr.speed * dt;
    if (d <= step || d < 5) {
      tdHit(pr.tx, pr.ty, pr);
      tdProjectiles.splice(i, 1);
    } else {
      pr.x += dx / d * step;
      pr.y += dy / d * step;
    }
  }
}

function tdHit(x, y, pr) {
  spawnParticles(x, y, pr.color, 4, "collect");
  for (const en of tdEnemies) {
    const d = Math.hypot(en.x - x, en.y - y);
    if (pr.splash ? d <= pr.splash : d <= 14) {
      en.hp -= pr.damage;
      if (pr.slow) en.slowTimer = pr.slowDur;
      if (en.hp <= 0) {
        tdGold += en.reward;
        score += en.reward;
        SFX.kill();
        totalEnemiesKilled++;
        spawnParticles(en.x, en.y, en.color, 10, "stomp");
      }
    }
  }
  for (let i = tdEnemies.length - 1; i >= 0; i--) {
    if (tdEnemies[i].hp <= 0) tdEnemies.splice(i, 1);
  }
}

function renderTd() {
  drawBackground(camera.x, camera.y);
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // path line
  if (tdWaypoints.length > 1) {
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 26;
    ctx.beginPath();
    let sp = null;
    for (const e of entities) if (e.type === "spawn_point") { sp = e; break; }
    ctx.moveTo(sp ? sp.x + sp.width / 2 : tdWaypoints[0].x, sp ? sp.y + sp.height / 2 : tdWaypoints[0].y);
    for (const wp of tdWaypoints) ctx.lineTo(wp.x, wp.y);
    if (tdBase) ctx.lineTo(tdBase.x + tdBase.width / 2, tdBase.y + tdBase.height / 2);
    ctx.stroke();
  }

  drawEntities(camera.x, camera.y);

  // towers
  for (const tw of tdTowers) {
    ctx.fillStyle = tw.color;
    roundRect(tw.x - 16, tw.y - 16, 32, 32, 5);
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.arc(tw.x, tw.y, 7, 0, Math.PI * 2);
    ctx.fill();
  }

  // enemies
  for (const en of tdEnemies) {
    ctx.fillStyle = en.color;
    ctx.beginPath();
    ctx.arc(en.x, en.y, en.r, 0, Math.PI * 2);
    ctx.fill();
    const ratio = en.hp / en.maxHp;
    ctx.fillStyle = "#333";
    ctx.fillRect(en.x - en.r, en.y - en.r - 9, en.r * 2, 4);
    ctx.fillStyle = ratio > 0.5 ? "#4CAF50" : ratio > 0.25 ? "#ff9800" : "#f44336";
    ctx.fillRect(en.x - en.r, en.y - en.r - 9, en.r * 2 * ratio, 4);
    if (en.slowTimer > 0) {
      ctx.strokeStyle = "#4FC3F7";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // projectiles
  ctx.fillStyle = "#ffffff";
  for (const pr of tdProjectiles) {
    ctx.fillStyle = pr.color;
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  drawParticles();
  ctx.restore();

  // HUD
  ctx.textAlign = "left";
  ctx.font = "bold 20px monospace";
  ctx.fillStyle = "#FFD700";
  ctx.fillText(uiText("ui.gold") + tdGold, 24, 36);
  ctx.fillStyle = tdLives > 5 ? "#00ff88" : "#ff4444";
  ctx.fillText(uiText("ui.lives") + tdLives, 24, 64);
  ctx.fillStyle = "#ffffff";
  ctx.fillText(uiText("ui.wave") + Math.min(tdWaveNum, tdWaves.length) + "/" + tdWaves.length, 24, 92);

  // build palette
  ctx.textAlign = "center";
  for (let i = 0; i < tdTowerTypes.length; i++) {
    const t = tdTowerTypes[i];
    const st = TD_TOWER_STATS[t];
    const px = W / 2 + (i - tdTowerTypes.length / 2) * 150;
    const sel = i === tdSelected;
    ctx.fillStyle = sel ? st.color : "#666666";
    ctx.font = "bold 18px monospace";
    ctx.fillText((i + 1) + " " + t.toUpperCase(), px, H - 46);
    ctx.fillStyle = sel ? "#ffffff" : "#888888";
    ctx.font = "15px monospace";
    ctx.fillText(st.cost + "g", px, H - 24);
  }
  ctx.textAlign = "right";
  ctx.fillStyle = "#888888";
  ctx.font = "13px monospace";
  ctx.fillText(uiText("ui.hintTD").replace("{n}", String(tdTowerTypes.length)), W - 24, H - 12);

  if (tdIntermission > 0 && !tdGameOver) {
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 26px monospace";
    ctx.fillText(tdWaveNum < tdWaves.length
      ? "WAVE " + (tdWaveNum + 1) + " IN " + Math.ceil(tdIntermission) + "s — SPACE to start"
      : "", W / 2, 60);
  }

  if (tdGameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ff4444";
    ctx.font = "bold 52px monospace";
    ctx.fillText(uiText("ui.gameOver"), W / 2, H / 2 - 20);
    ctx.fillStyle = "#ffffff";
    ctx.font = "18px monospace";
    ctx.fillText(uiText("ui.pressR"), W / 2, H / 2 + 30);
  }

  if (fadeAlpha > 0) {
    ctx.fillStyle = "rgba(0,0,0," + fadeAlpha + ")";
    ctx.fillRect(0, 0, W, H);
  }
}
// ---------- END TOWER DEFENSE MODE ----------

// ---------- SHOOTER MODE (formation shooter) ----------
function updateShooter(dt) {
  updateFade(dt);
  updateParticles(dt);
  if (fadeDir !== 0 || levelTransitioning || paused) return;
  if (isPause()) paused = !paused;
  if (!hero || !hero.alive) return;

  const s = getSettings();
  const spd = (s.maxSpeed || 6) * 60 * dt;
  if (isLeft()) hero.x -= spd;
  if (isRight()) hero.x += spd;
  if (keys.ArrowUp || keys.KeyW) hero.y -= spd;
  if (keys.ArrowDown || keys.KeyS) hero.y += spd;
  hero.facing = 1;
  hero.x = Math.max(0, Math.min((s.worldWidth || 800) - hero.width, hero.x));
  hero.y = Math.max((s.worldHeight || 600) * 0.35, Math.min((s.worldHeight || 600) - hero.height - 10, hero.y));

  // hero shooting
  shFireCd -= dt;
  shDbg = { cd: shFireCd, space: !!keys.Space, jp: !!justPressed.Space, shots: (shDbg && shDbg.shots) || 0 };
  if ((justPressed.Space || keys.Space) && shFireCd <= 0) {
    const fr = (hero.properties && hero.properties.fireRate) || 2.5;
    const bs = (hero.properties && hero.properties.bulletSpeed) || 9;
    const bd = (hero.properties && hero.properties.bulletDamage) || 10;
    shBullets.push({ x: hero.x + hero.width / 2, y: hero.y, vy: -bs * 60 });
    shBullets[shBullets.length - 1].damage = bd;
    SFX.shoot();
    shFireCd = 1 / fr;
    shDbg.shots++;
    spawnParticles(hero.x + hero.width / 2, hero.y, "#ffff88", 3, "collect");
  }

  // formation drift
  const t = Date.now() * 0.001;
  const amp = 46 + shDescend * 4;
  let anyAlive = false;
  for (const e of entities) {
    if (!(e.type === "enemy" || e.type === "boss") || e.health <= 0) continue;
    anyAlive = true;
    if (e.fCol != null) {
      e.x = e.ox + Math.sin(t * 0.45) * amp;
      e.y = e.oy + shDescend * 26;
    }
    // enemy fire
    const rate = (e.properties && e.properties.shootRate) || 0;
    if (rate > 0 && e.type === "enemy") {
      e.shootT -= dt;
      if (e.shootT <= 0) {
        e.shootT = rate + Math.random() * rate;
        shEnemyBullets.push({ x: e.x + e.width / 2, y: e.y + e.height, vy: 260,
          damage: (e.damage || 8) });
      }
    }
  }

  // bullets vs enemies
  for (let i = shBullets.length - 1; i >= 0; i--) {
    const b = shBullets[i];
    b.y += b.vy * dt;
    let hit = false;
    for (const e of entities) {
      if (!(e.type === "enemy" || e.type === "boss") || e.health <= 0) continue;
      if (b.x > e.x - 4 && b.x < e.x + e.width + 4 && b.y > e.y && b.y < e.y + e.height) {
        e.health -= b.damage;
        e.flashTimer = 0.08;
        hit = true;
        if (e.health <= 0) {
          score += (e.properties && e.properties.scoreValue) || 20;
          SFX.kill();
          totalEnemiesKilled++;
          shakeCamera(e.type === "boss" ? 10 : 3, e.type === "boss" ? 0.5 : 0.15);
          spawnParticles(e.x + e.width / 2, e.y + e.height / 2, stripAlpha(e.color) || "#ff5555", e.type === "boss" ? 40 : 12, "stomp");
          if (e.properties && e.properties.powerupType) spawnFallingPowerup(e);
        }
        break;
      }
    }
    if (hit || b.y < -20) shBullets.splice(i, 1);
  }

  // enemy bullets vs hero
  for (let i = shEnemyBullets.length - 1; i >= 0; i--) {
    const b = shEnemyBullets[i];
    b.y += b.vy * dt;
    let done = b.y > (s.worldHeight || 600) + 30;
    if (!done && hero.invincible <= 0 &&
        b.x > hero.x && b.x < hero.x + hero.width && b.y > hero.y && b.y < hero.y + hero.height) {
      damageHero(b.damage || 8);
      done = true;
    }
    if (done) shEnemyBullets.splice(i, 1);
  }

  // falling powerups & pickups collect
  for (let i = entities.length - 1; i >= 0; i--) {
    const e = entities[i];
    if (e.type === "powerup" && e.fallSpeed) {
      e.y += e.fallSpeed * dt;
      if (e.y > (s.worldHeight || 600) + 40) entities.splice(i, 1);
    }
  }
  resolveHeroCollisions();

  // descend pressure when few enemies remain
  const aliveCount = entities.filter(e => (e.type === "enemy" || e.type === "boss") && e.health > 0).length;
  if (aliveCount === 0 && !levelTransitioning) {
    levelTransitioning = true;
    fadeDir = 1;
    fadeSpeed = 4;
    fadeCallback = function () {
      if (currentLevelIdx + 1 < gameData.levels.length) loadLevel(currentLevelIdx + 1);
      else showVictory();
    };
  }
}

function spawnFallingPowerup(srcEnt) {
  const def = {
    id: "pw_" + srcEnt.id + "_" + Math.floor(Math.random() * 1e5),
    type: "powerup",
    x: srcEnt.x + srcEnt.width / 2 - 14,
    y: srcEnt.y,
    width: 28, height: 28,
    color: "#00ffff",
    properties: { scoreValue: (srcEnt.properties && srcEnt.properties.powerupScore) || 50 }
  };
  const pu = createEntity(def);
  pu.fallSpeed = 140;
  entities.push(pu);
}

function renderShooter() {
  drawBackground(camera.x, camera.y);
  ctx.save();
  ctx.translate(-camera.x, -camera.y);
  drawEntities(camera.x, camera.y);

  ctx.fillStyle = "#ffff88";
  for (const b of shBullets) ctx.fillRect(b.x - 2, b.y - 10, 4, 12);
  ctx.fillStyle = "#ff6644";
  for (const b of shEnemyBullets) ctx.fillRect(b.x - 2, b.y - 4, 4, 12);

  drawParticles();
  ctx.restore();
  drawHUD();

  if (damageFlash > 0) {
    ctx.fillStyle = "rgba(255,0,0," + (damageFlash * 0.35) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  if (paused) {
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 34px monospace";
    ctx.fillText(uiText("ui.paused"), W / 2, H / 2);
  }
  if (fadeAlpha > 0) {
    ctx.fillStyle = "rgba(0,0,0," + fadeAlpha + ")";
    ctx.fillRect(0, 0, W, H);
  }
}
// ---------- END SHOOTER MODE ----------

// ---------- RACING MODE (top-down arcade) ----------
function initRacing() {
  raceCps = [];
  raceNextCp = 0;
  raceLap = 1;
  raceBoostT = 0;
  raceHazardCd = 0;
  raceSpeed = 0;
  raceAi = [];
  for (const e of entities) {
    if (e.type === "checkpoint" && e.properties && e.properties.lapCheckpoint) {
      const num = parseInt((e.id || "").replace(/\D/g, ""), 10);
      raceCps.push({ num: isNaN(num) ? 99 : num, e: e });
    } else if (e.type === "finish") {
      raceFinish = e;
    }
  }
  raceCps.sort((a, b) => a.num - b.num);
  raceLapsReq = (raceFinish && raceFinish.properties && raceFinish.properties.lapsRequired) || 3;
  hero.maxHealth = hero.maxHealth || 100;
  if (!hero.health) hero.health = hero.maxHealth;
  // face first checkpoint
  const t0 = raceCps[0] ? raceCps[0].e : null;
  if (t0) raceAngle = Math.atan2(t0.y + t0.height / 2 - (hero.y + hero.height / 2),
                                 t0.x + t0.width / 2 - (hero.x + hero.width / 2));
  for (const e of entities) {
    if (e.type !== "enemy" || !(e.components || []).includes("RacerAI")) continue;
    const p = e.properties || {};
    let a = raceAngle;
    if (t0) a = Math.atan2(t0.y - e.y, t0.x - e.x);
    raceAi.push({ ent: e, angle: a, speed: 0, nextCp: 0,
      top: p.acceleration && p.turnSpeed ? 10 : 10,
      acc: p.acceleration || 0.25, turn: p.turnSpeed || 3.5,
      skill: p.skill || 0.6, name: p.racerName || "AI", lap: 1 });
    e.raceData = raceAi[raceAi.length - 1];
  }
}

function raceWallCollide(ent) {
  for (const w of entities) {
    if (w.type !== "platform" || !w.alive) continue;
    if (rectOverlap(ent, w)) {
      const pr = ent.x + ent.width - w.x, pl = (w.x + w.width) - ent.x;
      const pt = ent.y + ent.height - w.y, pb = (w.y + w.height) - ent.y;
      const m = Math.min(pr, pl, pt, pb);
      if (m === pt) { ent.y = w.y - ent.height; }
      else if (m === pb) { ent.y = w.y + w.height; }
      else if (m === pr) { ent.x = w.x - ent.width; }
      else { ent.x = w.x + w.width; }
      return true;
    }
  }
  return false;
}

function raceProgress(car) {
  const cpIdx = car === hero ? raceNextCp : car.raceData.nextCp;
  const lap = car === hero ? raceLap : car.raceData.lap;
  return lap * 100 + cpIdx * 20 +
    (raceCps[cpIdx] ?
      10 - Math.min(10, Math.hypot(raceCps[cpIdx].e.x - car.x, raceCps[cpIdx].e.y - car.y) / 100) :
      0);
}

function updateRacing(dt) {
  updateFade(dt);
  updateParticles(dt);
  if (fadeDir !== 0 || levelTransitioning || paused) return;
  if (!hero) return;

  raceSlowZone = false;
  raceSlipZone = false;
  raceBoostT = Math.max(0, raceBoostT - dt);
  raceHazardCd = Math.max(0, raceHazardCd - dt);

  const s = getSettings();
  const p = hero.properties || {};
  const acc = p.acceleration || 0.3;
  const top = p.topSpeed || (s.maxSpeed || 10);
  const turn = p.turnSpeed || 4;
  const boostEff = raceBoostT > 0 ? 1.5 : 1;

  // zones
  for (const z of entities) {
    if ((z.type !== "hazard") || !z.alive) continue;
    const zp = z.properties || {};
    if (!zp.effect) continue;
    if (rectOverlap(hero, z)) {
      if (zp.effect === "slowdown") raceSlowZone = true;
      if (zp.effect === "slippery") raceSlipZone = true;
    }
  }

  // controls
  const throttle = keys.ArrowUp || keys.KeyW;
  const brake = keys.ArrowDown || keys.KeyS;
  if (throttle) raceSpeed += acc * dt * 60 * boostEff;
  else raceSpeed *= Math.pow(0.985, dt * 60);
  if (brake) raceSpeed -= 0.7 * dt * 60;
  const cap = top * boostEff * (raceSlowZone ? 0.5 : 1);
  if (raceSpeed > cap) raceSpeed = cap;
  if (raceSpeed < -top * 0.35) raceSpeed = -top * 0.35;

  const steerEff = (raceSlipZone ? 0.55 : 1) * Math.min(1, Math.abs(raceSpeed) / 3);
  const dAng = turn * dt * 60 * Math.PI / 180 * steerEff * (raceSpeed < 0 ? -1 : 1);
  if (isLeft()) raceAngle -= dAng;
  if (isRight()) raceAngle += dAng;

  hero.x += Math.cos(raceAngle) * raceSpeed * dt * 60;
  hero.y += Math.sin(raceAngle) * raceSpeed * dt * 60;
  hero.facing = 1;

  if (raceWallCollide(hero)) {
    raceSpeed *= -0.25;
    shakeCamera(3, 0.15);
    spawnParticles(hero.x + hero.width / 2, hero.y + hero.height / 2, "#cccccc", 4, "collect");
  }

  // small hazards
  for (const hz of entities) {
    if (hz.type !== "hazard" || !hz.alive) continue;
    const hp2 = hz.properties || {};
    if (!hp2.hazardType) continue;
    if (raceHazardCd <= 0 && rectOverlap(hero, hz)) {
      raceSpeed *= 0.35;
      raceHazardCd = 0.6;
      damageFlash = 0.6;
      shakeCamera(4, 0.2);
    }
  }

  // pickups
  for (const pk of entities) {
    if ((pk.type !== "pickup" && pk.type !== "collectible") || !pk.alive) continue;
    if (!rectOverlap(hero, pk)) continue;
    pk.alive = false;
    pk.active = false;
    collectedPickups.add(pk.id);
    const pp = pk.properties || {};
    if (pp.pickupType === "boost") {
      raceBoostT = pp.boostDuration || 2;
      raceSpeed = Math.max(raceSpeed, (pp.boostForce || 15) * 0.8);
      spawnParticles(pk.x + 20, pk.y + 20, "#FFD700", 12, "collect");
    } else if (pp.pickupType === "repair") {
      hero.health = Math.min(hero.maxHealth, hero.health + (pp.value || 30));
      spawnParticles(pk.x + 20, pk.y + 20, "#66ff88", 10, "collect");
    } else {
      score += (pp.value != null ? pp.value : 10);
      spawnParticles(pk.x + 20, pk.y + 20, stripAlpha(pk.color) || "#FFD700", 8, "collect");
    }
    totalPickupsCollected++;
  }

  // checkpoints / laps
  if (raceNextCp < raceCps.length &&
      rectOverlap(hero, raceCps[raceNextCp].e)) {
    raceNextCp++;
    spawnParticles(hero.x + hero.width / 2, hero.y + hero.height / 2, "#00ff88", 8, "collect");
    if (raceNextCp >= raceCps.length) {
      raceLap++;
      raceNextCp = 0;
      if (raceLap > raceLapsReq && !levelTransitioning) {
        levelTransitioning = true;
        const next = (raceFinish && raceFinish.properties && raceFinish.properties.nextLevel != null)
          ? raceFinish.properties.nextLevel : null;
        fadeDir = 1; fadeSpeed = 4;
        fadeCallback = function () {
          if (next === null || next === -1 || next >= gameData.levels.length) showVictory();
          else loadLevel(next);
        };
      }
    }
  }

  // AI drivers
  for (const ai of raceAi) {
    const cpE = raceCps[ai.nextCp] ? raceCps[ai.nextCp].e : (raceFinish || raceCps[0].e);
    const tx = cpE.x + cpE.width / 2, ty = cpE.y + cpE.height / 2;
    const desired = Math.atan2(ty - (ai.ent.y + 32), tx - (ai.ent.x + 32));
    let da = desired - ai.angle;
    while (da > Math.PI) da -= 2 * Math.PI;
    while (da < -Math.PI) da += 2 * Math.PI;
    const maxTurn = ai.turn * dt * 60 * Math.PI / 180;
    ai.angle += Math.max(-maxTurn, Math.min(maxTurn, da));
    const targetSpeed = (p.topSpeed || top) * ai.skill * (raceBoostT > 0 ? 1 : 1);
    ai.speed += ai.acc * dt * 60;
    if (ai.speed > targetSpeed) ai.speed = targetSpeed;
    ai.ent.x += Math.cos(ai.angle) * ai.speed * dt * 60;
    ai.ent.y += Math.sin(ai.angle) * ai.speed * dt * 60;
    if (raceWallCollide(ai.ent)) { ai.speed *= 0.3; }
    if (ai.nextCp < raceCps.length && rectOverlap(ai.ent, raceCps[ai.nextCp].e)) {
      ai.nextCp++;
      if (ai.nextCp >= raceCps.length) { ai.nextCp = 0; ai.lap++; }
    }
  }

  updateCamera(dt);
}

function renderRacing() {
  const bgc = (levelData.background && levelData.background.colors && levelData.background.colors[0]) || "#203020";
  ctx.fillStyle = bgc;
  ctx.fillRect(0, 0, W, H);

  const camX = Math.round(camera.x + camera.shakeX);
  const camY = Math.round(camera.y + camera.shakeY);
  ctx.save();
  ctx.translate(-camX, -camY);

  for (const e of entities) {
    if (!e.alive && e.type !== "decoration") continue;
    switch (e.type) {
      case "platform": drawPlatform(e, e.x, e.y, e.width, e.height); break;
      case "hazard": drawHazard(e, e.x, e.y, e.width, e.height); break;
      case "pickup": case "collectible": drawPickup(e, e.x, e.y, e.width, e.height); break;
      case "checkpoint": drawCheckpoint(e, e.x, e.y, e.width, e.height); break;
      case "finish": drawFinish(e, e.x, e.y, e.width, e.height); break;
      case "decoration": drawDecoration(e, e.x, e.y, e.width, e.height); break;
      default: break;
    }
  }

  // highlight next checkpoint
  if (raceCps[raceNextCp]) {
    const ce = raceCps[raceNextCp].e;
    ctx.strokeStyle = "rgba(0,255,136," + (0.4 + 0.3 * Math.sin(Date.now() * 0.006)) + ")";
    ctx.lineWidth = 3;
    ctx.strokeRect(ce.x - 4, ce.y - 4, ce.width + 8, ce.height + 8);
  }

  // cars
  function drawCar(x, y, w, h, ang, color, isPlayer, name) {
    ctx.save();
    ctx.translate(x + w / 2, y + h / 2);
    ctx.rotate(ang);
    ctx.fillStyle = color;
    roundRect(-w / 2, -h / 2, w, h, 8);
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    roundRect(-w / 2 + 6, -h / 2 + 6, w - 12, 12, 4);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.fillRect(w / 2 - 10, -h / 2 + 4, 4, h - 8);
    ctx.restore();
    if (!isPlayer && name) {
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.font = "11px monospace";
      ctx.textAlign = "center";
      ctx.fillText(name, x + w / 2, y - 6);
    }
  }
  drawCar(hero.x, hero.y, hero.width, hero.height, raceAngle, stripAlpha(hero.color) || "#00ff88", true, null);
  for (const ai of raceAi) {
    drawCar(ai.ent.x, ai.ent.y, ai.ent.width, ai.ent.height, ai.angle,
      stripAlpha(ai.ent.color) || "#ff4444", false, ai.name);
  }

  drawParticles();
  ctx.restore();

  // HUD
  const total = raceAi.length + 1;
  const myProg = raceProgress(hero);
  let pos = 1;
  for (const ai of raceAi) if (raceProgress(ai.ent) > myProg) pos++;

  ctx.textAlign = "left";
  ctx.font = "bold 22px monospace";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(uiText("ui.lap") + Math.min(raceLap, raceLapsReq) + "/" + raceLapsReq, 24, 40);
  ctx.fillStyle = pos === 1 ? "#FFD700" : "#dddddd";
  ctx.fillText(uiText("ui.pos") + pos + "/" + total, 24, 70);
  ctx.font = "14px monospace";
  ctx.fillStyle = "#888888";
  ctx.fillText(uiText("ui.hintRace"), 24, H - 16);

  // speed bar
  const sw = 140, sp = Math.min(1, Math.abs(raceSpeed) / ((hero.properties.topSpeed || 10) * 1.5));
  ctx.fillStyle = "#333344";
  ctx.fillRect(W - sw - 24, 28, sw, 14);
  ctx.fillStyle = raceBoostT > 0 ? "#FFD700" : "#00ff88";
  ctx.fillRect(W - sw - 24, 28, sw * sp, 14);
  if (raceBoostT > 0) {
    ctx.textAlign = "right";
    ctx.fillStyle = "#FFD700";
    ctx.font = "bold 16px monospace";
    ctx.fillText(uiText("ui.boost") + raceBoostT.toFixed(1), W - 24, 60);
  }

  // minimap
  const mm = entities.find(e => (e.components || []).includes("Minimap"));
  const scale = (mm && mm.properties && mm.properties.trackScale) || 0.07;
  const mw = (getSettings().worldWidth || 2000) * scale;
  const mh = (getSettings().worldHeight || 2000) * scale;
  const mx = W - mw - 20, my = H - mh - 20;
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillRect(mx - 6, my - 6, mw + 12, mh + 12);
  ctx.strokeStyle = "#555555";
  ctx.strokeRect(mx - 6, my - 6, mw + 12, mh + 12);
  ctx.fillStyle = "#777777";
  for (const c of raceCps) ctx.fillRect(mx + c.e.x * scale - 1, my + c.e.y * scale - 1, 3, 3);
  ctx.fillStyle = "#ff4444";
  for (const ai of raceAi) ctx.fillRect(mx + ai.ent.x * scale - 2, my + ai.ent.y * scale - 2, 4, 4);
  ctx.fillStyle = "#00ff88";
  ctx.fillRect(mx + hero.x * scale - 2, my + hero.y * scale - 2, 5, 5);

  if (damageFlash > 0) damageFlash = Math.max(0, damageFlash);
  if (damageFlash > 0) {
    ctx.fillStyle = "rgba(255,0,0," + (damageFlash * 0.3) + ")";
    ctx.fillRect(0, 0, W, H);
  }

  if (fadeAlpha > 0) {
    ctx.fillStyle = "rgba(0,0,0," + fadeAlpha + ")";
    ctx.fillRect(0, 0, W, H);
  }
}
// ---------- END RACING MODE ----------

function darkRadius() {
  if (!darkMode || !hero) return 0;
  const base = (hero.properties && hero.properties.lanternRadius) || 160;
  const fl = (hero.properties && hero.properties.lanternFlicker != null) ? hero.properties.lanternFlicker : 0.08;
  return base * (1 + Math.sin(Date.now() * 0.013) * fl);
}

function heroLitDist(e) {
  return Math.hypot((e.x + e.width / 2) - (hero.x + hero.width / 2),
                    (e.y + e.height / 2) - (hero.y + hero.height / 2));
}

// ---------- STEALTH (vision cones, alert chase, hack terminals) ----------
function isSneaking() {
  return !!(keys.ShiftLeft || keys.ShiftRight);
}

function updateStealth(dt) {
  if (!stealthMode || !hero) return;
  const sneak = isSneaking();
  for (const e of entities) {
    if (e.type !== "enemy" || e.health <= 0 || !e.alive) continue;
    const p = e.properties || {};
    if (p.visionRange == null) continue;
    if (e.alertT > 0) {
      e.alertT -= dt;
      const dx = (hero.x + hero.width / 2) - (e.x + e.width / 2);
      e.facing = dx >= 0 ? 1 : -1;
      e.x += Math.sign(dx) * (e.speed || 2) * 1.6 * dt * 60;
      continue;
    }
    const range = p.visionRange * (sneak ? 0.55 : 1);
    const half = ((p.visionAngle || 60) * Math.PI / 180) / 2;
    const dx = (hero.x + hero.width / 2) - (e.x + e.width / 2);
    const dy = (hero.y + hero.height / 2) - (e.y + e.height / 2);
    const dist = Math.hypot(dx, dy);
    if (dist > range) continue;
    const facing = e.facing >= 0 ? 0 : Math.PI;
    let ang = Math.abs(Math.atan2(dy, dx) - facing);
    while (ang > Math.PI) ang = Math.abs(ang - 2 * Math.PI);
    if (ang <= half) {
      e.alertT = 2.5;
      spawnParticles(e.x + e.width / 2, e.y - 10, "#ff4444", 6, "collect");
      shakeCamera(2, 0.1);
    }
  }
  // hack terminals
  for (const t of entities) {
    const tp = t.properties || {};
    if (tp.hackTime == null || !t.alive) continue;
    if (t.done) continue;
    if (rectOverlap(hero, t)) {
      t.hackProg = (t.hackProg || 0) + dt;
      if (Math.random() < 0.3) spawnParticles(t.x + t.width / 2, t.y, "#00E676", 2, "collect");
      if (t.hackProg >= tp.hackTime) {
        t.done = true;
        score += 100;
        const target = entities.find(x => x.id === tp.targetId);
        if (target) { target.alive = false; target.active = false; }
        rpgMsg = "Взломано!";
        rpgMsgTimer = 1.6;
        spawnParticles(t.x + t.width / 2, t.y + t.height / 2, "#00E676", 16, "collect");
      }
    } else {
      t.hackProg = Math.max(0, (t.hackProg || 0) - dt * 2);
    }
  }
}

function drawVisionCones() {
  if (!stealthMode || !hero) return;
  const sneak = isSneaking();
  for (const e of entities) {
    if (e.type !== "enemy" || e.health <= 0 || !e.alive) continue;
    const p = e.properties || {};
    if (p.visionRange == null) continue;
    const range = p.visionRange * (sneak ? 0.55 : 1);
    const half = ((p.visionAngle || 60) * Math.PI / 180) / 2;
    const facing = e.facing >= 0 ? 0 : Math.PI;
    const cx = e.x + e.width / 2, cy = e.y + e.height / 2;
    ctx.fillStyle = e.alertT > 0 ? "rgba(255,60,60,0.20)" : "rgba(80,200,255,0.10)";
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, range, facing - half, facing + half);
    ctx.closePath();
    ctx.fill();
    if (e.alertT > 0) {
      ctx.fillStyle = "#ff4444";
      ctx.font = "bold 16px monospace";
      ctx.textAlign = "center";
      ctx.fillText("!", cx, e.y - 8);
    }
    if (p.hackTime != null && !e.done) continue;
  }
  // hack progress bars
  for (const t of entities) {
    const tp = t.properties || {};
    if (tp.hackTime == null || !t.alive || t.done) continue;
    if (!(t.hackProg > 0)) continue;
    const bw = 46, bx = t.x + t.width / 2 - bw / 2, by = t.y - 14;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(bx - 1, by - 1, bw + 2, 8);
    ctx.fillStyle = "#00E676";
    ctx.fillRect(bx, by, bw * Math.min(1, t.hackProg / tp.hackTime), 6);
  }
}
// ---------- END STEALTH ----------

// ---------- RPG MODE (top-down action) ----------
function updateRpg(dt) {
  updateFade(dt);
  updateParticles(dt);
  updateMovingPlatforms(dt);
  updateHazards(dt);
  updateEnemies(dt);
  updateBosses(dt);
  rpgAtkCd = Math.max(0, rpgAtkCd - dt);
  rpgSwing = Math.max(0, rpgSwing - dt);
  if (fadeDir !== 0 || levelTransitioning || paused) return;
  if (!hero || !hero.alive) return;

  const s = getSettings();
  const spd = (s.maxSpeed || 5) * 60 * dt;
  let dx = 0, dy = 0;
  if (isLeft()) dx -= 1;
  if (isRight()) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
  if (dx !== 0) hero.facing = dx;
  hero.x += dx * spd;
  hero.y += dy * spd;
  rpgResolveWalls();

  // melee attack
  if ((justPressed.Space || justPressed.Enter) && rpgAtkCd <= 0) {
    const p = hero.properties || {};
    const range = p.attackRange || 60;
    const dmg = p.attackDamage || 10;
    rpgAtkCd = p.attackCooldown || 0.5;
    rpgSwing = 0.16;
    const hx = hero.x + hero.width / 2, hy = hero.y + hero.height / 2;
    let hitAny = false;
    for (const e of entities) {
      if (!(e.type === "enemy" || e.type === "boss") || e.health <= 0) continue;
      const ex = e.x + e.width / 2, ey = e.y + e.height / 2;
      if (Math.hypot(ex - hx, ey - hy) < range + (e.width + e.height) / 4) {
        e.health -= dmg;
        e.flashTimer = 0.12;
        hitAny = true;
        spawnParticles(ex, ey, "#ffdd44", 6, "stomp");
        if (e.health <= 0) {
          score += (e.properties && e.properties.scoreValue) || 25;
          SFX.kill();
          totalEnemiesKilled++;
          shakeCamera(3, 0.15);
        }
      }
    }
    if (hitAny) shakeCamera(2, 0.1);
  }

  resolveHeroCollisions();
  updateCamera(dt);
}

function rpgResolveWalls() {
  for (let pass = 0; pass < 2; pass++) {
    for (const w of entities) {
      if (!w.alive || !w.active || w === hero) continue;
      let solid = false;
      if (w.type === "platform" || w.type === "moving_platform" || w.type === "boundary") solid = true;
      else if (w.type === "trigger" && w.properties && w.properties.locked) {
        const need = w.properties.requiredKey;
        if (need && rpgKeys.has(need)) {
          w.properties.locked = false;
          w.alive = false;
          score += 50;
          SFX.door();
          rpgMsg = "Дверь открыта!";
          rpgMsgTimer = 1.6;
          spawnParticles(w.x + w.width / 2, w.y + w.height / 2, "#FFD700", 14, "collect");
          continue;
        }
        solid = true;
        if (rectOverlap(hero, w) && rpgMsgTimer <= 0) {
          rpgMsg = "Нужен ключ: " + (need || "?");
          rpgMsgTimer = 1.6;
        }
      }
      if (!solid || !rectOverlap(hero, w)) continue;
      const pr = hero.x + hero.width - w.x;
      const pl = (w.x + w.width) - hero.x;
      const pt = hero.y + hero.height - w.y;
      const pb = (w.y + w.height) - hero.y;
      const m = Math.min(pr, pl, pt, pb);
      if (m === pt) hero.y = w.y - hero.height;
      else if (m === pb) hero.y = w.y + w.height;
      else if (m === pr) hero.x = w.x - hero.width;
      else hero.x = w.x + w.width;
    }
  }
}

function renderRpgOverlay(camX, camY) {
  // swing arc
  if (rpgSwing > 0 && hero) {
    const hx = hero.x + hero.width / 2 - camX;
    const hy = hero.y + hero.height / 2 - camY;
    const range = (hero.properties && hero.properties.attackRange) || 60;
    const dir = hero.facing >= 0 ? 0 : Math.PI;
    ctx.strokeStyle = "rgba(255,235,120," + (rpgSwing / 0.16) + ")";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(hx, hy, range * 0.8, dir - 1.1, dir + 1.1);
    ctx.stroke();
  }

  // keys HUD
  if (rpgKeys.size > 0) {
    ctx.textAlign = "right";
    ctx.font = "bold 16px monospace";
    ctx.fillStyle = "#FFD700";
    let ky = 36;
    for (const k of rpgKeys) {
      ctx.fillText("🔑 " + k, W - 24, ky);
      ky += 24;
    }
  }

  // message
  if (rpgMsgTimer > 0) {
    ctx.globalAlpha = Math.min(1, rpgMsgTimer);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px monospace";
    ctx.fillText(rpgMsg, W / 2, H - 64);
    ctx.globalAlpha = 1;
  }

  // hint
  ctx.textAlign = "center";
  ctx.fillStyle = "#777777";
  ctx.font = "13px monospace";
  ctx.fillText(uiText("ui.hintBrawler"), W / 2, H - 10);
}
// ---------- END RPG MODE ----------

function rectOverlap(a, b) {
  return a.x < b.x + b.width && a.x + a.width > b.x &&
         a.y < b.y + b.height && a.y + a.height > b.y;
}

function render() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  if (gameState !== "playing" || !levelData) return;

  if (chessMode) {
    renderChess();
    return;
  }

  if (puzzleMode) {
    renderPuzzle();
    return;
  }

  if (tdMode) {
    renderTd();
    return;
  }

  if (shooterMode) {
    renderShooter();
    return;
  }

  if (raceMode) {
    renderRacing();
    return;
  }

  const camX = Math.round(camera.x + camera.shakeX);
  const camY = Math.round(camera.y + camera.shakeY);

  drawBackground(camX, camY);
  ctx.save();
  ctx.translate(-camX, -camY);
  drawEntities(camX, camY);
  drawVisionCones();
  drawParticles();
  ctx.restore();
  drawGroundLine(camY);
  drawHUD();

  if (rpgMode) {
    renderRpgOverlay(camX, camY);
  }

  if (darkMode && hero) {
    const r = darkRadius();
    const hx = hero.x + hero.width / 2 - camX;
    const hy = hero.y + hero.height / 2 - camY;
    const g = ctx.createRadialGradient(hx, hy, r * 0.45, hx, hy, r * 1.12);
    g.addColorStop(0, "rgba(3,3,10,0)");
    g.addColorStop(1, "rgba(3,3,10,0.95)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  if (damageFlash > 0) {
    ctx.fillStyle = "rgba(255,0,0," + (damageFlash * 0.35) + ")";
    ctx.fillRect(0, 0, W, H);
  }

  if (paused) {
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#00ff88";
    ctx.font = "bold 48px monospace";
    ctx.textAlign = "center";
    ctx.fillText(uiText("ui.paused"), W / 2, H / 2 - 20);
    ctx.fillStyle = "#888";
    ctx.font = "20px monospace";
    ctx.fillText(uiText("ui.pressEsc"), W / 2, H / 2 + 30);
  }

  if (fadeAlpha > 0) {
    ctx.fillStyle = "rgba(0,0,0," + fadeAlpha + ")";
    ctx.fillRect(0, 0, W, H);
  }

  if (showControls && controlsTimer > 0) {
    const a = Math.min(controlsTimer, 1);
    ctx.fillStyle = "rgba(0,0,0," + (a * 0.85) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(0,255,136," + a + ")";
    ctx.font = "bold 36px monospace";
    ctx.textAlign = "center";
    ctx.fillText(uiText("ui.controls"), W / 2, H / 2 - 100);
    ctx.fillStyle = "rgba(200,220,240," + a + ")";
    ctx.font = "20px monospace";
    const lines = chessMode ? [
      uiText("ui.ctlClickMove"),
      uiText("ui.ctlClickAttack"),
      uiText("ui.ctlEsc")
    ] : [
      uiText("ui.ctlArrows"),
      uiText("ui.ctlSpace"),
      uiText("ui.ctlEsc")
    ];
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], W / 2, H / 2 - 30 + i * 40);
    }
    ctx.fillStyle = "rgba(0,255,136," + (a * 0.5) + ")";
    ctx.font = "14px monospace";
    ctx.fillText(uiText("ui.fadesAway"), W / 2, H / 2 + 120);
  }
}

function drawBackground(camX, camY) {
  const colors = getThemeColors(gameData.settings && gameData.settings.theme);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, colors[0]);
  grad.addColorStop(0.5, colors[1]);
  grad.addColorStop(1, colors[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function drawEntities(camX, camY) {
  const sorted = entities.slice().sort((a, b) => (a.z || 0) - (b.z || 0));
  for (let i = 0; i < sorted.length; i++) {
    const e = sorted[i];
    if (!e.alive && e.type !== "decoration" && e.type !== "spawn_point") continue;
    if (e.type === "spawn_point") continue;
    if (darkMode && hero && e.health > 0 && (e.type === "enemy" || e.type === "boss") &&
        e.properties && (e.properties.visibleInLight || e.properties.phaseInWalls) &&
        heroLitDist(e) > darkRadius()) continue;

    const sx = e.x;
    const sy = e.y;
    const sw = e.width;
    const sh = e.height;
    if (sx + sw < camX - 200 || sx > camX + W + 200 || sy + sh < camY - 200 || sy > camY + H + 200) continue;

    ctx.globalAlpha = 1;

    switch (e.type) {
      case "hero": case "player": drawHero(e, sx, sy, sw, sh); break;
      case "platform": drawPlatform(e, sx, sy, sw, sh); break;
      case "moving_platform": drawMovingPlatform(e, sx, sy, sw, sh); break;
      case "enemy": drawEnemy(e, sx, sy, sw, sh); break;
      case "boss": drawBoss(e, sx, sy, sw, sh); break;
      case "pickup": case "collectible": drawPickup(e, sx, sy, sw, sh); break;
      case "powerup": drawPowerup(e, sx, sy, sw, sh); break;
      case "finish": drawFinish(e, sx, sy, sw, sh); break;
      case "decoration": drawDecoration(e, sx, sy, sw, sh); break;
      case "hazard": drawHazard(e, sx, sy, sw, sh); break;
      case "checkpoint": drawCheckpoint(e, sx, sy, sw, sh); break;
      case "trigger": drawTrigger(e, sx, sy, sw, sh); break;
      case "portal": drawPortal(e, sx, sy, sw, sh); break;
      case "boundary": ctx.fillStyle = stripAlpha(e.color) || "#333"; ctx.fillRect(sx, sy, sw, sh); break;
      case "zone": ctx.fillStyle = (e.properties && e.properties.zoneColor) || e.color || "rgba(255,255,255,0.05)"; ctx.fillRect(sx, sy, sw, sh); break;
      default:
        ctx.fillStyle = stripAlpha(e.color) || "#888";
        ctx.fillRect(sx, sy, sw, sh);
    }
    ctx.globalAlpha = 1;
  }
}

function drawHero(e, sx, sy, sw, sh) {
  if (e.invincible > 0 && Math.floor(e.invincible * 10) % 2 === 0) return;
  const c = stripAlpha(e.color) || "#8BC34A";

  ctx.fillStyle = c;
  roundRect(sx, sy, sw, sh, 6);
  ctx.fill();

  const grad = ctx.createLinearGradient(sx, sy, sx, sy + sh);
  grad.addColorStop(0, "rgba(255,255,255,0.3)");
  grad.addColorStop(1, "rgba(0,0,0,0.15)");
  ctx.fillStyle = grad;
  roundRect(sx, sy, sw, sh, 6);
  ctx.fill();

  const eyeY = sy + sh * 0.28;
  const eyeR = Math.max(3, sw * 0.07);
  const fwd = e.facing || 1;

  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(sx + sw * 0.32 + fwd * 4, eyeY, eyeR + 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(sx + sw * 0.68 + fwd * 4, eyeY, eyeR + 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(sx + sw * 0.32 + fwd * 6, eyeY, eyeR * 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(sx + sw * 0.68 + fwd * 6, eyeY, eyeR * 0.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.fillRect(sx + 4, sy + 4, sw * 0.35, 5);

  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.fillRect(sx + 2, sy + sh - 6, sw - 4, 6);

  if (e.health < e.maxHealth) {
    drawHealthBar(sx, sy - 14, sw, 7, e.health, e.maxHealth, "#00ff44");
  }
}

function drawPlatform(e, sx, sy, sw, sh) {
  ctx.fillStyle = stripAlpha(e.color) || "#4a7c3f";
  ctx.fillRect(sx, sy, sw, sh);

  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.fillRect(sx, sy, sw, 3);

  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.fillRect(sx, sy + sh - 3, sw, 3);

  const surface = e.properties && e.properties.surface;
  if (surface === "grass") {
    ctx.fillStyle = "rgba(100,200,100,0.25)";
    for (let x = sx; x < sx + sw; x += 16) {
      ctx.fillRect(x, sy - 2, 3, 5);
    }
  } else if (surface === "stone") {
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    for (let x = sx + 8; x < sx + sw - 8; x += 24) {
      ctx.fillRect(x, sy + sh / 2, 16, 2);
    }
  }
}

function drawMovingPlatform(e, sx, sy, sw, sh) {
  const axis = e.properties.axis || "vertical";
  const range = e.properties.range || 200;

  ctx.save();
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  if (axis === "vertical") {
    ctx.moveTo(sx + sw / 2, e.originY);
    ctx.lineTo(sx + sw / 2, e.originY + range);
  } else {
    ctx.moveTo(e.originX, sy + sh / 2);
    ctx.lineTo(e.originX + range, sy + sh / 2);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  ctx.fillStyle = stripAlpha(e.color) || "#9C27B0";
  ctx.fillRect(sx, sy, sw, sh);

  ctx.fillStyle = "rgba(255,255,255,0.22)";
  ctx.fillRect(sx, sy, sw, 3);

  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.fillRect(sx + 4, sy + sh / 2 - 1, sw - 8, 2);
}

function drawEnemy(e, sx, sy, sw, sh) {
  if (!e.alive) return;
  if (e.flashTimer > 0) {
    ctx.fillStyle = "#ffffff";
  } else {
    ctx.fillStyle = stripAlpha(e.color) || "#76FF03";
  }
  roundRect(sx, sy, sw, sh, 5);
  ctx.fill();

  ctx.fillStyle = "rgba(0,0,0,0.2)";
  roundRect(sx + 2, sy + sh * 0.65, sw - 4, sh * 0.3, 2);
  ctx.fill();

  const eyeW = Math.max(4, sw * 0.13);
  const eyeH = Math.max(3, sh * 0.1);
  const eyeY2 = sy + sh * 0.22;

  ctx.fillStyle = "#fff";
  ctx.fillRect(sx + sw * 0.22, eyeY2, eyeW + 3, eyeH + 2);
  ctx.fillRect(sx + sw * 0.58, eyeY2, eyeW + 3, eyeH + 2);

  ctx.fillStyle = "#cc0000";
  ctx.fillRect(sx + sw * 0.24, eyeY2 + 2, eyeW, eyeH);

  ctx.fillRect(sx + sw * 0.60, eyeY2 + 2, eyeW, eyeH);

  ctx.fillStyle = "rgba(200,0,0,0.5)";
  ctx.fillRect(sx + sw * 0.3, eyeY2 - 2, eyeW * 0.4, 2);
  ctx.fillRect(sx + sw * 0.66, eyeY2 - 2, eyeW * 0.4, 2);

  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fillRect(sx + 2, sy + sh - 4, sw - 4, 4);

  if (e.maxHealth > 20) {
    drawHealthBar(sx, sy - 10, sw, 5, e.health, e.maxHealth, "#ff4444");
  }
}

function drawBoss(e, sx, sy, sw, sh) {
  if (!e.alive) return;
  if (e.flashTimer > 0) {
    ctx.fillStyle = "#ffffff";
  } else {
    ctx.fillStyle = stripAlpha(e.color) || "#76FF03";
  }
  roundRect(sx, sy, sw, sh, 10);
  ctx.fill();

  ctx.fillStyle = "rgba(0,0,0,0.2)";
  roundRect(sx + 4, sy + sh * 0.6, sw - 8, sh * 0.35, 6);
  ctx.fill();

  const phaseColors = ["#ffffff", "#ffaa00", "#ff4400"];
  const pc = phaseColors[Math.min(e.bossPhase, 2)];
  ctx.strokeStyle = pc;
  ctx.lineWidth = 3;
  roundRect(sx - 3, sy - 3, sw + 6, sh + 6, 12);
  ctx.stroke();

  const eyeW = Math.max(8, sw * 0.11);
  const eyeH = Math.max(6, sh * 0.09);
  const eyeY2 = sy + sh * 0.2;
  ctx.fillStyle = "#fff";
  ctx.fillRect(sx + sw * 0.18, eyeY2, eyeW + 5, eyeH + 3);
  ctx.fillRect(sx + sw * 0.58, eyeY2, eyeW + 5, eyeH + 3);
  ctx.fillStyle = e.bossPhase >= 2 ? "#ff0000" : "#cc0000";
  ctx.fillRect(sx + sw * 0.20, eyeY2 + 2, eyeW, eyeH);
  ctx.fillRect(sx + sw * 0.60, eyeY2 + 2, eyeW, eyeH);

  if (e.bossCharging) {
    ctx.fillStyle = "rgba(255,100,0,0.3)";
    ctx.fillRect(sx - 10, sy, sw + 20, sh);
  }

  drawHealthBar(sx, sy - 18, sw, 9, e.health, e.maxHealth, "#ff2222");
  ctx.fillStyle = pc;
  ctx.font = "bold 11px monospace";
  ctx.textAlign = "center";
  ctx.fillText(uiText("ui.phase") + " " + (e.bossPhase + 1), sx + sw / 2, sy - 22);
}

function drawPickup(e, sx, sy, sw, sh) {
  if (!e.active || !e.alive) return;
  e.animTimer += 0.025;
  const bob = Math.sin(e.animTimer * 3) * 5;
  const py = sy + bob;
  const pulse = 0.7 + Math.sin(e.animTimer * 4) * 0.3;
  const c = stripAlpha(e.color) || "#FFD700";
  const isHealth = e.properties && e.properties.pickupType === "health";

  ctx.save();
  ctx.globalAlpha = 0.35 * pulse;
  const glowR = sw * 2 * pulse;
  const grd = ctx.createRadialGradient(sx + sw / 2, py + sh / 2, 0, sx + sw / 2, py + sh / 2, glowR);
  grd.addColorStop(0, c);
  grd.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grd;
  ctx.fillRect(sx + sw / 2 - glowR, py + sh / 2 - glowR, glowR * 2, glowR * 2);

  ctx.globalAlpha = 1;
  ctx.fillStyle = c;
  if (isHealth) {
    const hs = sw * 0.55 * pulse;
    ctx.fillRect(sx + sw / 2 - hs / 2, py + sh / 2 - hs / 4, hs, hs / 2);
    ctx.fillRect(sx + sw / 2 - hs / 4, py + sh / 2 - hs / 2, hs / 2, hs);
  } else {
    const hs = sw * 0.5 * pulse;
    ctx.beginPath();
    ctx.moveTo(sx + sw / 2, py + sh / 2 - hs / 2);
    ctx.lineTo(sx + sw / 2 + hs / 2, py + sh / 2);
    ctx.lineTo(sx + sw / 2, py + sh / 2 + hs / 2);
    ctx.lineTo(sx + sw / 2 - hs / 2, py + sh / 2);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.fillRect(sx + sw / 2 - sw * 0.15, py + sh / 2 - sh * 0.15, sw * 0.15, 3);
  ctx.restore();
}

function drawPowerup(e, sx, sy, sw, sh) {
  if (!e.active || !e.alive) return;
  e.animTimer += 0.03;
  const pulse = 0.7 + Math.sin(e.animTimer * 5) * 0.3;
  const c = stripAlpha(e.color) || "#00ffff";
  const bob = Math.sin(e.animTimer * 2) * 4;
  const py = sy + bob;
  ctx.save();
  ctx.globalAlpha = 0.4 * pulse;
  const glowR = sw * 2.5 * pulse;
  const grd = ctx.createRadialGradient(sx + sw / 2, py + sh / 2, 0, sx + sw / 2, py + sh / 2, glowR);
  grd.addColorStop(0, c);
  grd.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grd;
  ctx.fillRect(sx + sw / 2 - glowR, py + sh / 2 - glowR, glowR * 2, glowR * 2);
  ctx.globalAlpha = 1;
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.arc(sx + sw / 2, py + sh / 2, sw * 0.35 * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.beginPath();
  ctx.arc(sx + sw / 2 - sw * 0.08, py + sh / 2 - sh * 0.1, sw * 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFinish(e, sx, sy, sw, sh) {
  if (!e.active) return;
  const t = e.animTimer;
  e.animTimer = (e.animTimer || 0) + 0.025;
  const glow = 0.5 + Math.sin(t * 3) * 0.5;

  ctx.save();
  ctx.globalAlpha = 0.4 * glow;
  const grd = ctx.createRadialGradient(sx + sw / 2, sy + sh / 2, 0, sx + sw / 2, sy + sh / 2, sw * 2.5);
  grd.addColorStop(0, "#FFD700");
  grd.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grd;
  ctx.fillRect(sx - sw * 1.5, sy - sh, sw * 4, sh * 3);

  ctx.globalAlpha = 1;
  ctx.fillStyle = "#FFD700";
  roundRect(sx, sy, sw, sh, 6);
  ctx.fill();

  const inner = ctx.createLinearGradient(sx, sy, sx, sy + sh);
  inner.addColorStop(0, "rgba(255,255,255,0.35)");
  inner.addColorStop(1, "rgba(0,0,0,0.1)");
  ctx.fillStyle = inner;
  roundRect(sx, sy, sw, sh, 6);
  ctx.fill();

  ctx.fillStyle = "rgba(30,30,60,0.7)";
  ctx.font = "bold " + Math.max(16, sw * 0.35) + "px monospace";
  ctx.textAlign = "center";
  ctx.fillText("\u25B6", sx + sw / 2, sy + sh * 0.68);
  ctx.restore();
}

function drawDecoration(e, sx, sy, sw, sh) {
  const z = e.z || 0;
  let alpha = 0.85;
  if (z < 0) alpha = Math.min(0.9, 0.25 + Math.abs(z) * 0.15);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = stripAlpha(e.color) || "#2E7D32";

  if (z <= -2) {
    roundRect(sx, sy, sw, sh, sw * 0.2);
    ctx.fill();
  } else {
    ctx.fillRect(sx, sy, sw, sh);
  }

  if (z < -1) {
    ctx.fillStyle = "rgba(255,255,255,0.06)";
    ctx.fillRect(sx, sy, sw, sh * 0.4);
  }
  ctx.globalAlpha = 1;
}

function drawHazard(e, sx, sy, sw, sh) {
  if (!e.active) return;
  const t = Date.now() * 0.003;
  const pulse = 0.5 + Math.sin(t + sx * 0.1) * 0.5;
  const c = stripAlpha(e.color) || "#B71C1C";
  const periodic = e.hazardActive !== undefined && e.properties && e.properties.interval;

  if (periodic && !e.hazardActive) {
    ctx.save();
    ctx.globalAlpha = e.hazardWarn ? (0.25 + Math.abs(Math.sin(Date.now() * 0.02)) * 0.35) : 0.15;
    ctx.fillStyle = c;
    ctx.fillRect(sx, sy, sw, sh);
    ctx.strokeStyle = c;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(sx + 1, sy + 1, sw - 2, sh - 2);
    ctx.setLineDash([]);
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.globalAlpha = 0.4 + pulse * 0.6;
  ctx.fillStyle = c;
  ctx.fillRect(sx, sy, sw, sh);

  const spikeCount = Math.max(2, Math.floor(sw / 15));
  const spikeW = sw / spikeCount;
  ctx.fillStyle = c;
  for (let i = 0; i < spikeCount; i++) {
    ctx.beginPath();
    ctx.moveTo(sx + i * spikeW, sy + sh);
    ctx.lineTo(sx + i * spikeW + spikeW / 2, sy + sh * 0.2);
    ctx.lineTo(sx + i * spikeW + spikeW, sy + sh);
    ctx.closePath();
    ctx.fill();
  }

  ctx.globalAlpha = 0.15 * pulse;
  ctx.fillStyle = "#ff0000";
  ctx.fillRect(sx - 6, sy - 6, sw + 12, sh + 12);
  ctx.restore();
}

function drawCheckpoint(e, sx, sy, sw, sh) {
  const active = e.checked;
  const t = Date.now() * 0.002;

  ctx.fillStyle = active ? "#00ff88" : "#555555";
  ctx.fillRect(sx + sw / 2 - 2, sy + 8, 4, sh - 8);

  ctx.fillStyle = active ? "#00ff88" : "#777777";
  ctx.beginPath();
  ctx.arc(sx + sw / 2, sy + 6, 7, 0, Math.PI * 2);
  ctx.fill();

  if (active) {
    ctx.save();
    ctx.globalAlpha = 0.25 + Math.sin(t * 2) * 0.15;
    const grd = ctx.createRadialGradient(sx + sw / 2, sy + 6, 0, sx + sw / 2, sy + 6, 35);
    grd.addColorStop(0, "#00ff88");
    grd.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grd;
    ctx.fillRect(sx - 25, sy - 25, sw + 50, 70);
    ctx.restore();
  }
}

function drawTrigger(e, sx, sy, sw, sh) {
  if (e.triggered) return;
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = stripAlpha(e.color) || "#ffffff";
  ctx.fillRect(sx, sy, sw, sh);
  ctx.restore();
}

function drawPortal(e, sx, sy, sw, sh) {
  if (!e.active) return;
  const t = Date.now() * 0.003;
  ctx.save();

  const grad = ctx.createLinearGradient(sx, sy, sx + sw, sy + sh);
  grad.addColorStop(0, "#9C27B0");
  grad.addColorStop(0.5, "#E040FB");
  grad.addColorStop(1, "#9C27B0");
  ctx.fillStyle = grad;
  roundRect(sx, sy, sw, sh, sw / 2);
  ctx.fill();

  ctx.globalAlpha = 0.3 + Math.sin(t) * 0.2;
  const grd = ctx.createRadialGradient(sx + sw / 2, sy + sh / 2, 0, sx + sw / 2, sy + sh / 2, sw);
  grd.addColorStop(0, "#E040FB");
  grd.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grd;
  ctx.fillRect(sx - sw / 2, sy - sh / 2, sw * 2, sh * 2);

  ctx.globalAlpha = 0.6;
  ctx.fillStyle = "#fff";
  ctx.font = "bold " + Math.max(10, sw * 0.3) + "px monospace";
  ctx.textAlign = "center";
  ctx.fillText("\u21BB", sx + sw / 2, sy + sh * 0.65);

  ctx.restore();
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    const s = p.size * alpha;
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

function drawGroundLine(camY) {
  const s = getSettings();
  const wh = s.worldHeight || 1080;
  if (wh - 1 < camY - 20 || wh - 1 > camY + H + 20) return;
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  ctx.fillRect(0, wh - 1, W, 2);
}

function drawHealthBar(x, y, w, h, cur, max, color) {
  const ratio = Math.max(0, cur / Math.max(1, max));
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  roundRect(x - 1, y - 1, w + 2, h + 2, 2);
  ctx.fill();
  ctx.fillStyle = "#222";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * ratio, h);
  ctx.strokeStyle = "rgba(255,255,255,0.2)";
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
}

function drawHUD() {
  const hudPad = 24;
  const hudY = 24;

  if (runnerMode && runnerRivals.length > 0 && hero) {
    let pos = 1;
    for (const rv of runnerRivals) if (rv.x > hero.x) pos++;
    ctx.textAlign = "center";
    ctx.font = "bold 20px monospace";
    ctx.fillStyle = pos === 1 ? "#FFD700" : "#ffffff";
    ctx.fillText(uiText("ui.pos") + pos + "/" + (runnerRivals.length + 1), W / 2, 36);
  }

  if (diverMode) {
    const bw = 150, bh = 14, bx = W - bw - 24, by = 24;    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    const r = Math.max(0, diverO2 / (diverO2Max || 1));
    const blink = r < 0.25 && Math.floor(Date.now() / 220) % 2 === 0;
    ctx.fillStyle = blink ? "#ff4444" : "#4FC3F7";
    ctx.fillRect(bx, by, bw * r, bh);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 10px monospace";
    ctx.textAlign = "center";
    ctx.fillText("O₂ " + Math.ceil(r * 100) + "%", bx + bw / 2, by + bh - 3);
  }

  if (hero) {
    const barW = Math.min(220, W * 0.2);
    const barH = 18;

    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect(hudPad - 2, hudY - 2, barW + 4, barH + 4, 5);
    ctx.fill();

    const hpRatio = Math.max(0, hero.health / Math.max(1, hero.maxHealth));
    let hpColor = "#00ff44";
    if (hpRatio < 0.25) hpColor = "#ff2222";
    else if (hpRatio < 0.55) hpColor = "#ffaa00";

    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(hudPad, hudY, barW, barH);
    ctx.fillStyle = hpColor;
    ctx.fillRect(hudPad, hudY, barW * hpRatio, barH);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText(Math.ceil(hero.health) + " / " + hero.maxHealth, hudPad + barW / 2, hudY + barH / 2 + 4);
    ctx.textAlign = "left";
  }

  ctx.fillStyle = "#00ff88";
  ctx.font = "bold 22px monospace";
  ctx.textAlign = "right";
  ctx.fillText(uiText("ui.score") + score, W - hudPad, hudY + 18);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 18px monospace";
  const lvlName = levelData ? levelData.name : "";
  ctx.fillText(lvlName, W / 2, hudY + 14);

  if (timeLeft > 0) {
    ctx.fillStyle = timeLeft < 30 ? "#ff4444" : "#ffcc00";
    ctx.font = "bold 15px monospace";
    ctx.fillText(Math.ceil(timeLeft) + "s", W / 2, hudY + 36);
  }

  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.font = "12px monospace";
  ctx.textAlign = "left";
  ctx.fillText(uiText("ui.fps") + fps, hudPad, H - hudPad);

  const totalLevels = gameData ? gameData.levels.length : 1;
  ctx.textAlign = "right";
  ctx.fillText(uiText("ui.level") + " " + (currentLevelIdx + 1) + " / " + totalLevels, W - hudPad, H - hudPad);
}

function roundRect(x, y, w, h, r) {
  if (w < 0 || h < 0) return;
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function showVictory() {
  gameState = "victory";
  SFX.win();
  try {
    const p = loadProgress();
    saveProgress({
      bestScore: Math.max(p.bestScore || 0, score),
      completed: true,
      unlockedLevel: gameData ? gameData.levels.length : (p.unlockedLevel || 0)
    });
  } catch (e) {}
  victoryStats = {
    score: score,
    levels: gameData ? gameData.levels.length : 0,
    kills: totalEnemiesKilled,
    pickups: totalPickupsCollected,
    deaths: totalDeaths,
    time: Math.floor((Date.now() - levelStartTime) / 1000)
  };
}

function drawVictory() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  const t = Date.now() * 0.001;

  const grd = ctx.createRadialGradient(W / 2, H / 2 - 180, 0, W / 2, H / 2 - 180, 300);
  grd.addColorStop(0, "rgba(0,255,136,0.15)");
  grd.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 0.7 + Math.sin(t * 2) * 0.3;
  ctx.fillStyle = "#00ff88";
  ctx.font = "bold 56px monospace";
  ctx.textAlign = "center";
  ctx.fillText(uiText("ui.victory"), W / 2, H / 2 - 180);
  ctx.globalAlpha = 1;

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px monospace";
  ctx.fillText(uiText("ui.congrats"), W / 2, H / 2 - 130);

  if (victoryStats) {
    const s = victoryStats;
    const lines = [
      ["Score", s.score],
      ["Levels Completed", s.levels],
      ["Enemies Defeated", s.kills],
      ["Pickups Collected", s.pickups],
      ["Deaths", s.deaths],
      ["Total Time", s.time + "s"]
    ];
    ctx.font = "17px monospace";
    for (let i = 0; i < lines.length; i++) {
      const y = H / 2 - 60 + i * 34;
      ctx.fillStyle = i === 0 ? "#FFD700" : "#aaaaaa";
      ctx.textAlign = "right";
      ctx.fillText(lines[i][0] + ":", W / 2 + 10, y);
      ctx.fillStyle = i === 0 ? "#FFD700" : "#ffffff";
      ctx.textAlign = "left";
      ctx.fillText(String(lines[i][1]), W / 2 + 20, y);
    }
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(0,255,136,0.5)";
  ctx.font = "15px monospace";
  const blink = Math.sin(t * 3) > 0;
  if (blink) ctx.fillText(uiText("ui.pressRMenu"), W / 2, H / 2 + 170);
}

let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  for (const k in justPressed) justPressed[k] = false;
  for (const k in keys) {
    if (keys[k] && !prevKeys[k]) justPressed[k] = true;
  }
  prevKeys = {};
  for (const k in keys) prevKeys[k] = keys[k];

  if (isPause()) {
    if (gameState === "playing") {
      paused = !paused;
    } else if (gameState === "victory") {
      gameState = "playing";
      startGame();
    }
  }

  if (justPressed.KeyM && gameState !== "boot") {
    audioMuted = !audioMuted;
    try { localStorage.setItem("limedrive_muted", audioMuted ? "1" : "0"); } catch (e) {}
    if (!audioMuted) beep(880, 0.08, "triangle", 0.04);
  }

  if (justPressed.KeyF) {
    try {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(function () {});
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
    } catch (e) {}
  }

  if (gameState === "victory" && justPressed.KeyR) {
    gameState = "playing";
    startGame();
  }

  controlsTimer = Math.max(0, controlsTimer - dt);
  if (controlsTimer <= 0) showControls = false;

  if (gameState === "playing" && !paused) {
    update(dt);
  }

  render();

  if (gameState === "victory") {
    drawVictory();
  }

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
loadFromURL();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("../sw.js").catch(() => {});
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" &&
      gameState === "playing" && !paused && !levelTransitioning) {
    paused = true;
  }
});

window.LimeDriveDebug = function () {
  return {
    gameState: gameState,
    score: score,
    level: currentLevelIdx,
    mode: chessMode ? "chess" : (puzzleMode ? "puzzle" : (tdMode ? "td" : (shooterMode ? "shooter" : (raceMode ? "racing" : (rpgMode ? "rpg" : (runnerMode ? "runner" : "platformer")))))),
    movesLeft: puzzleMovesLeft,
    entityCount: entities.length,
    heroPos: hero ? { x: hero.x, y: hero.y } : null,
    race: raceMode ? { angleDeg: Math.round(raceAngle * 180 / Math.PI),
      speed: Math.round(raceSpeed * 10) / 10, nextCp: raceNextCp,
      cpsTotal: raceCps.length, lap: raceLap, lapsReq: raceLapsReq,
      aiCount: raceAi.length } : null,
    rpg: rpgMode ? { keys: [...rpgKeys], atkCd: Math.round(rpgAtkCd * 100) / 100,
      enemiesAlive: entities.filter(e => (e.type === "enemy" || e.type === "boss") && e.health > 0).length } : null,
    runner: runnerMode ? { rivals: runnerRivals.length,
      pos: 1 + runnerRivals.filter(rv => rv.x > hero.x).length,
      worldRight: Math.round(runnerWorldRight) } : null,
    diver: diverMode ? { o2: Math.round(diverO2 * 10) / 10, o2Max: diverO2Max,
      hp: hero ? hero.health : 0 } : null,
    grav: hero && hero._gravField ? hero._gravField : null,
    chess: chessMode ? (function () {
      var list = [];
      var bss = (getSettings().gridSize || 8) - 1;
      for (var qy = 0; qy <= bss; qy++) for (var qx = 0; qx <= bss; qx++) {
        var qp = getChessPiece(qx, qy);
        if (qp) list.push({ x: qx, y: qy, side: qp.side, t: qp.props.pieceType, tr: qp.props.tier || null, el: qp.props.elem || (qp.props.hybrid ? qp.props.hybrid.join(":") : null), hp: qp.health });
      }
      return { turn: chessTurn, valid: chessValidMoves.length,
        playerPieces: countChessPieces("player"), enemyPieces: countChessPieces("enemy"),
        damkas: countChessDamkas(), chainLock: chessChainLock, pieces: list,
        sel: chessSelected, msg: chessMessage, targets: chessValidMoves,
        qi: getSettings().variant === "qi" ? (function () {
          var pl = null, en = null;
          for (var i2 = 0; i2 < list.length; i2++) {
            if (list[i2].side === "player") pl = list[i2];
            if (list[i2].side === "enemy") en = list[i2];
          }
          var plp = pl ? getChessPiece(pl.x, pl.y) : null;
          var enp = en ? getChessPiece(en.x, en.y) : null;
          return plp ? { x: pl.x, y: pl.y, pHp: plp.health,
            pEnergy: plp.props.energy != null ? plp.props.energy : 3,
            pTempo: plp.props.tempo || 0,
            eHp: enp ? enp.health : 0, eTempo: enp ? (enp.props.tempo || 0) : 0 } : null;
        })() : null };
    })() : null,
    dark: darkMode && hero ? { r: Math.round(darkRadius()),
      ghostsVisible: entities.filter(e => (e.type === "enemy" || e.type === "boss") && e.health > 0 &&
        e.properties && (e.properties.visibleInLight || e.properties.phaseInWalls) &&
        heroLitDist(e) <= darkRadius()).length } : null,
    stealth: stealthMode ? { cones: entities.filter(e => e.properties && e.properties.visionRange != null && e.alive).length,
      alerted: entities.filter(e => e.alertT > 0).length,
      hacksDone: entities.filter(e => e.properties && e.properties.hackTime != null && e.done).length } : null,
    onFinish: hero ? entities.some(e => e.type === "finish" && e.alive && rectOverlap(hero, e)) : false,
    levelTransitioning: levelTransitioning,
    sh: shooterMode ? { dbg: shDbg, bullets: shBullets.length, ebullets: shEnemyBullets.length,
      alive: entities.filter(e => (e.type === "enemy" || e.type === "boss") && e.health > 0).length,
      eps: entities.filter(e => (e.type === "enemy" || e.type === "boss") && e.health > 0)
        .map(e => ({ id: e.id, x: Math.round(e.x), y: Math.round(e.y), hp: e.health }))
    } : null,
    td: tdMode ? {
      gold: tdGold, lives: tdLives, wave: tdWaveNum, wavesTotal: tdWaves.length,
      enemies: tdEnemies.length, queue: tdSpawnQueue.length,
      towers: tdTowers.length, intermission: Math.max(0, tdIntermission),
      gameOver: tdGameOver
    } : null,
    audio: { muted: audioMuted, ready: !!(_actx && _actx.state === "running") },
    paused: paused,
    fullscreen: !!document.fullscreenElement,
    progress: loadProgress()
  };
};
})();
</script>
